<div id="root"><div id="boot">Loading the closing sheet…</div></div>
<div id="gate" hidden><div class="box">
  <h1>Which kitchen are you closing?</h1>

<script type="text/babel" data-presets="react">
/* ══ CLOSING CHECKLIST — standalone ═══════════════════════════════════════════════════════
   The same module the IOS Closing tab mounts, with a local store instead of OrderCore's kv.
   For staff with no app login: open the link, pick the venue, close the kitchen.
   Records live in this browser unless a backend is connected under Setup → Connection.
   ════════════════════════════════════════════════════════════════════════════════════════ */
/* CLO-START — Closing checklist (2026-09-11)
   ═══════════════════════════════════════════════════════════════════════════════════════
   Ju An: "주방 마감 체크리스트. 호주 food standard 에 맞춰야 되고 council 이 venue 검사
   하러 왔을 때 증빙할 수 있는 evidence. Prep list 랑 ordering 도 추적. 마감할 땐 빨리 하고
   집에 가는 게 제일 행복한 사람들이니까."

   SELF-CONTAINED ON PURPOSE. This block defines `window.HideoutClosing` and depends on
   nothing but React. The host supplies a tiny store adapter, so the same source runs:
     · inside IOS  (01_ordering-app) as the Closing tab, storing through OrderCore's kv
     · standalone  (closing-standalone.html) for casuals with no app login
     · inside RCC  — not mounted; RCC only gets a header button that links out
   Everything a venue differs on (fridge units, equipment, tasks, prep template, supervisor
   email) is CONFIG, editable in the app — never hardcoded here beyond a sane default.

   THE SPEED RULE that shapes every screen below: the happy path is taps, the unhappy path
   is where the writing happens. A normal close should be under three minutes. The moment
   something is out of range, the form stops being fast and starts demanding a corrective
   action — which is exactly the record an EHO asks for.
   ═══════════════════════════════════════════════════════════════════════════════════════ */
(function(){
"use strict";
var React = window.React;
var useState = React.useState, useEffect = React.useEffect, useMemo = React.useMemo, useRef = React.useRef;

/* ── dates: LOCAL calendar, never toISOString (same rule as OrderCore) ───────────────── */
function pad2(n){ return (n<10?"0":"")+n; }
function localISO(d){ d=d||new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function hhmm(d){ d=d||new Date(); return pad2(d.getHours())+":"+pad2(d.getMinutes()); }
function addDays(iso, n){ var p=String(iso).split("-"); var d=new Date(+p[0], +p[1]-1, +p[2]); d.setDate(d.getDate()+n); return localISO(d); }
var DOW = ["sun","mon","tue","wed","thu","fri","sat"];
function dowOf(iso){ var p=String(iso).split("-"); return DOW[new Date(+p[0], +p[1]-1, +p[2]).getDay()]; }
function prettyDate(iso){
  var p=String(iso).split("-"); var d=new Date(+p[0], +p[1]-1, +p[2]);
  var M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var W=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  return W[d.getDay()]+" "+d.getDate()+" "+M[d.getMonth()];
}
function uid(p){ return (p||"x")+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ── the default venue config ────────────────────────────────────────────────────────────
   Temperature limits and the wording of the food-safety tasks follow the Food Standards
   Code as it is applied to a QLD food business: cold holding at or below 5 °C, hot holding
   at or above 60 °C, the two-stage cooling rule (60→21 °C within 2 h, then 21→5 °C within
   4 h), receiving checks, cleaning and sanitising of food-contact surfaces, and an accurate
   probe thermometer. `critical:true` marks the ones that carry a temperature or a legal
   record — those can never be swept by "All good", they have to be answered one at a time. */
var DEFAULT_CONFIG = {
  supervisorEmail: "",
  ccEmail: "",
  units: [
    {id:"u1", name:"Fridge 1 — under bench",  kind:"fridge", min:0, max:5},
    {id:"u2", name:"Fridge 2 — tall",         kind:"fridge", min:0, max:5},
    {id:"u3", name:"Fridge 3 — display",      kind:"fridge", min:0, max:5},
    {id:"u4", name:"Freezer",                 kind:"freezer", min:-25, max:-15}
  ],
  /* Ju An 2026-09-11: "Combi oven, stoves, fryer, griddle 정도일거같은데" — plus the ones a
     closing chef also has to kill. Edit the list in Setup; it is per venue. */
  equipment: [
    {id:"e1", name:"Combi oven",              hint:"door ajar after cool-down"},
    {id:"e2", name:"Stoves / burners",        hint:"all knobs at zero"},
    {id:"e3", name:"Fryer",                   hint:"off · oil filtered · lid on"},
    {id:"e4", name:"Griddle / grill plate",   hint:"off · scraped · tray emptied"},
    {id:"e5", name:"Gas isolation valve",     hint:"main valve closed"},
    {id:"e6", name:"Extraction / rangehood",  hint:"off after the plate has cooled"},
    {id:"e7", name:"Bain-marie / hot display",hint:"off and emptied"},
    {id:"e8", name:"Sandwich press / toaster",hint:""},
    {id:"e9", name:"Dishwasher",              hint:"drained and off"}
  ],
  /* The counterweight to the list above, and the reason it exists: someone in a hurry kills
     the wrong switch and a fridge full of stock is at ambient by morning. Naming what STAYS
     on is as much a control as naming what goes off. */
  leaveOn: [
    {id:"l1", name:"All fridges & freezers"},
    {id:"l2", name:"Ice machine"},
    {id:"l3", name:"Cool room"}
  ],
  tasks: {
    food: [
      {id:"f1", label:"Hot food cooled by the 2 h / 4 h rule",  hint:"60→21 °C within 2 h, then 21→5 °C within 4 h — log it below", freq:"daily", critical:true, cooling:true},
      {id:"f2", label:"Open food covered, dated and labelled",  hint:"ready-to-eat, date-marked", freq:"daily"},
      {id:"f3", label:"Allergen items sealed and stored apart", hint:"declared allergens kept off shared shelves", freq:"daily"},
      {id:"f4", label:"Out-of-date / unsafe food discarded",    hint:"record it as wastage", freq:"daily"},
      {id:"f5", label:"Deliveries today checked on arrival",    hint:"chilled ≤5 °C · frozen hard · supplier + temp recorded", freq:"daily"}
    ],
    clean: [
      {id:"c1", label:"Benches, boards and food-contact surfaces sanitised", freq:"daily"},
      {id:"c2", label:"Dishwasher / sanitiser working",   hint:"final rinse hot, or sanitiser at the right strength", freq:"daily"},
      {id:"c3", label:"Handwash basin stocked",           hint:"soap, paper towel, warm water — nothing stacked in it", freq:"daily"},
      {id:"c4", label:"Floors, drains and mats cleaned",  freq:"daily"},
      {id:"c5", label:"Bins emptied, lids on, area clear", freq:"daily"},
      {id:"c6", label:"No pest activity seen",            hint:"droppings, gnaw marks, flies — say where if you saw any", freq:"daily"},
      {id:"c7", label:"Deep clean: extraction filters",   freq:"fri"},
      {id:"c8", label:"Deep clean: fridge seals and shelves", freq:"fri"}
    ],
    secure: [
      {id:"s1", label:"Chemicals stored away from food", freq:"daily"},
      {id:"s2", label:"Back door and windows locked",    freq:"daily"},
      {id:"s3", label:"Lights off, alarm set",           freq:"daily"}
    ]
  },
  prepTemplate: [],
  /* Weekly probe-thermometer accuracy check. An EHO will ask how you know the readings on
     this sheet are true; this is the answer. Ice slurry should read 0 °C ±1. */
  probeDay: "mon"
};

/* ── evidence helpers ───────────────────────────────────────────────────────────────── */
function tempState(unit, val){
  if(val==="" || val==null || isNaN(Number(val))) return "empty";
  var n=Number(val);
  if(n>Number(unit.max) || n<Number(unit.min)) return "bad";
  // within 1 °C of the limit — worth a glance, not a breach
  if(n>Number(unit.max)-1) return "warn";
  return "ok";
}
function dueToday(task, iso){
  var f=task.freq||"daily";
  if(f==="daily") return true;
  if(DOW.indexOf(f)>=0) return dowOf(iso)===f;
  return true;
}
function blankRecord(date, branch, branchName, dept){
  return { v:3, date:date, branch:branch, branchName:branchName||"", dept:dept||"chef",
    by:"", startedAt:new Date().toISOString(), finishedAt:"",
    temps:{}, probe:{}, checks:{}, equipment:{}, leaveOn:{},
    issues:[], cooling:[], prep:[], order:[], handover:"", waste:"",
    sent:"" };
}

/* What still stands between the person and the door. Returned as a list so the bottom bar
   can name the first one instead of just refusing to submit. */
function outstanding(rec, cfg, date){
  var out=[];
  cfg.units.forEach(function(u){
    var st=tempState(u, rec.temps[u.id]&&rec.temps[u.id].v);
    if(st==="empty") out.push({k:"temp:"+u.id, where:"Temperatures", what:u.name+" — no reading"});
    else if(st==="bad" && !(rec.temps[u.id]&&String(rec.temps[u.id].action||"").trim()))
      out.push({k:"act:"+u.id, where:"Temperatures", what:u.name+" is out of range — what did you do?"});
  });
  if((cfg.probeDay==="always" || dowOf(date)===cfg.probeDay) && !(rec.probe&&rec.probe.done))
    out.push({k:"probe", where:"Temperatures", what:"Probe thermometer check"});
  ["food","clean","secure"].forEach(function(g){
    (cfg.tasks[g]||[]).forEach(function(t){
      if(!dueToday(t,date)) return;
      if(rec.checks[t.id]!==true && rec.checks[t.id]!=="na") out.push({k:"chk:"+t.id, where:GROUP_LABEL[g], what:t.label});
    });
  });
  cfg.equipment.forEach(function(e){ if(!rec.equipment[e.id]) out.push({k:"eq:"+e.id, where:"Shut down", what:e.name}); });
  cfg.leaveOn.forEach(function(l){ if(!rec.leaveOn[l.id]) out.push({k:"on:"+l.id, where:"Shut down", what:l.name+" — confirm still running"}); });
  if(!String(rec.by||"").trim()) out.push({k:"by", where:"Sign off", what:"Your name"});
  return out;
}
var GROUP_LABEL = {food:"Food", clean:"Cleaning", secure:"Secure"};

/* A close is only evidence if it can leave the building in a form someone else reads.
   One row per line item, the same shape the email and the council export use. */
function recordToRows(rec, cfg){
  var rows=[];
  var meta=[rec.date, rec.branchName||rec.branch, rec.by||""];
  cfg.units.forEach(function(u){
    var t=rec.temps[u.id]||{};
    rows.push(meta.concat(["Temperature", u.name, (t.v===""||t.v==null?"":t.v+" C"),
      tempState(u,t.v)==="bad"?"OUT OF RANGE":"ok", t.action||""]));
  });
  if(rec.probe&&rec.probe.done) rows.push(meta.concat(["Temperature","Probe thermometer check", (rec.probe.reading!=null?rec.probe.reading+" C":""), rec.probe.ok===false?"FAILED":"ok", rec.probe.note||""]));
  (rec.cooling||[]).forEach(function(c){
    rows.push(meta.concat(["Cooling", c.food||"", (c.t0||"")+" → "+(c.t2||"")+" → "+(c.t6||""),
      c.pass===false?"FAILED":"ok", c.note||""]));
  });
  ["food","clean","secure"].forEach(function(g){
    (cfg.tasks[g]||[]).forEach(function(t){
      if(!dueToday(t, rec.date)) return;
      var v=rec.checks[t.id];
      rows.push(meta.concat([GROUP_LABEL[g], t.label, "", v===true?"done":(v==="na"?"n/a":"NOT DONE"), ""]));
    });
  });
  cfg.equipment.forEach(function(e){ rows.push(meta.concat(["Shut down", e.name, "", rec.equipment[e.id]?"off":"NOT CONFIRMED", ""])); });
  cfg.leaveOn.forEach(function(l){ rows.push(meta.concat(["Left running", l.name, "", rec.leaveOn[l.id]?"running":"NOT CONFIRMED", ""])); });
  (rec.issues||[]).forEach(function(i){ rows.push(meta.concat(["Issue", i.what||"", "", "corrective action", i.action||""])); });
  if(String(rec.waste||"").trim()) rows.push(meta.concat(["Wastage", rec.waste, "", "", ""]));
  if(String(rec.handover||"").trim()) rows.push(meta.concat(["Handover", rec.handover, "", "", ""]));
  return rows;
}
var CSV_HEAD = ["Date","Venue","Closed by","Section","Item","Reading","Result","Corrective action"];
function toCsv(rows){
  function q(s){ s=String(s==null?"":s); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
  return [CSV_HEAD].concat(rows).map(function(r){ return r.map(q).join(","); }).join("\r\n");
}

window.HideoutClosing = window.HideoutClosing || {};

  DOW:DOW, DEFAULT_CONFIG:DEFAULT_CONFIG, GROUP_LABEL:GROUP_LABEL,

})();

(function(){
"use strict";
var K = window.HideoutClosing._core;
var React=K.React, useState=K.useState, useEffect=K.useEffect, useMemo=K.useMemo, useRef=K.useRef;
var localISO=K.localISO, hhmm=K.hhmm, dowOf=K.dowOf, prettyDate=K.prettyDate, uid=K.uid;
var DEFAULT_CONFIG=K.DEFAULT_CONFIG, tempState=K.tempState, dueToday=K.dueToday;

var F=React.Fragment;

/* ── one check row ────────────────────────────────────────────────────────────────────
   The entire row is the hit target. "Skip" is deliberately smaller and separate: marking
   something not-applicable is a claim on the record, not a way past it. */
function Check({on, na, label, hint, tag, onToggle, onNa}){
  return <div className={"row"+(on?" on":"")+(na?" na":"")} role="checkbox" aria-checked={on?"true":"false"} tabIndex={0}
      onClick={onToggle} onKeyDown={function(e){ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); onToggle(); } }}>
    <span className="box" aria-hidden="true">{on?"✓":(na?"N/A":"")}</span>
    <span>
      <span className="lb">{label}</span>
      {hint? <span className="hint">{hint}</span> : null}
    </span>
    <span style={{display:"flex",gap:8,alignItems:"center"}}>
      {tag? <span className="tag">{tag}</span> : null}
      {onNa? <button type="button" className="skip" onClick={function(e){ e.stopPropagation(); onNa(); }}>{na?"undo":"n/a"}</button> : null}
    </span>
  </div>;
}

/* ── step 1 · temperatures ──────────────────────────────────────────────────────────────
   The legally load-bearing screen. A reading outside the unit's range does not merely turn
   red — it opens a corrective-action box that the close cannot finish without. That box is
   the single most useful thing on the whole sheet when an inspector reads it back. */
function TempStep({cfg, rec, set, date}){
  var probeDue = cfg.probeDay==="always" || dowOf(date)===cfg.probeDay;
  function setTemp(u, field, val){
    set(function(r){ r.temps=Object.assign({}, r.temps); r.temps[u.id]=Object.assign({v:"",action:""}, r.temps[u.id]); r.temps[u.id][field]=val; if(field==="v") r.temps[u.id].at=hhmm(); });
  }
  return <F>
    <div className="grp">Fridges &amp; freezers</div>
    <p className="note">Read each unit&rsquo;s own display or probe it. Cold holding is at or below 5&nbsp;°C; a freezer should sit around &minus;18&nbsp;°C. Anything outside the range asks you what you did about it — that answer is the record.</p>
    {cfg.units.map(function(u){
      var t=rec.temps[u.id]||{}; var st=tempState(u, t.v);
      return <F key={u.id}>
        <div className="trow">
          <span>
            <span className="nm">{u.name}</span>
            <span className="lim">safe {u.min}&nbsp;°C to {u.max}&nbsp;°C{t.at? " · entered "+t.at : ""}</span>
          </span>
          <label className={"tin "+(st==="empty"?"":st)}>
            <input type="text" inputMode="decimal" pattern="-?[0-9.]*" value={t.v==null?"":t.v}
              aria-label={u.name+" temperature in celsius"} placeholder="—"
              onChange={function(e){ setTemp(u,"v", e.target.value.replace(/[^0-9.\-]/g,"")); }} />
            <span className="u">°C</span>
          </label>
        </div>
        {st==="bad" && <div className="alert">
          <b>{u.name} is out of range.</b> Say what you did — moved the stock, turned the unit down, called the tech, threw it out. Council asks for this, not for a tidy number.
          <textarea rows={2} value={t.action||""} placeholder="e.g. moved all dairy to Fridge 2, turned thermostat down, logged a service call"
            onChange={function(e){ setTemp(u,"action", e.target.value); }} />
        </div>}
      </F>;
    })}

    {probeDue && <F>
      <div className="grp">Probe thermometer</div>
      <p className="note">Weekly accuracy check. Pack a cup with crushed ice, add a splash of water, stir, and probe it — a good thermometer reads 0&nbsp;°C give or take one. This is how you show the readings above are true.</p>
      <div className="trow">
        <span><span className="nm">Ice slurry reading</span><span className="lim">should be &minus;1 to 1&nbsp;°C</span></span>
        <label className={"tin "+(rec.probe&&rec.probe.done? (rec.probe.ok?"ok":"bad") : "")}>
          <input type="text" inputMode="decimal" value={rec.probe&&rec.probe.reading!=null?rec.probe.reading:""} placeholder="—"
            aria-label="Probe thermometer ice slurry reading"
            onChange={function(e){
              var v=e.target.value.replace(/[^0-9.\-]/g,"");
              var n=Number(v); var ok=v!=="" && !isNaN(n) && n>=-1 && n<=1;
              set(function(r){ r.probe={done:v!=="", reading:v, ok:ok, note:(r.probe&&r.probe.note)||""}; });
            }} />
          <span className="u">°C</span>
        </label>
      </div>
      {rec.probe&&rec.probe.done&&!rec.probe.ok && <div className="alert">
        <b>That probe is off.</b> Recalibrate it or take it out of service and use a spare — every reading above was taken with it.
        <textarea rows={2} value={rec.probe.note||""} placeholder="e.g. recalibrated to 0.0, or bagged and tagged, using the spare probe"
          onChange={function(e){ var v=e.target.value; set(function(r){ r.probe=Object.assign({},r.probe,{note:v}); }); }} />
      </div>}
    </F>}
  </F>;
}

/* ── the 2 h / 4 h cooling log ────────────────────────────────────────────────────────── */
function CoolingLog({rec, set}){
  var rows=rec.cooling||[];
  function upd(i, k, v){ set(function(r){ r.cooling=(r.cooling||[]).slice(); r.cooling[i]=Object.assign({}, r.cooling[i]); r.cooling[i][k]=v;
    var c=r.cooling[i]; var a=Number(c.t2), b=Number(c.t6);
    c.pass = (c.t2===""||c.t2==null||isNaN(a)? null : a<=21) === false ? false : ((c.t6===""||c.t6==null||isNaN(b)) ? null : b<=5 && a<=21);
  }); }
  return <div style={{background:"#fff"}}>
    {rows.length===0 && <div className="empty">Nothing cooling today — leave it empty. Add a line only if hot food went into the fridge to cool.</div>}
    {rows.map(function(c,i){
      return <div key={c.id||i} style={{borderBottom:"1px solid var(--line)",padding:"10px 14px"}}>
        <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}>
          <input value={c.food||""} placeholder="What was cooled (e.g. bolognese)" aria-label="Food cooled"
            style={{flex:1,minWidth:0,font:"inherit",fontSize:15,border:"2px solid var(--ink)",padding:"9px 10px",background:"#fff"}}
            onChange={function(e){ upd(i,"food",e.target.value); }} />
          <button type="button" className="x" aria-label="Remove line" style={{background:"none",border:0,color:"var(--r)",fontSize:20,fontWeight:700,cursor:"pointer"}}
            onClick={function(){ set(function(r){ r.cooling=(r.cooling||[]).filter(function(_,j){ return j!==i; }); }); }}>×</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:8}}>
          {[["t0","start °C",""],["t2","after 2 h","≤ 21"],["t6","after 4 h more","≤ 5"]].map(function(f){
            var bad = (f[0]==="t2" && c.t2!=="" && c.t2!=null && Number(c.t2)>21) || (f[0]==="t6" && c.t6!=="" && c.t6!=null && Number(c.t6)>5);
            return <label key={f[0]} style={{display:"block"}}>
              <span style={{display:"block",fontSize:11,fontWeight:700,letterSpacing:".05em",textTransform:"uppercase",color:"var(--muted)",marginBottom:3}}>{f[1]}{f[2]?" "+f[2]:""}</span>
              <span className={"tin"+(bad?" bad":"")} style={{height:46}}>
                <input type="text" inputMode="decimal" value={c[f[0]]==null?"":c[f[0]]} aria-label={(c.food||"item")+" "+f[1]}
                  onChange={function(e){ upd(i,f[0], e.target.value.replace(/[^0-9.\-]/g,"")); }} />
                <span className="u">°C</span>
              </span>
            </label>;
          })}
        </div>
        {c.pass===false && <div className="alert" style={{marginTop:8}}>
          <b>That batch missed the cooling rule.</b> It cannot go back on the menu — say what happened to it.
          <textarea rows={2} value={c.note||""} placeholder="e.g. discarded 4 L, split into shallow trays next time"
            onChange={function(e){ upd(i,"note",e.target.value); }} />
        </div>}
      </div>;
    })}
    <div className="add">
      <button type="button" className="btn" style={{width:"100%"}}
        onClick={function(){ set(function(r){ r.cooling=(r.cooling||[]).concat([{id:uid("cl"), food:"", t0:"", t2:"", t6:"", pass:null, note:""}]); }); }}>
        + Add a cooling line
      </button>
    </div>
  </div>;
}

/* ── steps 2 & 3 · food and cleaning ──────────────────────────────────────────────────── */
function TaskStep({group, title, blurb, cfg, rec, set, date}){
  var tasks=(cfg.tasks[group]||[]).filter(function(t){ return dueToday(t, date); });
  var sweepable=tasks.filter(function(t){ return !t.critical; });
  var allSwept=sweepable.length>0 && sweepable.every(function(t){ return rec.checks[t.id]===true; });
  function toggle(t){ set(function(r){ r.checks=Object.assign({},r.checks); r.checks[t.id] = r.checks[t.id]===true? false : true; }); }
  function na(t){ set(function(r){ r.checks=Object.assign({},r.checks); r.checks[t.id] = r.checks[t.id]==="na"? false : "na"; }); }
  return <F>
    <div className="grp">{title}
      {sweepable.length>1 && <button type="button" className="sweep"
        onClick={function(){ set(function(r){ r.checks=Object.assign({},r.checks); sweepable.forEach(function(t){ r.checks[t.id]=allSwept?false:true; }); }); }}>
        {allSwept? "clear" : "all good"}
      </button>}
    </div>
    {blurb? <p className="note">{blurb}</p> : null}
    {tasks.length===0 && <div className="empty">Nothing due tonight in this section.</div>}
    {tasks.map(function(t){
      return <F key={t.id}>
        <Check on={rec.checks[t.id]===true} na={rec.checks[t.id]==="na"} label={t.label} hint={t.hint}
          tag={t.freq&&t.freq!=="daily"? (t.freq==="always"?"":(t.freq.toUpperCase()+" only")) : (t.critical?"record":"")}
          onToggle={function(){ toggle(t); }} onNa={t.critical?null:function(){ na(t); }} />
        {t.cooling && rec.checks[t.id]===true && <CoolingLog rec={rec} set={set} />}
      </F>;
    })}
  </F>;
}

/* ── step 4 · shut down ────────────────────────────────────────────────────────────────
   Two lists, deliberately: what must be OFF, and what must still be RUNNING. The second
   list exists because the expensive mistake at this hour is killing a fridge, not leaving
   a toaster on. */
function ShutdownStep({cfg, rec, set}){
  var allOff=cfg.equipment.length>0 && cfg.equipment.every(function(e){ return rec.equipment[e.id]; });
  return <F>
    <div className="grp">Turn off
      {cfg.equipment.length>1 && <button type="button" className="sweep"
        onClick={function(){ set(function(r){ r.equipment=Object.assign({},r.equipment); cfg.equipment.forEach(function(e){ r.equipment[e.id]=!allOff; }); }); }}>
        {allOff?"clear":"all off"}
      </button>}
    </div>
    <p className="note">Walk the line and look at each one. Gas last, after the extraction has pulled the heat out.</p>
    {cfg.equipment.length===0 && <div className="empty">No equipment listed yet — add yours in Setup.</div>}
    {cfg.equipment.map(function(e){
      return <Check key={e.id} on={!!rec.equipment[e.id]} label={e.name} hint={e.hint}
        onToggle={function(){ set(function(r){ r.equipment=Object.assign({},r.equipment); r.equipment[e.id]=!r.equipment[e.id]; }); }} />;
    })}
    <div className="grp" style={{color:"var(--ok)"}}>Leave running</div>
    <p className="note">Check these are still on before you hit the lights. A fridge switched off tonight is a bin full of stock in the morning.</p>
    {cfg.leaveOn.map(function(l){
      return <Check key={l.id} on={!!rec.leaveOn[l.id]} label={l.name} hint="still running and cold"
        onToggle={function(){ set(function(r){ r.leaveOn=Object.assign({},r.leaveOn); r.leaveOn[l.id]=!r.leaveOn[l.id]; }); }} />;
    })}
    <div className="grp">Secure</div>
    <ShutSecure cfg={cfg} rec={rec} set={set} />
  </F>;
}
function ShutSecure({cfg, rec, set}){
  return <F>{(cfg.tasks.secure||[]).map(function(t){
    return <Check key={t.id} on={rec.checks[t.id]===true} label={t.label} hint={t.hint}
      onToggle={function(){ set(function(r){ r.checks=Object.assign({},r.checks); r.checks[t.id]=r.checks[t.id]===true?false:true; }); }} />;
  })}</F>;
}

/* ── step 5 · sign off ────────────────────────────────────────────────────────────────── */
function FinishStep({cfg, rec, set, prep, order, left, onGoto}){
  var prepLeft=prep.filter(function(p){ return !p.done; }).length;
  return <F>
    <div className="grp">Anything worth passing on</div>
    <div className="fld">
      <label htmlFor="clo-hand">Handover to the next chef</label>
      <textarea id="clo-hand" rows={3} value={rec.handover||""} placeholder="What the morning needs to know — a batch that ran out, a delivery that was short, a stuck oven door."
        onChange={function(e){ var v=e.target.value; set(function(r){ r.handover=v; }); }} />
    </div>
    <div className="fld">

      <textarea id="clo-waste" rows={2} value={rec.waste||""} placeholder="What went in the bin and roughly how much."

    <div className="grp">Carried into tomorrow</div>

    <div className="fld">

/* ── prep and order tabs ─────────────────────────────────────────────────────────────── */
function ListTab({items, setItems, placeholder, blurb, emptyText, extra}){
  var [draft,setDraft]=useState("");
  function add(){
    var t=draft.trim(); if(!t) return;
    setItems(items.concat([{id:uid("i"), name:t, done:false, at:new Date().toISOString()}]));
    setDraft("");
  }
  return <F>
    {blurb? <p className="note" style={{paddingTop:14}}>{blurb}</p> : null}
    <div className="add">
      <input value={draft} placeholder={placeholder} aria-label={placeholder} enterKeyHint="done"
        onChange={function(e){ setDraft(e.target.value); }}
        onKeyDown={function(e){ if(e.key==="Enter"){ e.preventDefault(); add(); } }} />
      <button type="button" className="btn p" onClick={add}>Add</button>
    </div>
    {extra||null}
    {items.length===0 && <div className="empty">{emptyText}</div>}
    {items.map(function(it,i){
      return <div key={it.id} className={"lrow"+(it.done?" on":"")}>
        <button type="button" className="box" aria-label={(it.done?"Untick ":"Tick ")+it.name}
          onClick={function(){ setItems(items.map(function(x,j){ return j===i? Object.assign({},x,{done:!x.done}) : x; })); }}>{it.done?"✓":""}</button>
        <span><span className="nm">{it.name}</span>{it.note? <span className="sub">{it.note}</span> : null}</span>
        <button type="button" className="x" aria-label={"Remove "+it.name}
          onClick={function(){ setItems(items.filter(function(_,j){ return j!==i; })); }}>×</button>
      </div>;
    })}
  </F>;
}

/* ── records tab — the council-facing side ────────────────────────────────────────────── */
function RecordsTab({store, cfg, branch, locations, onOpen}){
  var [rows,setRows]=useState(null);
  var [busy,setBusy]=useState(false);
  /* 30 nights. One batched read where the host can do it (the ordering app's kv can), and
     only otherwise 30 round trips — on a phone over the shop wifi that difference is the
     gap between "instant" and "why is this spinning". */
  useEffect(function(){
    var dead=false;
    var keys=[]; for(var i=0;i<30;i++) keys.push("closing:"+K.addDays(localISO(),-i)+":"+branch);
    function done(list){ if(!dead) setRows(list); }
    function parse(raw){ if(!raw) return null; try{ return JSON.parse(raw); }catch(e){ return null; } }
    if(store.getBatch){
      store.getBatch(keys)
        .then(function(map){ done(keys.map(function(k){ return parse(map&&map[k]); }).filter(Boolean)); })
        .catch(function(){ done([]); });
    } else {
      var out=[], n=0;
      (function step(){
        if(dead) return;
        if(n>=keys.length) return done(out);
        var k=keys[n++];
        store.get(k).then(function(raw){ var r=parse(raw); if(r) out.push(r); step(); })
                    .catch(function(){ step(); });
      })();
    }
    return function(){ dead=true; };
  },[branch]);

  function exportCsv(){
    if(!rows||!rows.length) return;
    setBusy(true);
    var all=[]; rows.slice().reverse().forEach(function(r){ all=all.concat(recordToRows(r,cfg)); });
    var csv=toCsv(all);
    var loc=(locations.find(function(l){ return l.id===branch; })||{}).name||branch;
    var name="closing-records_"+loc.replace(/[^A-Za-z0-9]+/g,"-")+"_"+localISO()+".csv";
    try{
      var blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },0);
    }catch(e){ alert("Could not build the file — "+(e&&e.message||e)); }
    setBusy(false);
  }

  if(rows===null) return <div className="empty">Looking up the last 30 nights…</div>;
  return <F>
    <div className="grp">Last 30 nights <span style={{fontWeight:500,letterSpacing:0,textTransform:"none",color:"var(--muted)"}}>{rows.length} closed</span></div>
    <p className="note">This is what you hand an environmental health officer. Every reading, every tick, and every corrective action, by date. Export gives you one CSV that opens in Excel.</p>
    <div style={{padding:"0 14px 14px"}}>
      <button type="button" className="btn p" onClick={exportCsv} disabled={busy||!rows.length}>Export for council (CSV)</button>
    </div>
    {rows.length===0 && <div className="empty">Nothing recorded yet for this venue. Tonight&rsquo;s close will be the first.</div>}
    {rows.map(function(r){
      var left=outstanding(r, cfg, r.date);
      var breaches=cfg.units.filter(function(u){ return tempState(u, r.temps&&r.temps[u.id]&&r.temps[u.id].v)==="bad"; }).length;
      return <div key={r.date} className="lrow" style={{cursor:"pointer"}} onClick={function(){ onOpen(r); }}>
        <span className="box" style={{border:0,fontSize:12,fontWeight:700,lineHeight:1.1,flexDirection:"column",display:"flex"}}>{r.date.slice(8)}<span style={{fontSize:9,color:"var(--muted)"}}>{r.date.slice(5,7)}</span></span>
        <span><span className="nm">{prettyDate(r.date)}</span><span className="sub">{r.by||"unsigned"}{r.finishedAt? " · "+hhmm(new Date(r.finishedAt)) : " · not finished"}{r.sent? " · emailed" : ""}</span></span>
        <span style={{display:"flex",gap:6}}>
          {breaches>0 && <span className="pill bad">{breaches} temp</span>}
          {left.length>0 && <span className="pill warn">{left.length} open</span>}
          {breaches===0&&left.length===0 && <span className="pill ok">clean</span>}
        </span>
      </div>;
    })}
  </F>;
}

/* ── setup ────────────────────────────────────────────────────────────────────────────── */
function EditList({title, note, items, onChange, fields}){

    <h4>{title}</h4>
    {note? <p className="note" style={{padding:"10px 14px 4px"}}>{note}</p> : null}
    {items.map(function(it,i){
      return <div key={it.id} style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) auto",gap:8,padding:"9px 14px",borderBottom:"1px solid var(--line)",alignItems:"center"}}>
        <div style={{display:"grid",gap:6}}>
          {fields.map(function(f){
            return <input key={f.k} value={it[f.k]==null?"":it[f.k]} placeholder={f.ph} aria-label={f.ph}
              style={{font:"inherit",fontSize:15,border:"2px solid var(--ink)",padding:"8px 9px",background:"#fff",width:f.w||"100%"}}
              onChange={function(e){ var v=f.num? e.target.value.replace(/[^0-9.\-]/g,"") : e.target.value;
                onChange(items.map(function(x,j){ return j===i? Object.assign({},x,(function(o){ o[f.k]=v; return o; })({})) : x; })); }} />;
          })}
        </div>
        <button type="button" className="x" aria-label="Remove" onClick={function(){ onChange(items.filter(function(_,j){ return j!==i; })); }}>×</button>
      </div>;

    <div style={{padding:12}}>
      <button type="button" className="btn sm" onClick={function(){
        var o={id:uid("n")}; fields.forEach(function(f){ o[f.k]=f.def!=null?f.def:""; }); onChange(items.concat([o]));
      }}>+ Add</button>

}
function SetupView({cfg, saveCfg}){
  function upd(patch){ saveCfg(Object.assign({}, cfg, patch)); }
  return <F>
    <div className="grp">Who gets the report</div>
    <div className="fld">
      <label htmlFor="clo-sup">Supervisor email</label>
      <input id="clo-sup" type="email" value={cfg.supervisorEmail||""} placeholder="supervisor@thehideoutspecialtycoffee.com"
        onChange={function(e){ upd({supervisorEmail:e.target.value}); }} />

    <div className="fld">
      <label htmlFor="clo-cc">Copy to (optional)</label>

        onChange={function(e){ upd({ccEmail:e.target.value}); }} />

    <EditList title="Fridges &amp; freezers" note="Name them the way the kitchen calls them, and set each one's safe range."
      items={cfg.units} onChange={function(v){ upd({units:v}); }}
      fields={[{k:"name",ph:"Unit name"},{k:"min",ph:"min °C",num:true,def:0},{k:"max",ph:"max °C",num:true,def:5}]} />
    <EditList title="Equipment to turn off" note="Everything a closing chef has to kill. Add the hint that stops the argument — 'oil filtered', 'main valve'."
      items={cfg.equipment} onChange={function(v){ upd({equipment:v}); }}
      fields={[{k:"name",ph:"Equipment"},{k:"hint",ph:"Note shown under it"}]} />
    <EditList title="Must stay running" note="The list that protects the stock."
      items={cfg.leaveOn} onChange={function(v){ upd({leaveOn:v}); }}
      fields={[{k:"name",ph:"What stays on"}]} />
    <div className="card">
      <h4>Probe check day</h4>
      <div style={{padding:12,display:"flex",gap:8,flexWrap:"wrap"}}>
        {[["mon","Mon"],["tue","Tue"],["wed","Wed"],["thu","Thu"],["fri","Fri"],["sat","Sat"],["sun","Sun"],["always","Every night"]].map(function(d){
          return <button key={d[0]} type="button" className="btn sm" aria-pressed={cfg.probeDay===d[0]}
            style={cfg.probeDay===d[0]?{background:"var(--ink)",color:"#f3f1ec"}:null}
            onClick={function(){ upd({probeDay:d[0]}); }}>{d[1]}</button>;
        })}
      </div>
    </div>
  </F>;
}

/* ── a finished record, read back ─────────────────────────────────────────────────────── */
function RecordView({rec, cfg, onClose}){
  var rows=recordToRows(rec, cfg);
  return <div style={{position:"fixed",inset:0,zIndex:60,background:"rgba(20,19,18,.6)",overflow:"auto",padding:14}} onClick={onClose}>
    <div className="clo" style={{maxWidth:720,margin:"0 auto"}} onClick={function(e){ e.stopPropagation(); }}>
      <div style={{border:"3px solid var(--ink)",background:"#fff"}}>
        <div style={{background:"var(--ink)",color:"#f3f1ec",padding:"12px 14px",display:"flex",justifyContent:"space-between",gap:10,alignItems:"center"}}>
          <span><b style={{fontSize:17}}>{prettyDate(rec.date)}</b><span style={{display:"block",fontSize:13,color:"rgba(243,241,236,.72)"}}>{rec.branchName||rec.branch} · {rec.by||"unsigned"}</span></span>
          <button type="button" className="btn sm" style={{background:"transparent",color:"#f3f1ec",borderColor:"#f3f1ec"}} onClick={onClose}>Close</button>
        </div>
        <div style={{maxHeight:"70vh",overflow:"auto"}}>
          {rows.map(function(r,i){
            var bad=/OUT OF RANGE|NOT DONE|NOT CONFIRMED|FAILED/.test(r[6]);
            return <div key={i} className="kv" style={bad?{background:"#fdeceb"}:null}>
              <span style={{minWidth:0}}><b>{r[4]}</b><span style={{display:"block",fontSize:12,color:"var(--muted)"}}>{r[3]}{r[7]? " · "+r[7] : ""}</span></span>
              <span style={{whiteSpace:"nowrap"}}>{r[5]? r[5]+" " : ""}<span className={"pill "+(bad?"bad":"ok")}>{r[6]}</span></span>

window.HideoutClosing._ui = {Check:Check, TempStep:TempStep, TaskStep:TaskStep, ShutdownStep:ShutdownStep,
  FinishStep:FinishStep, ListTab:ListTab, RecordsTab:RecordsTab, SetupView:SetupView, RecordView:RecordView};
})();

(function(){
"use strict";
var K = window.HideoutClosing._core, U = window.HideoutClosing._ui;
var React=K.React, useState=K.useState, useEffect=K.useEffect, useMemo=K.useMemo, useRef=K.useRef;
var localISO=K.localISO, hhmm=K.hhmm, prettyDate=K.prettyDate, dowOf=K.dowOf;
var DEFAULT_CONFIG=K.DEFAULT_CONFIG, tempState=K.tempState, dueToday=K.dueToday;
var blankRecord=K.blankRecord, outstanding=K.outstanding;
var F=React.Fragment;

var STEPS=[["temps","Temps"],["food","Food"],["clean","Clean"],["shut","Shut down"],["finish","Sign off"]];

/* Which outstanding items belong to which step — drives the per-step badge so the nav
   itself tells you where the remaining work is instead of making you hunt for it. */
function stepOf(o){
  if(o.k.indexOf("temp:")===0||o.k.indexOf("act:")===0||o.k==="probe") return "temps";
  if(o.k.indexOf("eq:")===0||o.k.indexOf("on:")===0) return "shut";
  if(o.k==="by") return "finish";
  if(o.where==="Food") return "food";
  if(o.where==="Cleaning") return "clean";
  if(o.where==="Secure") return "shut";
  return "finish";
}

/* Plain-text report — used for the mailto fallback, and as the email body when the backend
   sends it. Deliberately readable on a phone: a supervisor reads this at the pub. */
function reportText(rec, cfg, locName){
  var L=[];
  L.push("CLOSING REPORT — "+(locName||rec.branch));
  L.push(prettyDate(rec.date)+"  ·  closed by "+(rec.by||"unsigned")+(rec.finishedAt?" at "+hhmm(new Date(rec.finishedAt)):""));
  L.push("");
  var breaches=[], open=outstanding(rec,cfg,rec.date);
  L.push("TEMPERATURES");
  cfg.units.forEach(function(u){
    var t=(rec.temps||{})[u.id]||{}, st=tempState(u,t.v);
    L.push("  "+u.name+": "+(t.v===""||t.v==null?"— not read":t.v+" C")+(st==="bad"?"   *** OUT OF RANGE ("+u.min+" to "+u.max+") ***":""));
    if(st==="bad"){ breaches.push(u.name); L.push("      action: "+(t.action||"(none recorded)")); }
  });
  if(rec.probe&&rec.probe.done) L.push("  Probe check: "+rec.probe.reading+" C — "+(rec.probe.ok?"accurate":"*** FAILED *** "+(rec.probe.note||"")));
  if((rec.cooling||[]).length){
    L.push(""); L.push("COOLING (2h / 4h rule)");
    rec.cooling.forEach(function(c){ L.push("  "+(c.food||"(unnamed)")+": "+(c.t0||"?")+" -> "+(c.t2||"?")+" -> "+(c.t6||"?")+" C"+(c.pass===false?"   *** FAILED — "+(c.note||"no note")+" ***":"")); });
  }
  ["food","clean","secure"].forEach(function(g){
    var due=(cfg.tasks[g]||[]).filter(function(t){ return dueToday(t, rec.date); });
    if(!due.length) return;
    L.push(""); L.push(K.GROUP_LABEL[g].toUpperCase());
    due.forEach(function(t){ var v=(rec.checks||{})[t.id]; L.push("  ["+(v===true?"x":(v==="na"?"-":" "))+"] "+t.label); });
  });
  L.push(""); L.push("SHUT DOWN");
  cfg.equipment.forEach(function(e){ L.push("  ["+((rec.equipment||{})[e.id]?"x":" ")+"] "+e.name); });
  L.push("  left running: "+cfg.leaveOn.map(function(l){ return l.name+((rec.leaveOn||{})[l.id]?"":" (NOT CONFIRMED)"); }).join(", "));
  if((rec.prep||[]).length){ L.push(""); L.push("PREP FOR TOMORROW"); rec.prep.forEach(function(p){ L.push("  ["+(p.done?"x":" ")+"] "+p.name); }); }
  if((rec.order||[]).length){ L.push(""); L.push("RUNNING LOW"); rec.order.forEach(function(p){ L.push("  · "+p.name); }); }
  if(String(rec.waste||"").trim()){ L.push(""); L.push("WASTAGE"); L.push("  "+rec.waste); }
  if(String(rec.handover||"").trim()){ L.push(""); L.push("HANDOVER"); L.push("  "+rec.handover); }
  L.push("");
  L.push(breaches.length? "!! "+breaches.length+" temperature breach"+(breaches.length>1?"es":"")+": "+breaches.join(", ") : "No temperature breaches.");
  if(open.length) L.push("!! "+open.length+" item"+(open.length>1?"s":"")+" left open at sign-off.");
  return L.join("\n");
}

function ClosingTab({ctx}){
  var store=ctx.store;
  var branch=ctx.branch||(ctx.locations[0]&&ctx.locations[0].id)||"";
  var locName=(ctx.locations.find(function(l){ return l.id===branch; })||{}).name||branch;
  var [date,setDate]=useState(localISO());
  var [cfg,setCfg]=useState(null);
  var [rec,setRec]=useState(null);
  var [prep,setPrep]=useState([]);
  var [order,setOrder]=useState([]);
  var [view,setView]=useState("close");     // close | prep | order | records | setup
  var [step,setStep]=useState("temps");
  var [busy,setBusy]=useState("");
  var [openRec,setOpenRec]=useState(null);
  var [sentMsg,setSentMsg]=useState("");
  var dirty=useRef(false), timer=useRef(null), headRef=useRef(null);

  var recKey="closing:"+date+":"+branch;
  var prepKey="closing:prep:"+branch;
  var orderKey="closing:lowstock:"+branch;

  /* load */
  useEffect(function(){
    var dead=false;
    Promise.all([store.get("closing:config"), store.get(recKey), store.get(prepKey), store.get(orderKey)])
      .then(function(v){
        if(dead) return;
        var c; try{ c=v[0]?JSON.parse(v[0]):null; }catch(e){ c=null; }
        /* Merge over the defaults rather than replacing them: a config saved before a new
           default task group existed must not blank that group out. */
        c = c? Object.assign({}, DEFAULT_CONFIG, c, {tasks:Object.assign({}, DEFAULT_CONFIG.tasks, c.tasks||{})}) : JSON.parse(JSON.stringify(DEFAULT_CONFIG));
        setCfg(c);
        var r; try{ r=v[1]?JSON.parse(v[1]):null; }catch(e){ r=null; }
        setRec(r||blankRecord(date, branch, locName, ctx.department));
        try{ setPrep(v[2]?JSON.parse(v[2]):[]); }catch(e){ setPrep([]); }
        try{ setOrder(v[3]?JSON.parse(v[3]):[]); }catch(e){ setOrder([]); }
      })
      .catch(function(e){
        if(dead) return;
        setCfg(JSON.parse(JSON.stringify(DEFAULT_CONFIG)));
        setRec(blankRecord(date, branch, locName, ctx.department));
      });
    return function(){ dead=true; };
  },[date, branch]);

  /* autosave — debounced, and only after something actually changed */
  function set(fn){
    setRec(function(prev){ var next=JSON.parse(JSON.stringify(prev||{})); fn(next); return next; });
    dirty.current=true;
  }
  useEffect(function(){
    if(!rec||!dirty.current) return;
    if(timer.current) clearTimeout(timer.current);
    timer.current=setTimeout(function(){
      dirty.current=false;
      try{ localStorage.setItem("hideout_closing_draft:"+recKey, JSON.stringify(rec)); }catch(e){}
      store.set(recKey, JSON.stringify(rec)).catch(function(){});
    }, 900);
    return function(){ if(timer.current) clearTimeout(timer.current); };
  },[rec]);

  function savePrep(v){ setPrep(v); store.set(prepKey, JSON.stringify(v)).catch(function(){}); }
  function saveOrder(v){ setOrder(v); store.set(orderKey, JSON.stringify(v)).catch(function(){}); }
  function saveCfg(v){ setCfg(v); store.set("closing:config", JSON.stringify(v)).catch(function(){}); }

  var left = useMemo(function(){ return (cfg&&rec)? outstanding(rec,cfg,date) : []; },[cfg,rec,date]);
  var total = useMemo(function(){
    if(!cfg) return 0;
    var n=cfg.units.length + cfg.equipment.length + cfg.leaveOn.length + 1;
    if(cfg.probeDay==="always"||dowOf(date)===cfg.probeDay) n++;
    ["food","clean","secure"].forEach(function(g){ n += (cfg.tasks[g]||[]).filter(function(t){ return dueToday(t,date); }).length; });
    return n;
  },[cfg,date]);
  var done=Math.max(0,total-left.length);
  var pctDone=total? Math.round(done/total*100) : 0;
  var byStep=useMemo(function(){
    var m={}; left.forEach(function(o){ var s=stepOf(o); m[s]=(m[s]||0)+1; }); return m;
  },[left]);

  /* keep the section nav glued under the header whatever its height turns out to be */
  useEffect(function(){
    function measure(){ if(headRef.current) try{ headRef.current.parentNode.style.setProperty("--headh", headRef.current.offsetHeight+"px"); }catch(e){} }
    measure(); window.addEventListener("resize", measure);
    return function(){ window.removeEventListener("resize", measure); };
  });

  function nextStep(){
    var i=STEPS.findIndex(function(s){ return s[0]===step; });
    if(i<STEPS.length-1) { setStep(STEPS[i+1][0]); try{ window.scrollTo({top:0,behavior:"smooth"}); }catch(e){ window.scrollTo(0,0); } }
  }

  async function finish(){
    if(busy) return;
    if(left.length){
      if(!confirm(left.length+" item"+(left.length>1?"s":"")+" still open:\n\n"
        + left.slice(0,8).map(function(o){ return "· "+o.where+": "+o.what; }).join("\n")
        + (left.length>8? "\n· and "+(left.length-8)+" more" : "")
        + "\n\nSend the report anyway? It will show these as not done.")) return;
    }
    setBusy("Saving…");
    var finished=JSON.parse(JSON.stringify(rec));
    finished.finishedAt=new Date().toISOString();
    finished.by=String(finished.by||"").trim();
    finished.branchName=locName;
    finished.prep=prep.slice();
    finished.order=order.slice();
    finished.openCount=left.length;
    try{ await store.set(recKey, JSON.stringify(finished)); }
    catch(e){ setBusy(""); alert("Could not save the close — "+(e&&e.message||e)+"\n\nNothing was sent. Check the connection and try again."); return; }

    /* Prep that got made tonight drops off the rolling list; what is still outstanding
       carries into tomorrow. Low-stock lines stay until someone actually orders them. */
    var carried=prep.filter(function(p){ return !p.done; });
    if(carried.length!==prep.length) savePrep(carried);

    setBusy("Sending…");
    var text=reportText(finished, cfg, locName);
    var to=(cfg.supervisorEmail||"").trim();
    var subject="Closing report — "+locName+" — "+finished.date;
    var outcome="";
    if(!to){
      outcome="no-address";
    } else if(ctx.sendReport){
      try{
        var r=await ctx.sendReport({to:to, cc:(cfg.ccEmail||"").trim(), subject:subject, text:text, date:finished.date, branch:branch});
        outcome=(r&&r.ok)? "sent" : ("failed:"+((r&&r.error)||"unknown"));
      }catch(e){ outcome="failed:"+(e&&e.message||e); }
    } else {
      outcome="mailto";
    }
    if(outcome==="sent"){
      finished.sent=new Date().toISOString();
      try{ await store.set(recKey, JSON.stringify(finished)); }catch(e){}
    }
    setRec(finished); dirty.current=false;
    setBusy("");
    if(outcome==="mailto" || (outcome.indexOf("failed")===0 && to)){
      /* No server to send it, or the server refused: hand the whole report to the phone's
         mail app so it still reaches the supervisor tonight. The record is already saved
         either way — the email is the notification, not the evidence. */
      var href="mailto:"+encodeURIComponent(to)+"?subject="+encodeURIComponent(subject)
        + (cfg.ccEmail? "&cc="+encodeURIComponent(cfg.ccEmail.trim()) : "")
        + "&body="+encodeURIComponent(text);
      try{ window.location.href=href; }catch(e){}
      setSentMsg(outcome.indexOf("failed")===0
        ? "Saved. The server could not send it ("+outcome.slice(7)+") — your mail app has been opened with the report instead."
        : "Saved. Your mail app has been opened with the report — press send.");
    } else if(outcome==="no-address"){
      setSentMsg("Saved. No supervisor email is set yet — add one in Setup and tonight's report can go out automatically.");
    } else {
      setSentMsg("Saved and emailed to "+to+".");
    }
    setView("done");
  }

  if(!cfg||!rec) return <div className="clo"><K.CloStyle /><div className="empty">Loading tonight&rsquo;s sheet…</div></div>;

  var isToday=date===localISO();
  var finishedAlready=!!rec.finishedAt;

  return <div className="clo">
    <K.CloStyle />
    <div className="head" ref={headRef}>
      <div className="l1">
        <span className="ttl">Closing</span>
        <span className="sub">{prettyDate(date)} · {locName}</span>
        <span className="pick">
          <select value={date} aria-label="Date"
            onChange={function(e){ setDate(e.target.value); setView("close"); setStep("temps"); }}>
            {[0,1,2,3,4,5,6].map(function(n){ var d=K.addDays(localISO(),-n);
              return <option key={d} value={d}>{n===0?"Tonight":(n===1?"Yesterday":prettyDate(d))}</option>; })}
          </select>
          <button type="button" className="btn sm" style={{background:"transparent",color:"#f3f1ec",borderColor:"rgba(243,241,236,.5)",minHeight:34,padding:"5px 9px"}}
            aria-label="Setup" onClick={function(){ setView(view==="setup"?"close":"setup"); }}>⚙</button>
        </span>
      </div>
      {view==="close" && <div className="bar" role="progressbar" aria-valuenow={pctDone} aria-valuemin={0} aria-valuemax={100} aria-label="Close progress">
        <i className={left.length===0?"full":""} style={{width:pctDone+"%"}}></i>
      </div>}
    </div>

    <div className="nav">
      {[["close","Close"],["prep","Prep"],["order","Order"],["records","Records"]].map(function(v){
        var badge = v[0]==="close"? (left.length||null) : (v[0]==="prep"? (prep.filter(function(p){return !p.done;}).length||null) : (v[0]==="order"? (order.length||null) : null));
        return <button key={v[0]} type="button" aria-pressed={view===v[0]} onClick={function(){ setView(v[0]); }}>
          {v[1]}{badge? <span className={"n"+(v[0]==="close"&&left.length===0?" done":"")}>{badge}</span> : null}
        </button>;
      })}
    </div>

    <div className="wrap">
      {view==="setup" && <U.SetupView cfg={cfg} saveCfg={saveCfg} />}

      {view==="done" && <div className="done">
        <div className="big">Kitchen closed.</div>
        <p className="sm">{sentMsg}</p>
        <p className="sm" style={{fontSize:14}}>{left.length? left.length+" item"+(left.length>1?"s":"")+" went out marked not done." : "Everything on the sheet was answered."} The record is kept for council under Records.</p>
        <button type="button" className="btn" onClick={function(){ setView("records"); }}>See the record</button>
        {" "}
        <button type="button" className="btn" onClick={function(){ setView("close"); }}>Back to the sheet</button>
      </div>}

      {view==="close" && <F>
        {finishedAlready && <div className="alert" style={{borderLeftColor:"var(--ok)",background:"#eef6f1"}}>
          <b>This night is already signed off</b> by {rec.by||"someone"}{rec.finishedAt? " at "+hhmm(new Date(rec.finishedAt)) : ""}. You can still correct it — save it again to update the record.
        </div>}
        <div className="nav" style={{position:"static",borderTop:0}}>
          {STEPS.map(function(s){
            return <button key={s[0]} type="button" aria-pressed={step===s[0]} onClick={function(){ setStep(s[0]); }}>
              {s[1]}{byStep[s[0]]? <span className="n">{byStep[s[0]]}</span> : <span className="n done">✓</span>}
            </button>;
          })}
        </div>
        {step==="temps" && <U.TempStep cfg={cfg} rec={rec} set={set} date={date} />}
        {step==="food" && <U.TaskStep group="food" title="Food" cfg={cfg} rec={rec} set={set} date={date}
          blurb="The part that actually keeps people well. Tick what you did; the cooling log opens under the first line when it applies." />}
        {step==="clean" && <U.TaskStep group="clean" title="Cleaning &amp; sanitising" cfg={cfg} rec={rec} set={set} date={date}
          blurb="Surfaces food touches, the machine that sanitises them, and the basin you wash your hands in." />}
        {step==="shut" && <U.ShutdownStep cfg={cfg} rec={rec} set={set} />}
        {step==="finish" && <U.FinishStep cfg={cfg} rec={rec} set={set} prep={prep} order={order} left={left}
          onGoto={function(v){ setView(v); }} />}
      </F>}

      {view==="prep" && <U.ListTab items={prep} setItems={savePrep}
        placeholder="What needs making tomorrow"
        blurb="Anything you ran out of or nearly ran out of tonight. Unticked lines carry into tomorrow by themselves; ticked ones drop off when the night is signed off."
        emptyText="Nothing on the prep list. Add what the morning has to make." />}

      {view==="order" && <U.ListTab items={order} setItems={saveOrder}
        placeholder="What is running low"
        blurb="What you noticed was low while closing, so the next person ordering does not have to remember it. This list stays until someone clears it."
        emptyText="Nothing flagged as low."
        extra={ctx.openOrdering? <div style={{padding:"0 14px 12px"}}>
          <button type="button" className="btn" style={{width:"100%"}} onClick={ctx.openOrdering}>Open Submit Order →</button>
        </div> : null} />}

      {view==="records" && <U.RecordsTab store={store} cfg={cfg} branch={branch} locations={ctx.locations}
        onOpen={function(r){ setOpenRec(r); }} />}
    </div>

    {view==="close" && <div className="foot">
      <div className="txt">
        {left.length===0
          ? <F><b>All done — go home.</b>{cfg.supervisorEmail? "Report goes to "+cfg.supervisorEmail : "Set a supervisor email in Setup"}</F>
          : <F><b>{left.length} left</b>{(left[0]? left[0].where+": "+left[0].what : "")}</F>}
      </div>
      {step!=="finish"
        ? <button type="button" className="go wait" onClick={nextStep}>Next ›</button>
        : <button type="button" className="go" onClick={finish} disabled={!!busy}>{busy||"Finish & send"}</button>}
    </div>}

    {openRec && <U.RecordView rec={openRec} cfg={cfg} onClose={function(){ setOpenRec(null); }} />}
  </div>;
}

window.HideoutClosing.Tab = ClosingTab;
window.HideoutClosing.reportText = reportText;

/* Standalone mount — same component, a store the host provides. */
window.HideoutClosing.mount = function(el, ctx){
  var root=window.ReactDOM.createRoot(el);
  root.render(React.createElement(ClosingTab, {ctx:ctx}));
  return root;
};
})();
/* CLO-END */

(function(){
  var LOCATIONS=[{id:"340",name:"Adelaide St"},{id:"100",name:"Edward St"},{id:"515",name:"St Pauls Ter"}];
  var LS={
    get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
    set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  };
  /* Store adapter. Keys match the IOS ones exactly (`closing:<date>:<branch>`), so a venue
     that later connects this page to the backend keeps one continuous record. */
  var backend=LS.get("hideout_closing_backend")||"";
  var token=LS.get("hideout_closing_token")||"";
  function url(action, extra){
    return backend+"?action="+action+"&token="+encodeURIComponent(token)+(extra||"");
  }
  var localStore={
    get:function(k){ return Promise.resolve(LS.get("hideout_clo:"+k)); },
    set:function(k,v){ LS.set("hideout_clo:"+k, v); return Promise.resolve(true); },
    getBatch:function(keys){ var o={}; keys.forEach(function(k){ o[k]=LS.get("hideout_clo:"+k); }); return Promise.resolve(o); }
  };
  var remoteStore={
    get:function(k){ return fetch(url("get","&key="+encodeURIComponent(k)),{cache:"no-store"})
      .then(function(r){ return r.json(); })
      .then(function(j){ if(j&&j.error) throw new Error(j.error); return j&&j.value!=null? j.value : null; }); },
    getBatch:function(keys){ return fetch(url("getBatch","&keys="+encodeURIComponent(JSON.stringify(keys))),{cache:"no-store"})
      .then(function(r){ return r.json(); })
      .then(function(j){ if(j&&j.error) throw new Error(j.error); return (j&&j.values)||{}; }); },
    set:function(k,v){ return fetch(url("set","&key="+encodeURIComponent(k)+"&value="+encodeURIComponent(v)),{cache:"no-store"})
      .then(function(r){ return r.json(); })
      .then(function(j){ if(j&&j.error) throw new Error(j.error); return true; }); }
  };
  var store = backend? remoteStore : localStore;

  function sendReport(p){
    if(!backend) return Promise.resolve({ok:false, error:"no backend connected"});
    return fetch(url("closingReport","&date="+encodeURIComponent(p.date)+"&loc="+encodeURIComponent(p.branch)+"&to="+encodeURIComponent(p.to)+(p.cc?"&cc="+encodeURIComponent(p.cc):"")),{cache:"no-store"})
      .then(function(r){ return r.json(); })
      .then(function(j){ return {ok:!!(j&&j.ok), error:j&&j.error}; });
  }

  function start(branch){
    document.getElementById("gate").hidden=true;
    var el=document.getElementById("root"); el.innerHTML="";
    window.HideoutClosing.mount(el, {
      store:store, branch:branch, locations:LOCATIONS, department:"chef",
      sendReport: backend? sendReport : null,
      openOrdering: function(){ window.open("https://order.hideoutdb.com/","_blank","noopener"); }
    });
  }

  var saved=LS.get("hideout_closing_branch");
  if(saved && LOCATIONS.some(function(l){ return l.id===saved; })){ start(saved); }
  else{
    var g=document.getElementById("gate"), list=document.getElementById("gatelist");
    g.hidden=false;
    LOCATIONS.forEach(function(l){
      var b=document.createElement("button");
      b.type="button"; b.textContent=l.name;
      b.onclick=function(){ LS.set("hideout_closing_branch", l.id); start(l.id); };
      list.appendChild(b);
    });
  }
})();
</script>
</body>
