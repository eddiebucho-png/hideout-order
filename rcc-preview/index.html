      <Btn tone="danger" size="sm" onClick={onReset}>Reset to sample data</Btn>
    </Section>
    </>}

    </div>}
    {catDept && <CatManager state={state} update={update} dept={catDept} onClose={()=>setCatDept(null)} />}
  </div>;
}
/* ---------------- Archive ---------------- */
function Archive({state, update, ingMap}){
  const archIng = state.ingredients.filter(i=>i.archived);
  const archRec = state.recipes.filter(r=>r.archived);
  function restoreIng(id){ update(s=>{ const t=s.ingredients.find(i=>i.id===id); t.archived=false; delete t.archiveReason; delete t.archivedAt; }); }
  function restoreRec(id){ update(s=>{ const t=s.recipes.find(r=>r.id===id); t.archived=false; delete t.archiveReason; delete t.archivedAt; }); }
  return <div className="space-y-6">
    <p className="text-sm text-stone-500">Store seasonal or discontinued items here. They are excluded from the main lists, dashboard and cost calculations, and can be restored anytime.</p>
    <div className="card p-5">
      <div className="font-semibold text-stone-800 mb-3">Archived recipes <span className="text-xs text-stone-400">({archRec.length})</span></div>
      {archRec.length===0 ? <div className="text-sm text-stone-400">None</div> :
        <div className="divide-y divide-stone-100">{archRec.map(r=>{ const {unitCost:uc}=marginOf(r,ingMap);
          return <div key={r.id} className="flex items-center justify-between py-2">
            <div><div className="text-sm font-medium text-stone-700">{r.name} <span className="ml-1 text-xs bg-amber-50 text-amber-700 px-2 py-0.5 rounded-full">{r.archiveReason||"Archived"}</span></div>
            <div className="text-xs text-stone-400">{r.category||"-"} · cost {money(uc)} · archived {r.archivedAt||"-"}</div></div>
            <div className="flex gap-2"><Btn tone="ok" size="sm" onClick={()=>restoreRec(r.id)}>Restore</Btn>
            <Btn tone="danger" size="sm" onClick={()=>{if(confirm("Delete permanently?"))update(s=>{s.recipes=s.recipes.filter(x=>x.id!==r.id);});}}>Delete</Btn></div>
          </div>; })}</div>}
    </div>
    <div className="card p-5">
      <div className="font-semibold text-stone-800 mb-3">Archived ingredients <span className="text-xs text-stone-400">({archIng.length})</span></div>
      {archIng.length===0 ? <div className="text-sm text-stone-400">None</div> :
        <div className="divide-y divide-stone-100">{archIng.map(i=>(
          <div key={i.id} className="flex items-center justify-between py-2">
            <div><div className="text-sm font-medium text-stone-700">{i.name} <span className="ml-1 text-xs bg-amber-50 text-amber-700 px-2 py-0.5 rounded-full">{i.archiveReason||"Archived"}</span></div>
            <div className="text-xs text-stone-400">{i.category||"-"} · {money(unitCost(i))}/{i.useUnit} · archived {i.archivedAt||"-"}</div></div>
            <div className="flex gap-2"><Btn tone="ok" size="sm" onClick={()=>restoreIng(i.id)}>Restore</Btn>
            <Btn tone="danger" size="sm" onClick={()=>{if(confirm("Delete permanently?"))update(s=>{s.ingredients=s.ingredients.filter(x=>x.id!==i.id);});}}>Delete</Btn></div>
          </div>))}</div>}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

<script>
(function(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var MAX = 7, cur = null;
  function reset(el){ el.style.transition = "transform .45s cubic-bezier(.2,.7,.2,1)"; el.style.transform = ""; el.__down = false; }
  document.addEventListener("pointermove", function(e){
    if(e.pointerType === "touch") return;
    var el = e.target && e.target.closest ? e.target.closest(".tilt") : null;
    if(cur && cur !== el){ reset(cur); cur = null; }
    if(!el) return;
    cur = el;
    var r = el.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width - 0.5;
    var py = (e.clientY - r.top) / r.height - 0.5;
    var s = el.__down ? 0.97 : 1;
    el.style.transition = "transform .08s linear";
    el.style.transform = "perspective(700px) rotateX(" + (-py * MAX).toFixed(2) + "deg) rotateY(" + (px * MAX).toFixed(2) + "deg) translateY(-3px) scale(" + s + ")";
  }, {passive:true});
  document.addEventListener("pointerdown", function(e){
    var el = e.target && e.target.closest ? e.target.closest(".tilt") : null;
    if(!el) return;
    el.__down = true;
    el.style.transition = "transform .1s ease";
    el.style.transform = (el.style.transform || "perspective(700px)").replace(/ scale\([^)]*\)/, "") + " scale(.97)";
  }, {passive:true});
  document.addEventListener("pointerup", function(){ if(cur){ cur.__down = false; } }, {passive:true});
  document.addEventListener("pointerout", function(e){
    var el = e.target && e.target.closest ? e.target.closest(".tilt") : null;
    if(el && !(e.relatedTarget && el.contains(e.relatedTarget))){ reset(el); if(cur === el) cur = null; }
  }, {passive:true});
})();
</script>
<!-- ================= Drag-to-pan (grab to scroll) — desktop mouse convenience, 2026-07-24 ================= -->
<script>
/* Grab empty background and drag to scroll the page. Mouse/pen only (touch keeps native scroll).
   Fail-safe: fully wrapped in IIFE + try/catch; any error leaves the app untouched.
   Does NOT touch the React tree; pure document-level vanilla. */
(function(){
  "use strict";
  try{
    if(window.__HIDEOUT_DRAGPAN__) return; window.__HIDEOUT_DRAGPAN__=true;

    var THRESH=6; // px of movement before a click becomes a pan
    // Elements / ancestors that own their own pointer interaction — never hijack these.
    var SKIP="a,button,input,textarea,select,label,option,summary,svg,img,video,canvas,"+
             "[contenteditable],[contenteditable=true],[draggable=true],[role=slider],[role=radiogroup],"+
             ".pc-card,#pc-feed,#pc-modal,#pc-overlay,.pc-abs,.pc-pinbtn,"+
             "[data-dnd],[data-drag],.kanban,.dish-card,.cursor-grab,.tilt,.vbtn-card,.twk-panel";

    var armed=false, panning=false, sx=0, sy=0, pid=-1, selPrev="", curPrev="";

    function isScrollable(el){
      if(!el||el===document.body||el===document.documentElement) return false;
      var st;
      try{ st=getComputedStyle(el); }catch(_){ return false; }
      var oy=st.overflowY, ox=st.overflowX;
      var vy=(oy==="auto"||oy==="scroll")&&el.scrollHeight>el.clientHeight+1;
      var vx=(ox==="auto"||ox==="scroll")&&el.scrollWidth>el.clientWidth+1;
      return vy||vx;
    }

    function onDown(e){
      try{
        if(panning||armed) return;
        if(e.pointerType==="touch") return;   // mobile keeps native scroll
        if(e.button!==0) return;              // primary button only
        var t=e.target;
        if(!t||!t.closest) return;
        if(t.closest(SKIP)) return;           // interactive / existing-drag element
        // Bail if grab starts inside any inner scroll container — keep native behaviour intact.
        var n=t;
        while(n&&n!==document.body&&n!==document.documentElement){
          if(isScrollable(n)) return;
          n=n.parentElement;
        }
        armed=true; sx=e.clientX; sy=e.clientY; pid=(e.pointerId==null?-1:e.pointerId);
      }catch(_){ armed=false; }
    }

    function begin(){
      panning=true;
      try{
        var de=document.documentElement;
        selPrev=de.style.userSelect; curPrev=de.style.cursor;
        de.style.userSelect="none"; de.style.cursor="grabbing";
        var s=window.getSelection&&window.getSelection(); if(s&&s.removeAllRanges) s.removeAllRanges();
      }catch(_){}
    }

    function onMove(e){
      try{
        if(!armed) return;
        if(pid!==-1&&e.pointerId!=null&&e.pointerId!==pid) return;
        var dx=e.clientX-sx, dy=e.clientY-sy;
        if(!panning){
          if(Math.abs(dx)<THRESH&&Math.abs(dy)<THRESH) return; // still a click
          begin();
        }
        window.scrollBy(-dx,-dy);
        sx=e.clientX; sy=e.clientY;
        if(e.cancelable) e.preventDefault();
      }catch(_){}
    }

    function end(){
      try{
        if(panning){
          var de=document.documentElement;
          de.style.userSelect=selPrev; de.style.cursor=curPrev;
        }
      }catch(_){}
      armed=false; panning=false; pid=-1;
    }

    document.addEventListener("pointerdown",onDown,true);
    document.addEventListener("pointermove",onMove,{passive:false});
    document.addEventListener("pointerup",end,true);
    document.addEventListener("pointercancel",end,true);
    window.addEventListener("blur",end);
  }catch(_){/* never break the app */}
})();
</script>
<script>
/* The chat button and the postcards button both live in the bottom-right corner, which on a phone is
   exactly where a Save button or a file link ends up - they were covering things people needed to
   tap. Long-press either one (about a third of a second) and it can be dragged anywhere; the spot is
   remembered per device. A short tap still opens the panel as before.
   Wired from here rather than from each widget because postcards.js is served from another app. */
(function(){
  function wire(el, key){
    if(!el || el.__fabDrag) return; el.__fabDrag=true;
    var LS="hideout_fabpos_"+key;
    el.style.touchAction="none";                       // so a drag does not scroll the page instead
    function place(x,y){
      var w=el.offsetWidth||62, h=el.offsetHeight||62;
      var cx=Math.max(4, Math.min(x, window.innerWidth-w-4));
      var cy=Math.max(4, Math.min(y, window.innerHeight-h-4));
      el.style.left=cx+"px"; el.style.top=cy+"px"; el.style.right="auto"; el.style.bottom="auto";
    }
    try{ var p=JSON.parse(localStorage.getItem(LS)||"null"); if(p) place(p.x,p.y); }catch(e){}
    var hold=null, dragging=false, sx=0, sy=0, ox=0, oy=0;
    el.addEventListener("pointerdown", function(e){
      var r=el.getBoundingClientRect(); sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
      hold=setTimeout(function(){
        dragging=true; el.style.transition="none"; el.style.opacity="0.85";
        try{ el.setPointerCapture(e.pointerId); }catch(err){}
        try{ if(navigator.vibrate) navigator.vibrate(15); }catch(err){}   // "you can move me now"
      }, 380);
    });
    el.addEventListener("pointermove", function(e){
      if(!dragging) return; e.preventDefault();
      place(ox+(e.clientX-sx), oy+(e.clientY-sy));
    });
    function end(){
      clearTimeout(hold);
      if(!dragging) return;
      dragging=false; el.style.opacity=""; el.style.transition="";
      var r=el.getBoundingClientRect();
      /* a hidden button measures 0x0 - never write that, or the next load restores it to the corner */
      if(r.width>0 && r.height>0){ try{ localStorage.setItem(LS, JSON.stringify({x:r.left, y:r.top})); }catch(err){} }
      /* the pointerup that finishes a drag also fires a click - swallow that one so letting go
         of the button does not open the panel you were trying to move out of the way */
      el.addEventListener("click", function sw(ev){ ev.stopPropagation(); ev.preventDefault(); }, {capture:true, once:true});
    }
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
    window.addEventListener("resize", function(){ var r=el.getBoundingClientRect(); place(r.left, r.top); });
  }
  function scan(){ wire(document.getElementById("hb-fab"),"chat"); wire(document.getElementById("pc-fab"),"postcards"); }
  scan();
  // both buttons are injected after load (the chatbot on sign-in, postcards from its own script)
  try{ new MutationObserver(scan).observe(document.body, {childList:true}); }catch(e){}
  [800, 2500, 6000].forEach(function(ms){ setTimeout(scan, ms); });
})();
</script>
<script>
/* Collapsible mobile chrome. Plain DOM on purpose: React never re-renders for this, and a class
   toggle on <body> cannot fight the app's own state. */
(function(){
  var TH=8, TOP=120, ticking=false, locked=false;   // locked = the person decided, not the scroll
  var body=document.body;
  /* seed from where the page actually is - starting at 0 made the first scroll event on an
     already-scrolled page look like one huge downward move and the bar opened collapsed */
  var last=window.pageYOffset||document.documentElement.scrollTop||0;
  function set(hidden){ body.classList.toggle("chrome-hidden", !!hidden); paint(); }
  function hidden(){ return body.classList.contains("chrome-hidden"); }

  /* ---- 1+2. follow the scroll, unless the grip was used ---- */
  function apply(){
    ticking=false;
    if(window.innerWidth>=640){ body.classList.remove("chrome-hidden"); return; }
    if(locked) return;
    var y=window.pageYOffset||document.documentElement.scrollTop||0, d=y-last;
    if(Math.abs(d)<TH) return;
    var atBottom=(y+window.innerHeight)>=(document.documentElement.scrollHeight-4);
    var canScroll=document.documentElement.scrollHeight>window.innerHeight+40;
    set(canScroll && !(y<TOP || atBottom || d<0));
    last=y;
  }
  window.addEventListener("scroll", function(){ if(!ticking){ ticking=true; requestAnimationFrame(apply); } }, {passive:true});
  window.addEventListener("resize", function(){ if(window.innerWidth>=640) body.classList.remove("chrome-hidden"); }, {passive:true});

  /* ---- 3. the grip: tap to toggle, drag down to put away ---- */
  var grip=document.createElement("button");
  grip.id="chrome-grip"; grip.type="button";
  grip.innerHTML='<span class="cg-t"></span>';
  grip.setAttribute("aria-label","Hide or show the menu bar");
  function paint(){
    var h=hidden();
    grip.querySelector(".cg-t").textContent = h? "Menu" : "Hide";
    grip.setAttribute("aria-expanded", h? "false":"true");
  }
  document.body.appendChild(grip); paint();

  var y0=null, moved=0;
  grip.addEventListener("pointerdown", function(e){
    y0=e.clientY; moved=0; locked=true;
    body.classList.add("chrome-dragging");
    try{ grip.setPointerCapture(e.pointerId); }catch(err){}
  });
  grip.addEventListener("pointermove", function(e){
    if(y0===null) return;
    moved=e.clientY-y0;
    /* live drag: 24px of travel in either direction settles the drawer */
    if(moved>24 && !hidden()) set(true);
    if(moved<-24 && hidden()) set(false);
  });
  function end(){
    if(y0===null) return;
    body.classList.remove("chrome-dragging");
    if(Math.abs(moved)<=24) set(!hidden());   // a tap, not a drag
    y0=null;
    /* the scroll rule takes over again once the page is back at the top */
    last=window.pageYOffset||0;
  }
  grip.addEventListener("pointerup", end);
  grip.addEventListener("pointercancel", end);
  /* scrolling back to the very top hands control back to the scroll rule */
  window.addEventListener("scroll", function(){
    if(locked && (window.pageYOffset||0)<TOP && !hidden()) locked=false;
  }, {passive:true});
})();
</script>
<script>
/* The meeting editor's action bar wraps to two rows on a narrow screen, so its height is not a
   constant. Measure it and hand the number to CSS; everything that has to stay clear of the bar
   reserves against --actbar-h. */
(function(){
  function sync(){
    document.querySelectorAll(".rv2.fs").forEach(function(fs){
      var bar=fs.querySelector(".actbar"); if(!bar) return;
      var h=Math.round(bar.getBoundingClientRect().height);
      if(h>0) fs.style.setProperty("--actbar-h", h+"px");
    });
  }
  var t=0;
  function schedule(){ if(t) return; t=requestAnimationFrame(function(){ t=0; sync(); }); }
  window.addEventListener("resize", schedule, {passive:true});
  new MutationObserver(schedule).observe(document.documentElement, {childList:true, subtree:true});
  schedule();
})();
</script>
