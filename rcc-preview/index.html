/* ---- handover card ----------------------------------------------------------------------
   Embedded on Today (.bare) the surrounding section supplies the heading and the rule, so this
   draws no box of its own. Standalone on the Prep board it gets the tdv2 frame. */
.hov-wrap{border:3px solid var(--ink);background:var(--paper);padding:14px 16px;margin-bottom:16px}
.hov-wrap.bare{border:0;background:none;padding:0;margin:0}
.hov-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.hov-wrap.bare .hov-head{margin-bottom:6px}
.hov-title{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.hov-count{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hov-actions{display:flex;align-items:center;gap:12px;margin-left:auto}
.hov-link{font:inherit;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:0;color:var(--r);cursor:pointer;padding:4px 0;min-height:auto}
.hov-link:hover{text-decoration:underline}
.hov-add{width:30px;height:30px;min-height:30px;flex:none;font:inherit;font-size:20px;line-height:1;
  font-weight:700;background:var(--r);color:#fff;border:0;border-radius:0;cursor:pointer;
  transition:transform .18s cubic-bezier(.32,.72,0,1),box-shadow .18s cubic-bezier(.32,.72,0,1)}
.hov-add:hover{transform:translate(-2px,-2px) rotate(90deg);box-shadow:3px 3px 0 var(--ink)}
.hov-add:active{transform:scale(.94)}
@media (prefers-reduced-motion:reduce){ .hov-add{transition:none} .hov-add:hover{transform:none} }
@media (prefers-reduced-motion:reduce){
  .idp-pop{animation:none}
  .idp-trigger{transition:none}
  .idp-trigger:hover{transform:none}
}
/* ---- allergen chips ----------------------------------------------------------------------
   Picked, not typed. Selected inverts to ink like the rest of tdv2; "No allergens" is deliberately
   a different shape of statement from an empty list. */
.alp{display:block}
.alp-chips{display:flex;flex-wrap:wrap;gap:6px}
.alp-chip,.alp-new,.alp-ok,.alp-more{font:inherit;font-weight:700;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;padding:7px 10px;min-height:34px;border:2px solid var(--ink);
  background:#fff;color:var(--ink);border-radius:0;cursor:pointer;
  transition:transform .14s cubic-bezier(.32,.72,0,1),background .14s,color .14s}
.alp-chip:hover,.alp-new:hover,.alp-ok:hover,.alp-more:hover{transform:translateY(-2px)}
/* never filled: a filled chip means "selected allergen" and nothing else */
.alp-more{border-style:dotted;background:transparent;color:var(--muted)}
.alp-more[aria-expanded="true"]{background:transparent;color:var(--ink);border-style:dotted}
.alp-more:hover{color:var(--ink)}
.alp-chip:active{transform:scale(.96)}
.alp-chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.alp-chip.none{border-style:dashed}
.alp-chip.none[aria-pressed="true"]{background:var(--b);border-color:var(--b);color:#fff}
.alp-new{background:var(--y)}
.alp-row{display:flex;gap:6px;margin-top:8px}
.alp-input{font:inherit;font-weight:600;font-size:13px;flex:1 1 auto;min-width:0;padding:7px 9px;
  border:2px solid var(--ink);border-radius:0;background:#fff;color:var(--ink);outline:none}
.alp-input:focus{box-shadow:3px 3px 0 var(--y)}
.alp-hint{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);margin-top:7px}
@media (prefers-reduced-motion:reduce){ .alp-chip,.alp-new,.alp-ok,.alp-more{transition:none}
  .alp-chip:hover,.alp-new:hover,.alp-ok:hover,.alp-more:hover{transform:none} }
/* ---- inside a popup -----------------------------------------------------------------------
   The shell is tdv2; these make the CONTENTS match without touching 24 components. Anything that
   already owns a finished look is excluded rather than overridden. */
.md-body{color:var(--ink)}
.md-body label,.md-body .lab{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.md-body input:not([type="checkbox"]):not([type="radio"]):not(.alp-input):not(.idp-input),
.md-body select,
.md-body textarea{
  font:inherit;font-weight:600;font-size:15px;width:100%;padding:10px 12px;
  border:3px solid var(--ink)!important;border-radius:0!important;background:#fff;color:var(--ink);
  outline:none;box-shadow:none}
.md-body input:focus:not(.alp-input):not(.idp-input),
.md-body select:focus,
.md-body textarea:focus{box-shadow:4px 4px 0 var(--y)!important}
.md-body input::placeholder,.md-body textarea::placeholder{color:var(--muted);font-weight:500}
/* Buttons keep whatever colour they were given - a red confirm stays red - and only lose the
   rounding and gain the house weight and press. */
.md-body button:not(.md-x):not(.alp-chip):not(.alp-new):not(.alp-ok):not(.alp-more):not(.idp-trigger):not(.idp-opt):not(.idp-new){
  font:inherit;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  border-radius:0!important;padding:11px 16px;cursor:pointer;
  transition:transform .16s cubic-bezier(.32,.72,0,1),box-shadow .16s cubic-bezier(.32,.72,0,1)}
.md-body button:not(.md-x):not(.alp-chip):not(.alp-new):not(.alp-ok):not(.alp-more):not(.idp-trigger):not(.idp-opt):not(.idp-new):hover{
  transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.md-body button:not(.md-x):not(.alp-chip):not(.alp-new):not(.alp-ok):not(.alp-more):not(.idp-trigger):not(.idp-opt):not(.idp-new):active{
  transform:none;box-shadow:none}
/* rounded leftovers from the old card language */
.md-body .rounded-full,.md-body .rounded-lg,.md-body .rounded-xl,.md-body .rounded-md,
.md-body [class*="rounded-["]{border-radius:0!important}
@media (prefers-reduced-motion:reduce){ .md-body button{transition:none}
  .md-body button:hover{transform:none} }
/* ---- old-language sweep --------------------------------------------------------------------
   The last of the pre-tdv2 Tailwind vocabulary, retired app-wide instead of screen by screen.
   Only inside #root: the assistant panel (#hb-panel) and the postcards widget own their looks. */
#root .rounded,#root .rounded-md,#root .rounded-lg,#root .rounded-xl,#root .rounded-2xl,
#root .rounded-3xl,#root [class*="rounded-["]{border-radius:0!important}
/* a pill-shaped control is old; a round div is a dot or an avatar and stays round */
#root button.rounded-full,#root span.rounded-full,#root a.rounded-full{border-radius:0!important}

/* the warm-grey text ramp collapses onto the two inks the system actually has */
#root .text-stone-300,#root .text-stone-400,#root .text-stone-500{color:var(--muted)!important}
#root .text-stone-600,#root .text-stone-700,#root .text-stone-800,#root .text-stone-900{color:var(--ink)!important}
#root .border-stone-100,#root .border-stone-200,#root .border-stone-300{border-color:rgba(20,19,18,.28)!important}
#root .bg-stone-50,#root .bg-stone-100{background:var(--paper)!important}

/* the amber "check this" boxes - same message, house colours */
#root .text-amber-700,#root .text-amber-800,#root .text-amber-900{color:var(--ink)!important}
#root .bg-amber-50,#root .bg-amber-100{background:#fdf7dd!important}
#root .border-amber-200,#root .border-amber-300{border-color:var(--y)!important;border-width:3px!important}

/* the old emerald "create" affordance */
#root .text-emerald-600,#root .text-emerald-700{color:#1e7a46!important}
#root .bg-emerald-50{background:#eaf6ef!important}
#root .border-emerald-200{border-color:#1e7a46!important}

/* tokens have to resolve outside a .tdv2/.rv2 ancestor - Audit, Archive and the older cards
   are neither */
#root{--r:#ec3013;--b:#1e4fb0;--y:#f2c100;--ink:#141312;--paper:#f3f1ec;--muted:rgba(20,19,18,.62)}
/* ---- menu categories, laid out ------------------------------------------------------------
   Each department is a block you can read at a glance instead of a button that hides a popup. */
#root .catmap{display:grid;gap:14px;margin-top:4px}
#root .catgrp{border:3px solid var(--ink);background:#fff;padding:14px 16px}
#root .cathead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
#root .catname{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
#root .catn{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:auto}
#root .catlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#root .catpill{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);
  padding:6px 10px;font-size:12px;font-weight:600;background:var(--paper);color:var(--ink)}
#root .catpill b{font-size:11px;font-weight:700;background:var(--ink);color:#fff;padding:1px 6px;min-width:20px;text-align:center}
#root .catpill b:empty{display:none}
@media (min-width:900px){ #root .catmap{grid-template-columns:1fr 1fr} }
/* ---- settings nav stays a sidebar on anything that is not a phone -------------------------
   The shared 900px breakpoint turned it into a strip on narrow laptop windows and side panels,
   which reads as a different layout from the same build. */
@media (min-width:640px){
  #root .rv2 .navcol{grid-template-columns:240px minmax(0,1fr)}
  #root .rv2 .navcol .nav{border-right:3px solid var(--ink);border-bottom:0;display:block;
    overflow:visible;padding:10px 0}
  #root .rv2 .navcol .nav .g{display:block}
  #root .rv2 .navcol .nav button{width:100%;flex:none}
}
/* ---- mobile chrome ------------------------------------------------------------------------
   The bottom bar is position:fixed, so without the padding the last card sits underneath it. */
@media (max-width:639px){
  body{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
  .hdr2 .bnav{transition:transform .24s cubic-bezier(.32,.72,0,1)}
  body.chrome-hidden .hdr2 .bnav{transform:translateY(calc(100% + env(safe-area-inset-bottom,0px)))}
  /* the sticky sub-row travels up with it; the black title bar stays put so you keep your place */
  .hdr2 .row2{transition:transform .24s cubic-bezier(.32,.72,0,1)}
  body.chrome-hidden .hdr2 .row2{transform:translateY(-110%)}

  /* the grip - a drawer handle sitting on the bar */
  #chrome-grip{position:fixed;left:50%;z-index:81;display:flex;align-items:center;justify-content:center;
    gap:7px;width:104px;height:26px;margin-left:-52px;
    bottom:calc(58px + env(safe-area-inset-bottom,0px));
    background:#141312;color:#f2c100;border:0;cursor:pointer;touch-action:none;
    font:700 10px/1 Jost,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;
    transition:bottom .24s cubic-bezier(.32,.72,0,1),transform .12s ease}
  #chrome-grip::before{content:"";width:26px;height:3px;background:currentColor}
  #chrome-grip .cg-t{opacity:.85}
  #chrome-grip:active{transform:scale(.96)}
  body.chrome-hidden #chrome-grip{bottom:0}
  body.chrome-dragging #chrome-grip,body.chrome-dragging .hdr2 .bnav{transition:none}
}
@media (min-width:640px){ #chrome-grip{display:none} }
@media (prefers-reduced-motion:reduce){
  .hdr2 .bnav,.hdr2 .row2,#chrome-grip{transition:none}
}
/* ---- settings sidebar: foldable groups ----------------------------------------------------
   The heading is now a button. It has to read as a heading first and a control second, so the
   caret is the only added ink and the type stays exactly as it was. */
#root .rv2 .nav .ng{border-bottom:1px solid rgba(20,19,18,.14)}
#root .rv2 .nav .ng:last-child{border-bottom:0}
#root .rv2 .nav button.g{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:none;border:0;cursor:pointer;font:inherit;font-size:11px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:12px 14px 6px}
#root .rv2 .nav button.g:hover{color:var(--ink)}
#root .rv2 .nav .gcar{font-size:13px;line-height:1;width:10px;flex:none}
#root .rv2 .nav .gt{margin-right:auto}
#root .rv2 .nav .ng.shut button.g{padding-bottom:12px}
/* ---- the post editor ----------------------------------------------------------------------
   Same frame as every other field, with a toolbar welded on top so the box reads as one control
   rather than a strip of buttons floating above a textarea. */
.ned{display:block;border:3px solid var(--ink);background:#fff;min-width:0}
.ned-bar{display:flex;flex-wrap:wrap;gap:0;align-items:stretch;background:var(--paper);border-bottom:3px solid var(--ink)}
.ned-b{font:inherit;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 11px;min-height:36px;background:none;border:0;border-right:2px solid rgba(20,19,18,.18);
  color:var(--ink);cursor:pointer;transition:background .12s,color .12s}
.ned-b:hover{background:var(--y)}
.ned-b:active{background:var(--ink);color:#fff}
/* each control is set in the style it produces - nothing to decode */
.ned-b.t1{font-size:15px;font-weight:700;letter-spacing:-0.01em;text-transform:none}
.ned-b.t2{font-size:13px;font-weight:700;letter-spacing:0;text-transform:none}
.ned-b.t3{font-size:10px;font-weight:700;letter-spacing:.16em}
.ned-b.bold{font-weight:900;font-size:13px}
.ned-b.ital{font-style:italic;font-size:13px;text-transform:none}
/* a rule in front of each group, so a wrapped bar still reads as four jobs */
.ned-b.sep{border-left:3px solid var(--ink)}
.ned-b.prev{margin-left:auto;border-right:0;border-left:2px solid rgba(20,19,18,.18)}
.ned-b.prev.on{background:var(--ink);color:#fff}
.ned-ta{display:block;width:100%;box-sizing:border-box;border:0;outline:none;resize:vertical;
  font:inherit;font-size:16px;line-height:1.6;padding:12px 14px;min-height:170px;
  background:#fff;color:var(--ink)}
.ned-ta::placeholder{color:var(--muted)}
.ned-prev{box-sizing:border-box;padding:14px;min-height:170px;background:#fff;overflow-wrap:anywhere;min-width:0}
.ned-empty{font-size:13px;color:var(--muted)}
/* posted text must never run out through the side of its card */
.minidoc,.minidoc *{min-width:0;overflow-wrap:anywhere;word-break:break-word}
@media (prefers-reduced-motion:reduce){ .ned-b{transition:none} }
/* ---- Audit ---------------------------------------------------------------------------------
   Was the last screen still wearing rounded Tailwind cards. Same findings, house parts.
   The detail column WRAPS on purpose: it is the reason for the finding, and the old ellipsis
   cut exactly the words that explained the problem. */
#root .rv2.aud .screen{background:#fff}
#root .rv2 .audh{font-size:17px;font-weight:700;letter-spacing:-0.01em}
#root .rv2 .audchip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);
  padding:7px 11px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:#fff}
#root .rv2 .audchip i{width:11px;height:11px;flex:none;display:inline-block}
#root .rv2 .audchip b{font-size:12px;background:var(--ink);color:#fff;padding:1px 7px;font-variant-numeric:tabular-nums}
#root .rv2 .audmsg{margin:0 14px 14px;border:3px solid #1e7a46;background:#eaf6ef;color:#14532d;
  padding:10px 12px;font-size:13px;font-weight:600;overflow-wrap:anywhere}
#root .rv2 .audempty{padding:36px 20px;text-align:center;color:var(--muted);font-size:14px;max-width:62ch;margin:0 auto}
#root .rv2 .audgrp{border-top:3px solid var(--ink)}
#root .rv2 .audgh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;background:var(--paper)}
#root .rv2 .audsev{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff;padding:3px 8px;flex:none}
#root .rv2 .audtitle{font-size:14px;font-weight:700;min-width:0;overflow-wrap:anywhere}
#root .rv2 .audn{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:auto}
#root .rv2 .audrow{display:grid;grid-template-columns:minmax(120px,34%) minmax(0,1fr) auto;gap:12px;
  align-items:start;padding:9px 14px;border-bottom:1px solid rgba(20,19,18,.14);font-size:14px}
#root .rv2 .audrow:last-child{border-bottom:0}
#root .rv2 .audrow.go{cursor:pointer}
#root .rv2 .audrow.go:hover{background:rgba(242,193,0,.22)}
#root .rv2 .auditem{font-weight:600;overflow-wrap:anywhere;min-width:0}
#root .rv2 .auddet{color:var(--muted);font-size:13px;line-height:1.45;overflow-wrap:anywhere;min-width:0}
#root .rv2 .audfix{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--r);flex:none;white-space:nowrap}
#root .rv2 .audmore{padding:9px 14px;font-size:12px;color:var(--muted)}
@media (max-width:640px){ #root .rv2 .audrow{grid-template-columns:minmax(0,1fr);gap:3px} }
/* ---- notice form: the message is the content, the rest is settings ------------------------
   The four settings used to be full-width blocks with the same weight as the message, so the one
   thing you came to write was the smallest box on the page. */
#root .rv2 .ned-wrap{margin-bottom:14px}
#root .rv2 .nmeta{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;
  border-top:3px solid var(--ink);padding-top:12px}
#root .rv2 .nf{display:flex;flex-direction:column;gap:4px;min-width:0}
#root .rv2 .nfl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  display:flex;gap:6px;align-items:baseline;white-space:nowrap}
#root .rv2 .nfl i{font-style:normal;font-size:9px;letter-spacing:.06em;opacity:.72;text-transform:none}
#root .rv2 .nmeta input[type=date],#root .rv2 .nmeta select{font:inherit;font-size:13px;font-weight:600;
  padding:6px 8px;border:2px solid var(--ink)!important;border-radius:0!important;background:#fff;color:var(--ink);
  min-height:34px;width:auto;min-width:132px;box-sizing:border-box}
#root .rv2 .nmeta select{min-width:140px}
#root .rv2 .nfrow{display:flex;gap:14px;flex-wrap:wrap;padding-bottom:6px}
#root .rv2 .nchk{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer}
#root .rv2 .nchk input{width:16px;height:16px;accent-color:var(--ink);flex:none}
#root .rv2 .nfend{margin-left:auto;flex-direction:row;align-items:center;gap:12px}
#root .rv2 .nrm{font:inherit;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  padding:6px 10px;min-height:30px;background:none;border:2px solid var(--rt);color:var(--rt);
  border-radius:0;cursor:pointer;white-space:nowrap}
#root .rv2 .nrm:hover{background:var(--rt);color:#fff}
#root .rv2 .nsave{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
@media (max-width:760px){
  #root .rv2 .nmeta{gap:10px 12px}
  #root .rv2 .nmeta input[type=date],#root .rv2 .nmeta select{min-width:0;width:100%}
  #root .rv2 .nf{flex:1 1 46%}
  #root .rv2 .nfend{flex:1 1 100%;margin-left:0;justify-content:space-between}
}
@media (max-width:430px){
  #root .rv2 .nf{flex:1 1 100%}
  /* a 16px field stops iOS zooming the whole page when it is focused */
  #root .rv2 .nmeta input[type=date],#root .rv2 .nmeta select{font-size:16px}
}
/* ---- price trend on the ingredient card ---------------------------------------------------
   Small on purpose - it answers "is this going up?" and hands the detail to AI Invoice. */
#root .ctrend{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:2px 0}
#root .ctrend.none{font-size:12px;color:var(--muted)}
#root .ctrend svg{flex:none;display:block}
#root .ctxt{display:flex;flex-direction:column;gap:1px;min-width:0;font-size:11px;color:var(--muted);line-height:1.35}
#root .ctxt b{font-size:14px;font-variant-numeric:tabular-nums}
#root .ctlast{overflow-wrap:anywhere}
/* ---- secondary controls are smaller than the content they act on -------------------------
   A tool should not look as important as the thing it works on. The primary action per screen
   (.btn.p) keeps its size on purpose. */
#root .rv2 .btn.sm{font-size:11px;letter-spacing:.08em;padding:5px 9px;min-height:28px;border-width:2px}
#root .rv2 .btn.sm:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}
#root .rv2 .bar .btn:not(.p){font-size:12px;padding:8px 12px;min-height:34px;border-width:2px}
#root .rv2 .chips .chip{font-size:12px;padding:6px 10px;min-height:32px}
#root .rv2 .chips .chip .n{font-size:11px}
/* destructive actions are rare and should read as small and deliberate, never as a big red slab */
#root .rv2 .btn[style*="--rt"]{font-size:11px;letter-spacing:.1em;padding:6px 10px;min-height:30px;border-width:2px}
/* the little link-buttons inside rows and panel headers */
#root .rv2 .acts .btn,#root .rv2 .lp .list .btn{font-size:11px;padding:5px 9px;min-height:28px}
#root .rv2 .sub{font-size:12px}
/* ---- the auto-link switch ------------------------------------------------------------------
   The app now writes on its own, so the control that governs that sits in plain sight. */
#root .rv2 .aiv-auto{display:inline-flex;align-items:center;gap:8px;margin-left:auto;
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
#root .rv2 .aiv-auto input{width:16px;height:16px;accent-color:var(--ink);flex:none}
@media (max-width:560px){ #root .rv2 .aiv-auto{margin-left:0;flex-basis:100%} }
/* ---- the meeting editor's fixed action bar must not sit on top of the lists ----------------
   It is position:fixed, so the rail and the actions panel scrolled underneath it and the last
   sections could be neither read nor tapped. --actbar-h is published by the bar itself so these
   reservations stay correct when it wraps to two rows on a phone. */
#root .rv2.fs{--actbar-h:76px}
#root .rv2.fs .actbar{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#root .rv2.fs .rail,#root .rv2.fs .acts{
  max-height:calc(100vh - 76px - var(--actbar-h));
  padding-bottom:calc(var(--actbar-h) + 12px)}
#root .rv2.fs .cur{padding-bottom:calc(var(--actbar-h) + 28px)}
@media (max-width:900px){
  /* stacked layout: the rail is a horizontal strip, so only the column under it needs the room */
  #root .rv2.fs .rail{max-height:none;padding-bottom:0}
  #root .rv2.fs .acts{max-height:none;padding-bottom:calc(var(--actbar-h) + 12px)}
}
@media (max-width:640px){ #root .rv2.fs{--actbar-h:120px} }
/* ---- closing checklist, reachable from RCC ------------------------------------------------
   Sits in the top row beside the app switcher. The kitchen closes every night and whoever is
   doing it should not have to remember which app it lives in. */
#root .closebtn{display:inline-flex;align-items:center;justify-content:center;flex:none;
  height:44px;padding:0 14px;margin-left:2px;background:var(--y);color:var(--ink);
  border:3px solid var(--ink);text-decoration:none;white-space:nowrap;
  font:inherit;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  transition:transform .16s cubic-bezier(.32,.72,0,1),box-shadow .16s}
#root .closebtn:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}
#root .closebtn:active{transform:none;box-shadow:none}
@media (max-width:520px){ #root .closebtn{padding:0 10px;font-size:11px;letter-spacing:.06em} }
@media (prefers-reduced-motion:reduce){ #root .closebtn{transition:none} #root .closebtn:hover{transform:none} }
/* ---- handover composer, in the house language --------------------------------------------- */
#root .hov-compose{display:flex;gap:10px;align-items:stretch;margin-bottom:12px;min-width:0}
#root .hov-input{flex:1 1 auto;min-width:0;box-sizing:border-box;font:inherit;font-size:16px;
  font-weight:500;padding:0 12px;height:46px;border:3px solid var(--ink);border-radius:0;
  background:#fff;color:var(--ink);outline:none}
#root .hov-input:focus{box-shadow:4px 4px 0 var(--y)}
#root .hov-input::placeholder{color:var(--muted)}
#root .hov-post{flex:none;font:inherit;font-size:12px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;padding:0 16px;height:46px;background:var(--r);color:#fff;
  border:3px solid var(--r);border-radius:0;cursor:pointer;white-space:nowrap;
  transition:transform .16s cubic-bezier(.32,.72,0,1),box-shadow .16s}
#root .hov-post:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}
#root .hov-post:active{transform:none;box-shadow:none}
@media (max-width:430px){ #root .hov-compose{flex-wrap:wrap} #root .hov-post{width:100%} }
@media (prefers-reduced-motion:reduce){ #root .hov-post{transition:none} #root .hov-post:hover{transform:none} }
</style>

<script>
/* --- inlined hideout-bot.js (shared assistant + recipe generation) --- */
/* Hideout Assistant — ONE shared chatbot for both apps (Recipe Cost / catering-cost + Ordering).
   Inline this same file in each app's single-HTML build (keeps local-refs = 0).
   Usage:  HideoutBot.mount({ source:"rcc" | "ordering", backendUrl, token, logo, greeting, suggestions });
   - Answers via the shared AI backend (POST action=aiAssist, JSON body: question + trimmed history + live clientCtx) when backendUrl is set,
     else falls back to window.claude.complete (preview). Context is built from whichever
     app's data is present, so the AI sees ALL of that app's info — including RCC's
     Today routine + Prep board so the Ordering app can talk about kitchen status too.
   - Recipe generation: when the user asks to CREATE a recipe the AI emits a `recipe-json`
     block; if the host app exposes window.HideoutRCC the bot shows a proposal card that
     matches ingredients, asks about missing ones, and saves a new recipe on confirm.
   - Memory: every Q&A is appended to localStorage `hideout_bot_log`; where the host app
     exposes window.HideoutRCC.logQuestion it is ALSO written to state.botLog and synced to
     Firestore so Claude Cowork can read and learn from the conversation history. */
(function(){
  var BOT_VERSION="2026-09-09.2";
  if(window.HideoutBot){ try{ if(window.HideoutBot.version!==BOT_VERSION) console.error("HideoutBot version collision", window.HideoutBot.version, BOT_VERSION); }catch(e){} return; }
  var TOKEN_DEFAULT="hideout-9f2a7c-orders", LOG_KEY="hideout_bot_log", LOG_MAX=400;
  // Recipe Cost lives in its own Firestore project; the bot auto-reads it so Ordering can answer recipe questions too.
  var RCC_FS="https://firestore.googleapis.com/v1/projects/hideout-recipe-cost/databases/(default)/documents/hideout_app/recipe_cost?key=AIzaSyC6-J5PoHy_Y4JGgN0cmi2iVImuEADYK9s";
  var RCC_CACHE=null, RCC_TRIED=false, RCC_RETRY_AFTER=0;
  function fsDec(v){ if(v==null) return null; if("stringValue" in v) return v.stringValue; if("integerValue" in v) return Number(v.integerValue); if("doubleValue" in v) return v.doubleValue; if("booleanValue" in v) return v.booleanValue; if("nullValue" in v) return null; if("timestampValue" in v) return v.timestampValue; if("mapValue" in v){ var o={}, f=(v.mapValue.fields)||{}; Object.keys(f).forEach(function(k){ o[k]=fsDec(f[k]); }); return o; } if("arrayValue" in v){ return ((v.arrayValue.values)||[]).map(fsDec); } return null; }
  async function ensureRcc(){ if(RCC_CACHE||hasRcc()||RCC_TRIED) return; if(Date.now()<RCC_RETRY_AFTER) return; try{ var r=await fetch(RCC_FS,{cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status); var j=await r.json(); var st=(j.fields&&j.fields.state)?fsDec(j.fields.state):null; if(typeof st==="string"){ try{ st=JSON.parse(st); }catch(e){} } RCC_CACHE=st||null; RCC_TRIED=true; }catch(e){ RCC_RETRY_AFTER=Date.now()+30000; } }

    var inPrep=!!r.showInPrep, st=r.prepStatus;

  function extractNotice(text){
    if(!text) return null;
    var m=text.match(/```\s*notice-json\s*([\s\S]*?)```/i); if(!m) return null;
    var n; try{ n=JSON.parse(m[1].trim()); }catch(e){ return null; }
    if(!n || !(String(n.title||"").trim() || String(n.body||"").trim())) return null;
    return { intro:text.slice(0,m.index).trim(), notice:n };
  }
  function extractCalEvent(text){
    if(!text) return null;
    var m=text.match(/```\s*calendar-json\s*([\s\S]*?)```/i); if(!m) return null;
    var ev; try{ ev=JSON.parse(m[1].trim()); }catch(e){ return null; }
    if(!ev||!ev.title||!ev.date||!/^\d{4}-\d{2}-\d{2}$/.test(ev.date)) return null;
    return { intro:text.slice(0,m.index).trim(), ev:ev };
  }

  // ---- recipe-json parsing ----
  function extractRecipe(text){
    if(!text) return null;
    var m=text.match(/```\s*recipe-json\s*([\s\S]*?)```/i);
    if(!m){ var j=text.match(/```\s*json\s*([\s\S]*?)```/i); if(!j) return null; m=j; }
    var raw=m[1].trim(), rec;
    try{ rec=JSON.parse(raw); }catch(e){ return null; }
    if(!rec||!rec.name||!Array.isArray(rec.items)) return null;
    return { intro:text.slice(0, m.index).trim(), recipe:rec };
  }
  function extractRemember(text){
    if(!text) return null;
    var m=text.match(/```\s*remember-json\s*([\s\S]*?)```/i); if(!m) return null;
    var facts=[]; try{ var o=JSON.parse(m[1].trim()); facts=(o&&o.facts)||[]; }catch(e){ return null; }
    facts=(facts||[]).map(function(x){ return String(x).trim(); }).filter(Boolean);
    if(!facts.length) return null;
    return { facts:facts, rest:(text.slice(0,m.index)+text.slice(m.index+m[0].length)).replace(/\n{3,}/g,"\n\n").trim() };
  }

    async function runAuditor(){
      var prompt="TASK: Act as a data-quality auditor for The Hideout apps. Using ONLY the data above, list up to 5 of the most important concrete problems you can see — e.g. a menu dish missing a sell price, an ingredient missing purchase price or quantity, a likely-missing allergen, a recipe item whose unit doesn't match its ingredient, a menu dish whose margin is below its target, an ingredient a recipe references but that is archived/missing, or an obvious duplicate. Output ONE per line EXACTLY as: sev|item name|the issue  (sev = high, med or low). If you genuinely find nothing worth flagging, reply with just: NONE.";
      var r=(await callAI(opts, buildContext(opts), [], prompt)).answer;
      if(/^\s*none\s*$/i.test(r||"")) { agents.lastAudit=Date.now(); agSave(); return 0; }
      var lines=(r||"").split("\n").map(function(x){return x.trim();}).filter(function(x){return x&&x.indexOf("|")>-1;});
      var parsed=lines.map(function(l){ var p=l.replace(/^[-*\d.\s]+/,"").split("|"); var sev=(p[0]||"med").toLowerCase().replace(/[^a-z]/g,""); if(["high","med","low"].indexOf(sev)<0) sev="med"; return { sev:sev, item:(p[1]||"").trim(), issue:(p.slice(2).join("|")||p[1]||l).trim(), ts:Date.now() }; }).filter(function(f){ return f.issue; });
      var key=function(f){ return (f.item+"|"+f.issue).toLowerCase(); }, seen={};
      agents.audit.forEach(function(f){ seen[key(f)]=1; });
      var fresh=parsed.filter(function(f){ if(seen[key(f)]) return false; seen[key(f)]=1; return true; });
      agents.audit=fresh.concat(agents.audit).slice(0,40); agents.lastAudit=Date.now(); agSave(); refreshBadge(); if(curView==="insights") renderInsights();
      return fresh.length;
    }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {

    const panel = dragRef.current;

    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);

      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };

    panel.style.bottom = offsetRef.current.y + 'px';

    if (!open) return;

    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);

    <>

      <div className="twk-lbl">

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}

  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}

  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);

    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);

  }

  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };

    };

      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}

        <div className="twk-seg-thumb"

        ))}
      </div>
    </TweakRow>

}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />

  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

function matchIngredient(name, ingredients){
  const n = (name||"").trim().toLowerCase(); if(!n) return null;
  const nt=n.split(/\s+/).filter(Boolean); const nset=new Set(nt);
  let best=null, bestScore=0, bestLen=1e9;
  ingredients.forEach(ing=>{
    if(ing.archived) return;
    const a = ing.name.toLowerCase(); const at=a.split(/\s+/).filter(Boolean); const aset=new Set(at); let score=0;
    if(a===n) score=1;
    else if(nt.length && nt.every(w=>aset.has(w))) score=0.9;
    else if(at.length && at.every(w=>nset.has(w))) score=0.55;

/* Every popup in the app goes through this one component - 24 of them. It used to be a rounded
   Tailwind card with a flat black scrim, which is why the whole app read as "new design with old
   popups on top". Now it speaks tdv2: 3px ink border, hard offset shadow, square corners, Jost,
   uppercase title on the ink bar.

   Motion (Apple-ish, deliberately restrained):
     - the panel grows FROM the spot that was tapped, not from the middle of the screen. Whoever
       opens it passes the click point via openAt(); without one it falls back to centre-top.
     - one spring curve for everything: cubic-bezier(.32,.72,0,1) - leaves fast, settles soft.
     - the backdrop blurs rather than just darkening, so the page behind reads as "pushed back".
     - closing is NOT animated on purpose: a dialog that lingers on the way out feels slow.
   `sheet` keeps its meaning: full-bleed width for A4 catering documents. */
/* ---- Escape layering -----------------------------------------------------------------------
   Five separate components listen for Escape on window (this Modal, the recipe editor, the recipe
   detail sheet, the meeting editor, the ingredient dropdown). Without a stack they all fire on the
   same key: measured 2026-09-11, Esc on an open ingredient dropdown closed the dropdown AND threw
   away the half-written recipe behind it.

   So every overlay registers itself while it is open and only the last one in acts. The guard -
   not stopPropagation - is what makes this correct: listeners on the same target and phase run in
   registration order, and the editor always registers before the dropdown it contains, so it would
   have run first no matter what the dropdown did to the event. */
const EscLayer = {
  stack: [],
  push(tok){ this.stack.push(tok);
    return ()=>{ const i=this.stack.lastIndexOf(tok); if(i>=0) this.stack.splice(i,1); }; },
  isTop(tok){ return this.stack.length===0 || this.stack[this.stack.length-1]===tok; }
};
/* `active` lets a component register only while it is actually showing (the dropdown). onEsc is
   held in a ref so a new inline arrow on every render does not re-register the listener. */
function useEscLayer(active, onEsc){
  const tok = useRef(null); if(tok.current===null) tok.current={};
  const cb = useRef(onEsc); cb.current = onEsc;
  useEffect(()=>{ if(!active) return; return EscLayer.push(tok.current); }, [active]);
  useEffect(()=>{ if(!active) return;
    const h=e=>{ if(e.key!=="Escape") return; if(!EscLayer.isTop(tok.current)) return;
      e.preventDefault(); e.stopPropagation(); cb.current&&cb.current(); };
    window.addEventListener("keydown",h,true);
    return ()=>window.removeEventListener("keydown",h,true); }, [active]);
}

  before:["Lock a fixed day & time each week (20–30 min max). Standing meetings stay short.","Bring your numbers: temp & cleaning logs, waste log, par sheet, specials sell-through, catering orders, roster.","Skim last meeting's action items so you can follow up."],

function fmtMeetDate(d){ try{ const dt=new Date(d+"T00:00:00"); return dt.toLocaleDateString("en-AU",{weekday:"short", day:"numeric", month:"short", year:"numeric"}); }catch(e){ return d; } }
/* ---- Meeting -> notice board ---------------------------------------------------------------
   Every venue gets one notice built from its own most recent meeting, and the next meeting at that
   venue replaces it (they meet about every two months). Derived at render time instead of written
   into state: no stale copies to clean up, no duplicates when a meeting is edited, and ticking an
   action off in the meeting editor updates the board the moment it happens. */
function meetingNoticeBody(m){
  const L=[];
  const acts=(m.actions||[]).filter(a=>a && String(a.text||"").trim());
  if(acts.length){
    L.push("# Actions from the meeting");
    acts.forEach(a=>{
      const tail=[a.owner&&String(a.owner).trim(), a.due&&("due "+a.due)].filter(Boolean).join(", ");
      // \u2610 renders as a tick-box, a done action drops to a plain bullet with a check
      L.push((a.done?"- \u2713 ":"\u2610 ")+String(a.text).trim()+(tail?(" ("+tail+")"):""));
    });
  }
  const notes=MEETING_SECTIONS.map(sec=>{
    const t=String((m.notes||{})[sec.id]||"").trim();
    return t? {title:sec.title, text:t.replace(/\s+/g," ")} : null;
  }).filter(Boolean);
  if(notes.length){
    if(L.length) L.push("");
    L.push("# What we covered");
    notes.forEach(n=>L.push("- **"+n.title+"** \u2014 "+n.text));
  }
  const who=[m.facilitator&&("Run by "+String(m.facilitator).trim()),
             m.attendees&&("Present: "+String(m.attendees).trim())].filter(Boolean).join(" \u00b7 ");
  if(who && L.length){ L.push(""); L.push(who); }
  return L.join("\n");
}
function meetingNotices(state){
  if(!state || state.noticeFromMeetings===false) return [];
  const latest={};
  (state.teamMeetings||[]).forEach(m=>{
    if(!m || !m.date) return;
    const k=m.branchId||"", cur=latest[k];
    if(!cur || ((m.date||"")+(m.time||"")) > ((cur.date||"")+(cur.time||""))) latest[k]=m;
  });
  const names={}; (state.branches||[]).forEach(b=>{ names[b.id]=b.name; });
  return Object.keys(latest).map(k=>{
    const m=latest[k], body=meetingNoticeBody(m);
    if(!body.trim()) return null;                       // an empty meeting record is not a notice
    const open=(m.actions||[]).filter(a=>a && String(a.text||"").trim() && !a.done).length;
    return { id:"auto-meet-"+m.id, auto:true, meetingId:m.id,
      title:"Team meeting "+(fmtMeetDate(m.date)||m.date)+(open? (" \u2014 "+open+" open action"+(open>1?"s":"")) : " \u2014 recap"),
      body, from:m.date, until:"", pin:true, tone:"info",
      branch:names[k]||"", archived:false };
  }).filter(Boolean);
}

function CloudSyncModal({cloud,setCloud,fbRef,state,setState,onClose}){
  const [cfgText,setCfgText]=useState(cloud.config?JSON.stringify(cloud.config,null,2):"");
  const [msg,setMsg]=useState("");
  const [mirror,setMirror]=useState(()=>{ try{ return !!(JSON.parse(localStorage.getItem("hideout_rcc_conn")||"{}").mirror); }catch(e){ return false; } });
  function saveConfig(){ try{ const c=JSON.parse(cfgText.trim()); saveCfg(c); setCloud(x=>({...x,config:c,status:"connecting",error:""})); setMsg("Config saved. It will connect in a moment — then click Sign in with Google."); }catch(e){ setMsg("Invalid JSON: "+e.message); } }
  async function signIn(){ const fb=fbRef.current; if(!fb){ setMsg("Save a valid Firebase config first (and reopen)."); return; } try{ const pr=new firebase.auth.GoogleAuthProvider(); await fb.auth.signInWithPopup(pr); setMsg("Signed in."); }catch(e){ setMsg("Sign-in error: "+e.message+" — the app must be opened from your Firebase Hosting URL (not a local file) for Google login."); } }
  async function doSignOut(){ try{ await fbRef.current.auth.signOut(); setMsg("Signed out."); }catch(e){} }
  async function pull(){ try{ const fb=fbRef.current; const d=(await fb.db.collection(CLOUD_DOC().col).doc(CLOUD_DOC().doc).get()).data(); if(d&&d.state){ setState(migrate(d.state)); setMsg("Pulled cloud → local."); } else setMsg("No cloud data yet."); }catch(e){ setMsg("Pull error: "+e.message); } }
  async function push(){ try{ const fb=fbRef.current; await fb.db.collection(CLOUD_DOC().col).doc(CLOUD_DOC().doc).set({state: JSON.parse(JSON.stringify(state)), updatedAt:Date.now(), clientId:CLIENT_ID, by:(cloud.user&&cloud.user.email)||""}); setMsg("Pushed local → cloud."); }catch(e){ setMsg("Push error: "+e.message); } }
  function toggleMirror(v){ setMirror(v); try{ const c=JSON.parse(localStorage.getItem("hideout_rcc_conn")||"{}"); c.mirror=v; localStorage.setItem("hideout_rcc_conn", JSON.stringify(c)); }catch(e){} }
  const dot = cloud.status==="on"?"bg-emerald-500":cloud.status==="error"?"bg-red-500":cloud.status==="signedout"?"bg-amber-400":"bg-stone-300";

/* ---------------- Audit (auto issue scan) ---------------- */
function detectAllergens(name){
  const n=(name||"").toLowerCase(); const out=new Set();
  const map=[["Milk",["milk","butter","cream","cheese","yog","dairy","ghee","custard","brie","mozzarella","parmesan","feta","mascarpone","ricotta"]],["Egg",["egg","mayo","aioli","meringue"]],["Gluten",["flour","wheat","bread","bagel","pasta","noodle","crumb","batter","barley","rye","cracker","biscuit","cake","pastry","brioche","croissant","bun","wrap","tortilla","semolina","couscous","soy sauce"]],["Soy",["soy","tofu","edamame","miso","tempeh"]],["Peanut",["peanut"]],["Tree nuts",["almond","cashew","walnut","pecan","hazelnut","pistachio","macadamia","praline"]],["Sesame",["sesame","tahini"]],["Fish",["fish","anchovy","tuna","salmon","cod","sardine"]],["Shellfish",["prawn","shrimp","crab","lobster","oyster","mussel","clam","squid","calamari","scallop"]]];
  map.forEach(([alg,kws])=>{ if(kws.some(k=>n.includes(k))) out.add(alg); });
  return [...out];
}
const PIECE_WEIGHTS=[["garlic clove",5],["clove",5],["spring onion",15],["shallot",40],["mushroom",20],["egg",50],["lime",70],["carrot",80],["lemon",100],["bagel",100],["banana",120],["tomato",120],["onion",150],["capsicum",160],["potato",170],["apple",180],["orange",180],["avocado",200],["croissant",60],["bun",70],["tortilla",50],["slice",30]];
function commonPieceWeight(name){ const n=(name||"").toLowerCase(); for(const [k,w] of PIECE_WEIGHTS){ if(n.includes(k)) return w; } return 0; }
function collapsePrepSubs(n){
  const recs=(n.recipes||[]).filter(r=>!r.archived);
  const subs=recs.filter(r=>!(r.sellPrice>0)&&(r.items||[]).length>=3&&(r.items||[]).every(it=>it.ingredientId));
  let changed=0;
  recs.forEach(r=>{
    if(!(r.sellPrice>0)) return;
    if((r.items||[]).some(it=>it.subRecipeId)) return; // already collapsed
    const ids=new Set((r.items||[]).filter(it=>it.ingredientId).map(it=>it.ingredientId));
    const cands=subs.filter(x=>x.id!==r.id&&x.items.every(it=>ids.has(it.ingredientId))).sort((a,b)=>b.items.length-a.items.length);
    if(!cands.length) return;
    const covered=new Set(); const picked=[];
    cands.forEach(x=>{ if(x.items.some(it=>!covered.has(it.ingredientId))){ picked.push(x); x.items.forEach(it=>covered.add(it.ingredientId)); } });
    if(!picked.length) return;
    r.items=(r.items||[]).filter(it=>!(it.ingredientId&&covered.has(it.ingredientId))).concat(picked.map(x=>({subRecipeId:x.id, ingredientId:"", qty:0, rawName:x.name, rawUnit:""})));
    changed++;
  });
  return changed;
}
/* Everything a recipe's ingredients already know about allergens, in canonical names. One level
   into sub-recipes, which is where the bread and the sauces live. */
function rollupAllergens(rec, byId, byRec, depth){
  const out=[];
  (rec.items||[]).forEach(it=>{
    if(it.ingredientId){ const g=byId[it.ingredientId]; if(g) out.push(...allergenList(g.allergens)); }
    else if(it.subRecipeId && (depth||0)<1){ const r2=byRec[it.subRecipeId];
      if(r2) out.push(...rollupAllergens(r2, byId, byRec, (depth||0)+1)); }
  });
  const seen=new Set(), uniq=[];
  out.forEach(a=>{ const k=a.toLowerCase(); if(!seen.has(k)){ seen.add(k); uniq.push(a); } });
  return uniq;
}
function runAutoFix(n){
  let alg=0, wt=0, link=0, roll=0, cat=0;
  (n.recipes||[]).forEach(r=>(r.items||[]).forEach(it=>{ if((it.ingredientId||it.subRecipeId)||!it.rawName) return; const m=matchIngredient(it.rawName, n.ingredients); if(m){ it.ingredientId=m.ing.id; link++; return; } const mr=matchRecipe(it.rawName, n.recipes, r.id); if(mr){ it.subRecipeId=mr.id; link++; } }));
  const eachByWeight=new Set();
  (n.recipes||[]).forEach(r=>(r.items||[]).forEach(it=>{ const ing=(n.ingredients||[]).find(g=>g.id===it.ingredientId); if(ing && EACH_U.has(normU(ing.useUnit)) && it.rawUnit && U_MASS[normU(it.rawUnit)]!=null) eachByWeight.add(ing.id); }));
  (n.ingredients||[]).forEach(i=>{
    const guess=detectAllergens(i.name); const cur=i.allergens||[]; const missing=guess.filter(a=>!cur.includes(a));
    if(missing.length){ i.allergens=[...cur,...missing]; alg+=missing.length; }
    if(eachByWeight.has(i.id) && !(i.gramsPerEach>0)){ const w=commonPieceWeight(i.name); if(w){ i.gramsPerEach=w; wt++; } }
  });
  /* A recipe with an empty allergen list, whose own ingredients answer the question. Only fills
     a blank - a list somebody wrote is never touched, and neither is an explicit "none". */
  const byId=Object.fromEntries((n.ingredients||[]).map(g=>[g.id,g]));
  const byRec=Object.fromEntries((n.recipes||[]).map(r=>[r.id,r]));
  (n.recipes||[]).forEach(r=>{
    if(r.archived) return;
    const cur=(r.allergens||[]).map(x=>String(x).trim()).filter(Boolean);
    if(cur.length) return;                                  // already answered, including "none"
    const found=rollupAllergens(r, byId, byRec, 0);
    if(found.length){ r.allergens=found; roll++; }
  });
  /* A dish on the menu with no category falls to the bottom of the board. The app can already
     work one out from the dish itself, so there is no reason to ask. */
  (n.recipes||[]).forEach(r=>{
    if(r.archived || (r.category||"").trim()) return;
    const onMenu = !!r.showInDish || (r.branch && Object.keys(r.branch).some(b=>r.branch[b] && r.branch[b].dish));
    if(!onMenu) return;
    let c=""; try{ c=dishCategory(r)||""; }catch(e){ c=""; }
    if(c){ r.category=c; cat++; }
  });
  return {alg, wt, link, roll, cat};
}
function auditData(state, ingMap){
  const issues=[]; let _ref=null; const add=(type,item,detail,sev,go)=>issues.push({type,item,detail,sev:sev||"warn",go:go||null,ref:_ref});
  const recs=(state.recipes||[]).filter(r=>!r.archived);
  const ings=(state.ingredients||[]).filter(i=>!i.archived);
  const used=new Set(); recs.forEach(r=>(r.items||[]).forEach(it=>{ if(it.ingredientId) used.add(it.ingredientId); if(it.subRecipeId) used.add(it.subRecipeId); }));
  recs.forEach(r=>{
    _ref={kind:"rec", id:r.id};
    (r.items||[]).forEach(it=>{
      if(!it.ingredientId && !it.subRecipeId){ add("Unlinked ingredient", r.name, it.rawName||"?", "error", "rec"); return; }
      if(it.ingredientId && !ingMap[it.ingredientId]){ add("Broken link — cost understated", r.name, `${it.rawName||"an ingredient"} was deleted/re-imported; this line is silently skipped in the cost. Re-link it.`, "error", "rec"); return; }
      if(it.subRecipeId && !(state.recipes||[]).some(x=>x.id===it.subRecipeId)){ add("Broken link — cost understated", r.name, `a linked sub-recipe is missing; this line is silently skipped in the cost. Re-link it.`, "error", "rec"); return; }
      if(!(it.qty>0)){ const ing0=ingMap[it.ingredientId]; add("Missing quantity", r.name, (ing0?ing0.name:it.rawName)||"", "error", "rec"); return; }
      if(it.ingredientId){ const ing=ingMap[it.ingredientId]; if(!unitResolvable(it,ing)){ const each=ing&&EACH_U.has(normU(ing.useUnit)); add("Unit mismatch (can't cost)", r.name, `${ing?ing.name:""}: uses ${it.qty}${it.rawUnit}, priced per ${ing?ing.useUnit:"?"}${each?" — set 'grams per each'":""}`, "error", "ing"); } }
    });
    const isMenu=r.sellPrice>0;
    const cost=recipeCost(r,ingMap)/(r.yield||1);
    if(isMenu && cost>r.sellPrice*3) add("Cost looks too high", r.name, `unit cost ${money(cost)} vs sell ${money(r.sellPrice)}`, "warn", "rec");
    const hasProc=(((r.procedure||"").trim())||bakedProc(r.name)).length>0;
    if(isMenu && !r.image) add("Dish has no photo", r.name, "Add a photo so chefs can see the plating", "tip", "dish");
    const _nm=(r.name||"").toLowerCase(); const isAddon=/\badd[\s-]?on\b/.test(_nm)||_nm.trim()==="test";
    if(isMenu && !hasProc && !isAddon) add("No method written", r.name, "Chefs can't see how to make it", "warn", "rec");
    if(isMenu && (!r.category || !r.category.trim())) add("Menu dish uncategorized", r.name, "Won't file under a category on the menu", "tip", "dish");
    if(isMenu){ const m=marginOf(r,ingMap).margin; if(m < (r.targetMargin/100)) add("Below target margin", r.name, `${pct(m)} vs target ${r.targetMargin}%`, "warn", "rec"); }
    if(r.showInDish && !isMenu) add("On menu but no sell price", r.name, "Set a sell price to track margin", "warn", "rec");
  });
  ings.forEach(i=>{
    _ref={kind:"ing", id:i.id};
    const guess=detectAllergens(i.name); const missing=guess.filter(a=>!(i.allergens||[]).includes(a));
    if(missing.length) add("Possible missing allergen", i.name, "likely: "+missing.join(", "), "warn", "ing");
    if(!(i.purchasePrice>0)||!(i.purchaseQty>0)) add("Missing price / purchase qty", i.name, "", "error", "ing");
    if(!used.has(i.id)) add("Ingredient not used anywhere", i.name, "Not in any recipe — archive if discontinued", "tip", "ing");
  });
  const byName={}; ings.forEach(i=>{ const k=(i.name||"").trim().toLowerCase(); if(k)(byName[k]=byName[k]||[]).push(i); });
  Object.keys(byName).forEach(k=>{ if(byName[k].length>1){ _ref={kind:"ing", id:byName[k][0].id}; add("Duplicate ingredient name", byName[k][0].name, byName[k].length+" entries share this name — merge them", "warn", "ing"); } });
  const groups={}; issues.forEach(x=>{ (groups[x.type]=groups[x.type]||[]).push(x); });
  return groups;
}
const AUDIT_SEV={error:{c:"#d70015", bg:"rgba(215,0,21,.07)", label:"Error"}, warn:{c:"#b45309", bg:"rgba(180,83,9,.07)", label:"Fix soon"}, tip:{c:"var(--color-primary)", bg:"var(--color-canvas-parchment)", label:"Suggestion"}};
const AUDIT_GO={rec:["rec","Recipes"], ing:["ing","Ingredients"], dish:["dish","Dishes"]};
function Audit({state, ingMap, setTab, update}){
  const groups=auditData(state, ingMap);
  const keys=Object.keys(groups);
  const total=keys.reduce((n,k)=>n+groups[k].length,0);
  let nE=0,nW=0,nT=0; keys.forEach(k=>groups[k].forEach(x=>{ x.sev==="error"?nE++:x.sev==="warn"?nW++:nT++; }));
  const rank={error:0,warn:1,tip:2};
  const sortedKeys=keys.slice().sort((a,b)=> (rank[groups[a][0].sev]-rank[groups[b][0].sev]) || (groups[b].length-groups[a].length));
  const [msg,setMsg]=useState("");
  const [fixRec,setFixRec]=useState(null);
  const [fixIng,setFixIng]=useState(null);
  const openRef=(ref)=>{
    if(!ref) return;
    if(ref.kind==="rec"){ const r=(state.recipes||[]).find(x=>x.id===ref.id); if(r) setFixRec(JSON.parse(JSON.stringify(r))); }
    else { const g=(state.ingredients||[]).find(x=>x.id===ref.id); if(g) setFixIng(JSON.parse(JSON.stringify(g))); }
  };
  const commitRec=(rec)=>{ update(s=>{ const idx=s.recipes.findIndex(r=>r.id===rec.id); if(idx>=0) s.recipes[idx]=rec; }); setFixRec(null); };
  const commitIng=(ing)=>{ update(s=>{ const idx=s.ingredients.findIndex(i=>i.id===ing.id); if(idx>=0) s.ingredients[idx]=ing; }); setFixIng(null); };
  const createIng=(d)=>{ const ing=newIngredient(d); update(s=>{ s.ingredients.push(ing); }); return ing.id; };
  const doAutoFix=()=>{ let res={alg:0,wt:0,link:0,roll:0,cat:0}; update(n=>{ res=runAutoFix(n); });
    setMsg("Auto-fix — ingredient allergens added: "+res.alg
      +", recipe allergens rolled up from ingredients: "+res.roll
      +", menu categories filled: "+res.cat
      +", grams-per-each set: "+res.wt
      +", ingredients linked: "+res.link
      +". Anything still listed needs a decision the app should not make for you."); };
  const Metric=({n,sev})=>{ const s=AUDIT_SEV[sev]; return <div className="rounded-[14px] p-3.5" style={{background:s.bg, border:"1px solid var(--color-hairline-alpha)"}}><div className="text-2xl font-semibold" style={{color:s.c, fontFamily:"var(--font-display)", lineHeight:1}}>{n}</div><div className="text-xs mt-1" style={{color:"var(--color-ink-muted-80)"}}>{sev==="error"?"Errors — blocking":sev==="warn"?"To fix soon":"Suggestions"}</div></div>; };
  return <div className="rv2 aud">
    <RV2Style />
    <div className="screen">
      <div className="bar">
        <div style={{minWidth:0}}>
          <div className="audh">{total===0?"All clear":"Health check \u2014 "+total+" item"+(total>1?"s":"")+" to review"}</div>
          <div className="cnt">Live scan of your data and menu for errors, fixes and improvements.</div>
        </div>
        <button type="button" className="btn p" style={{marginLeft:"auto"}} onClick={doAutoFix}>AI auto-fix</button>
      </div>
      <div className="chips">
        {[["error",nE],["warn",nW],["tip",nT]].map(([sv,n])=>{ const d=AUDIT_SEV[sv];
          return <span key={sv} className="audchip"><i style={{background:d.c}} aria-hidden="true"></i>{d.label}<b>{n}</b></span>; })}
      </div>
      {msg && <div className="audmsg">{msg}</div>}
      {total===0
        ? <div className="audempty">Nothing needs attention right now. This page flags unlinked ingredients, missing prices, dishes without photos or methods, low-margin items, unused ingredients and duplicates.</div>
        : sortedKeys.map(k=>{ const sev=groups[k][0].sev; const d=AUDIT_SEV[sev];
            const go=groups[k][0].go; const goInfo=go&&AUDIT_GO[go];
            return <div key={k} className="audgrp">
              <div className="audgh" style={{borderLeft:"8px solid "+d.c}}>
                <span className="audsev" style={{background:d.c}}>{d.label}</span>
                <span className="audtitle">{k}</span>
                <span className="audn">{groups[k].length}</span>
                {goInfo && <button type="button" className="btn sm" onClick={()=>setTab(goInfo[0])}>Fix in {goInfo[1]}</button>}
              </div>
              <div className="audrows">
                {groups[k].slice(0,150).map((x,i)=>(
                  <div key={i} className={"audrow"+(x.ref?" go":"")} onClick={x.ref?()=>openRef(x.ref):undefined}
                    title={x.ref?"Open and fix":undefined}>
                    <span className="auditem">{x.item}</span>
                    <span className="auddet">{x.detail}</span>
                    {x.ref && <span className="audfix">Fix &rsaquo;</span>}
                  </div>))}
                {groups[k].length>150 && <div className="audmore">+{groups[k].length-150} more not shown</div>}
              </div>
            </div>; })}
    </div>
    {fixRec && <RecipeEditorV2 rec={fixRec} state={state} ingMap={ingMap} update={update} onCreateIngredient={createIng} onClose={()=>setFixRec(null)} onSave={commitRec} onDelete={id=>{update(s=>{s.recipes=s.recipes.filter(r=>r.id!==id);}); setFixRec(null);}} />}
    {fixIng && <IngredientEditor ing={fixIng} onClose={()=>setFixIng(null)} onSave={commitIng} onDelete={id=>{update(s=>{s.ingredients=s.ingredients.filter(i=>i.id!==id);}); setFixIng(null);}} />}
  </div>;
}
/* ---------------- Dashboard ---------------- */
function Dashboard({state, ingMap, setTab}){
  const ings = state.ingredients.filter(i=>!i.archived);
  const recs = state.recipes.filter(r=>!r.archived);
  const usedIds=new Set(); recs.forEach(r=>r.items&&r.items.forEach(it=>usedIds.add(it.ingredientId)));
  const unused = ings.filter(i=>!usedIds.has(i.id));
  const noSupplier = ings.filter(i=>!i.suppliers||i.suppliers.length===0);
  const noAllergen = ings.filter(i=>!i.allergens||i.allergens.length===0);
  const lowMargin = recs.filter(r=>r.sellPrice>0 && marginOf(r,ingMap).margin<(r.targetMargin/100));
  const recentUp = ings.filter(i=>{ const h=i.costHistory||[]; return h.length>=2 && h[h.length-1].price>h[h.length-2].price; });
  const items=[
    ["Ingredients not used in any recipe", unused.map(i=>i.name), "ing"],
    ["Ingredients with no supplier", noSupplier.map(i=>i.name), "ing"],
    ["Ingredients missing allergen info", noAllergen.map(i=>i.name), "ing"],
    ["Recipes below target margin", lowMargin.map(r=>{const {margin}=marginOf(r,ingMap); return `${r.name} (${pct(margin)}/target ${r.targetMargin}%)`;}), "rec"],
    ["Ingredients with a recent price increase", recentUp.map(i=>i.name), "inv"],
  ];
  return <div>
    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6 stagger">
      <Stat label="Active ingredients" value={ings.length} />
      <Stat label="Active recipes" value={recs.length} />
      <Stat label="Below-target recipes" value={lowMargin.length} sub="Check margin" tone={lowMargin.length>0?"warn":undefined} />
      <Stat label="Price-increased ingredients" value={recentUp.length} sub="From latest invoices" tone={recentUp.length>0?"warn":undefined} />
    </div>
    <div className="card p-5"><div className="font-semibold text-stone-800 mb-3">Action items</div><div className="space-y-3">
      {items.map(([label,list,goto])=>(
        <div key={label} className="flex items-start justify-between gap-4 py-2 border-b border-stone-100 last:border-0">
          <div><div className="text-sm font-medium text-stone-700">{label} <span className="text-stone-400">({list.length})</span></div>
          <div className="mt-1 flex flex-wrap gap-1">{list.length? (<>{list.slice(0,8).map((nm,i)=><span key={i} className="text-[11px] bg-stone-100 text-stone-600 rounded-full px-2 py-0.5">{nm.length>26?nm.slice(0,26)+"…":nm}</span>)}{list.length>8 && <span className="text-[11px] text-stone-500 px-1 py-0.5 self-center">+{list.length-8} more</span>}</>) : <span className="text-xs text-emerald-600">No issues ✓</span>}</div></div>
          {list.length>0 && <button onClick={()=>setTab(goto)} className="text-xs text-stone-500 underline shrink-0">View</button>}
        </div>))}
    </div></div>
  </div>;

/* Renderer for every posted note in the app. It reads the same markdown-lite the NoteEditor
   toolbar writes, so what you click is what appears here.
   overflow-wrap is not cosmetic: a pasted URL or a long unbroken word used to run straight out
   through the side of the card. */
/* A price history at a glance for the ingredient card. Deliberately small: the readable detail
   is on AI Invoice, this only answers "is this going up?". Inline SVG, no library. */
function CostTrend({ing}){
  const pts=((ing&&ing.costHistory)||[])
    .map(h=>({d:String(h.date||""), p:Number(h.price)||0}))
    .filter(h=>h.p>0).sort((a,b)=>a.d.localeCompare(b.d)).slice(-12);
  const qty=Math.abs(Number(ing&&ing.purchaseQty))||1;
  if(pts.length<2) return <div className="ctrend none">{pts.length===1?"One price on record \u2014 no trend yet.":"No price history yet."}</div>;
  const first=pts[0].p, last=pts[pts.length-1].p;
  const pct=first>0? ((last-first)/first)*100 : 0;
  const up=pct>0.5, down=pct<-0.5;
  const lo=Math.min(...pts.map(p=>p.p)), hi=Math.max(...pts.map(p=>p.p));
  const W=132,H=30,span=(hi-lo)||1;
  const d=pts.map((p,i)=>{
    const x=(i/(pts.length-1))*(W-2)+1;
    const y=H-1-((p.p-lo)/span)*(H-2);
    return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1); }).join(" ");
  const col=up?"#ec3013":down?"#1e7a46":"#141312";
  return <div className="ctrend">
    <svg width={W} height={H} viewBox={"0 0 "+W+" "+H} role="img"
      aria-label={"Price trend over the last "+pts.length+" changes"}>
      <path d={d} fill="none" stroke={col} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={W-1} cy={(H-1-((last-lo)/span)*(H-2)).toFixed(1)} r="2.5" fill={col} />
    </svg>
    <div className="ctxt">
      <b style={{color:col}}>{(pct>0?"+":"")+pct.toFixed(1)+"%"}</b>
      <span>over {pts.length} changes</span>
      <span className="ctlast">now {money(last/qty)}/{ing.useUnit||"unit"} · last {pts[pts.length-1].d}</span>
    </div>
  </div>;
}

    fontFamily:"ui-monospace,SFMono-Regular,Menlo,monospace",fontSize:12.5,background:"#f3f1ec",
    border:"2px solid #141312",padding:"10px 12px",color:"#141312",margin:"8px 0",overflowX:"auto"},WRAP)}>{buf.join("\n")}</pre>); buf=null; } };
  const fmt=(str)=>{
    /* bold first, then italics inside the leftovers - single * must not eat the ** pairs */
    const parts=String(str).split(/(\*\*[^*]+\*\*)/g);
    const out2=[]; let k=0;
    parts.forEach(p=>{
      if(p.startsWith("**")&&p.endsWith("**")&&p.length>4){ out2.push(<strong key={k++}>{p.slice(2,-2)}</strong>); return; }
      p.split(/(\*[^*\n]+\*)/g).forEach(q=>{
        if(q.startsWith("*")&&q.endsWith("*")&&q.length>2) out2.push(<em key={k++}>{q.slice(1,-1)}</em>);
        else if(q) out2.push(<span key={k++}>{q}</span>);
      });
    });
    return out2;
  };
  lines.forEach(ln=>{
    if(ln.trim()==="```"){ if(buf) flush(); else buf=[]; return; }
    if(buf){ buf.push(ln); return; }
    if(/^\s*(---+|___+)\s*$/.test(ln)){ num=0;
      out.push(<div key={key++} style={{borderTop:"3px solid #141312", margin:"14px 0"}} />); return; }
    const h=ln.match(/^(#{1,4})\s+(.*)/);
    if(h){ num=0; const lvl=h[1].length;
      out.push(<div key={key++} style={Object.assign({fontWeight:700,
        fontSize:lvl<=1?19:lvl===2?16:13,
        marginTop:out.length?16:0, marginBottom:6, color:"#141312", lineHeight:1.25,
        textTransform:lvl>=3?"uppercase":"none", letterSpacing:lvl>=3?"0.14em":"-0.01em"},WRAP)}>{fmt(h[2])}</div>); return; }
    const cb=ln.match(/^\s*([\u2610\u2611])\s+(.*)/);
    if(cb){ num=0; const done=cb[1]==="\u2611";
      out.push(<label key={key++} style={Object.assign({display:"flex",gap:10,alignItems:"flex-start",
        padding:"5px 0",fontSize:14.5,color:"#141312",cursor:"pointer"},WRAP)}>
        <input type="checkbox" defaultChecked={done} style={{marginTop:3,accentColor:"#ec3013",width:17,height:17,flexShrink:0}} />
        <span style={Object.assign({textDecoration:done?"line-through":"none", opacity:done?0.55:1},WRAP)}>{fmt(cb[2])}</span></label>); return; }
    const ol=ln.match(/^\s*(\d+)[.)]\s+(.*)/);
    if(ol){ num++;
      out.push(<div key={key++} style={Object.assign({display:"flex",gap:10,fontSize:14.5,color:"#141312",padding:"3px 0"},WRAP)}>
        <span style={{fontWeight:700,flex:"none",minWidth:18,fontVariantNumeric:"tabular-nums"}}>{num+"."}</span>
        <span style={WRAP}>{fmt(ol[2])}</span></div>); return; }
    const bl=ln.match(/^\s*[-*\u2022]\s+(.*)/);
    if(bl){ num=0;
      out.push(<div key={key++} style={Object.assign({display:"flex",gap:10,fontSize:14.5,color:"#141312",padding:"3px 0"},WRAP)}>
        <span style={{flex:"none",fontWeight:700}}>&middot;</span><span style={WRAP}>{fmt(bl[1])}</span></div>); return; }
    if(ln.trim()===""){ num=0; out.push(<div key={key++} style={{height:9}} />); return; }
    num=0;
    out.push(<div key={key++} style={Object.assign({fontSize:14.5,color:"#141312",lineHeight:1.55,padding:"2px 0"},WRAP)}>{fmt(ln)}</div>);
  });
  flush(); return <div className="minidoc" style={{minWidth:0}}>{out}</div>;
}

/* The toolbar every post box now has. It writes the markdown-lite MiniDoc reads - nothing here
   invents a new format, so old posts keep working and a chef who types the syntax by hand still
   gets the same result.
   Line tools apply to whichever lines the cursor or selection touches, and pressing one again
   removes it, which is what people expect from a list button. */
function NoteEditor({value, onChange, placeholder, rows, minHeight, autoFocus}){
  const ta=useRef(null);
  const [show,setShow]=useState(false);
  const txt=String(value||"");
  const put=(next, selStart, selEnd)=>{
    onChange(next);
    requestAnimationFrame(()=>{ const el=ta.current; if(!el) return; el.focus();
      try{ el.setSelectionRange(selStart, selEnd==null?selStart:selEnd); }catch(e){} });
  };
  const lineTool=(mk, test)=>{
    const el=ta.current; if(!el) return;
    const a=el.selectionStart, b=el.selectionEnd;
    const from=txt.lastIndexOf("\n", a-1)+1;
    let to=txt.indexOf("\n", b); if(to<0) to=txt.length;
    const block=txt.slice(from,to).split("\n");
    const on=block.every(l=>l.trim()==="" || test(l));
    const done=block.map((l,i)=>{
      if(l.trim()==="" && block.length>1) return l;
      const bare=l.replace(/^\s*(?:#{1,4}\s+|[-*\u2022]\s+|\d+[.)]\s+|[\u2610\u2611]\s+)/,"");
      return on? bare : mk(bare, i);
    }).join("\n");
    const next=txt.slice(0,from)+done+txt.slice(to);
    put(next, from, from+done.length);
  };
  const wrapTool=(mark)=>{
    const el=ta.current; if(!el) return;
    const a=el.selectionStart, b=el.selectionEnd;
    const sel=txt.slice(a,b);
    if(!sel){ const next=txt.slice(0,a)+mark+"text"+mark+txt.slice(a);
      put(next, a+mark.length, a+mark.length+4); return; }
    const already=sel.startsWith(mark)&&sel.endsWith(mark)&&sel.length>mark.length*2;
    const body=already? sel.slice(mark.length,-mark.length) : mark+sel+mark;
    const next=txt.slice(0,a)+body+txt.slice(b);
    put(next, a, a+body.length);
  };
  const insert=(str)=>{
    const el=ta.current; if(!el) return;
    const a=el.selectionStart, b=el.selectionEnd;
    const pre=(a>0 && txt[a-1]!=="\n")? "\n":"";
    const next=txt.slice(0,a)+pre+str+txt.slice(b);
    put(next, a+pre.length+str.length);
  };
  /* The label states the job and the type shows it - no H1/H2/H3 to decode. */
  const T=[
    ["Title","t1","Biggest heading",()=>lineTool(t=>"# "+t, l=>/^\s*#\s/.test(l))],
    ["Section","t2","Medium heading",()=>lineTool(t=>"## "+t, l=>/^\s*##\s/.test(l))],
    ["Small","t3","Small uppercase label",()=>lineTool(t=>"### "+t, l=>/^\s*###\s/.test(l))],
    ["B","bold sep","Bold",()=>wrapTool("**")],
    ["I","ital","Italic",()=>wrapTool("*")],
    ["\u2022 Bullets","sep","Bulleted list",()=>lineTool(t=>"- "+t, l=>/^\s*[-*\u2022]\s/.test(l))],
    ["1. Numbers","","Numbered list",()=>lineTool((t,i)=>(i+1)+". "+t, l=>/^\s*\d+[.)]\s/.test(l))],
    ["\u2610 Tick box","","Tick box the team can check off",()=>lineTool(t=>"\u2610 "+t, l=>/^\s*[\u2610\u2611]\s/.test(l))],
    ["\u2014 Divider","sep","Horizontal rule",()=>insert("---\n")]
  ];
  return <div className="ned">
    <div className="ned-bar">
      {T.map(([label,cls,title,fn])=>
        <button key={label} type="button" className={"ned-b "+cls}
          title={title} aria-label={title} onMouseDown={e=>e.preventDefault()} onClick={fn}>{label}</button>)}
      <button type="button" className={"ned-b prev"+(show?" on":"")} aria-pressed={show}
        onClick={()=>setShow(v=>!v)}>{show?"Write":"Preview"}</button>
    </div>
    {show
      ? <div className="ned-prev">{txt.trim()? <MiniDoc text={txt} /> : <span className="ned-empty">Nothing written yet.</span>}</div>
      /* data-gramm*: Grammarly and friends paint their own copy of the text on top of a
         textarea, which shows up as doubled, offset words. They honour these attributes. */
      : <textarea ref={ta} className="ned-ta" rows={rows||10} autoFocus={autoFocus}
          data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false"
          style={minHeight?{minHeight:minHeight}:undefined}
          value={txt} placeholder={placeholder||"Write the post. Use the buttons above for headings, lists and tick boxes."}
          onChange={e=>onChange(e.target.value)} />}
  </div>;
}
