      const bad=Math.abs(r.pct)>200;
      return <div className="b" key={i} style={{animationDelay:(Math.min(i,10)*0.04)+"s"}} onClick={()=>onPick&&onPick(r)}>
        <span className="nm" title={r.name}>{r.name}{bad? <span className="badge warn" style={{marginLeft:8}}>check</span> : null}</span>
        <span className="tr"><i className={r.pct>=0?"up":"dn"} style={{width:w}}></i><em></em></span>
        <span className={"vl "+(r.pct>=0?"up":"down")}>{(r.pct>=0?"+":"−")+Math.abs(r.pct).toFixed(0)+"%"}</span>
      </div>;
    })}
  </div>;
}

function AivMonths({rows}){
  if(rows.length<2) return null;
  const max=Math.max.apply(null,[2].concat(rows.map(r=>Math.abs(r.pct))));
  return <div className="aiv-mo">
    {rows.map((r,i)=>{
      const h=(Math.abs(r.pct)/max*46).toFixed(1)+"%";
      return <div className="c" key={i}>
        <div className="zone">{r.n? <i className={r.pct>=0?"up":"dn"} style={{height:h, animationDelay:(i*0.05)+"s"}}></i> : null}</div>
        <div className="vv">{r.n? ((r.pct>=0?"+":"−")+Math.abs(r.pct).toFixed(1)+"%") : "—"}</div>
        <div className="lb">{r.label}</div>
      </div>;
    })}
  </div>;
}


/* One row of the "needs linking" queue: the supplier line, what the app thinks it is, and
   how sure it is. Nothing is applied until someone presses a button — the pipeline already
   refuses to guess (supplier-invoice-rules.md §매칭 우선순위) and so does this. */
function AivUnmatchedRow({item, onLink, onOpen}){
  const u=item.u, top=item.cands[0];
  return <tr className="row">
    <td style={{width:150}}>{top
      ? <span className={"aiv-cf "+aivTier(top.sc)}>{aivTierName(top.sc)+" · "+top.sc}</span>
      : <span className="badge bad">▲ no idea</span>}</td>
    <td>
      <span className="name">{u.rawName}</span>
      <span className="sub">{u.supplier}{u.orderCode?" · "+u.orderCode:""}{u.date?" · "+u.date:""}</span>
      {top
        ? <React.Fragment>
            <span className="aiv-why">Best guess <b>{top.g.name}</b> — {top.why.slice(0,3).join("; ")}.</span>
            <span className="aiv-sug">
              {item.cands.map((c,j)=><button key={j} type="button" className="btn sm" onClick={()=>onLink(u, c.g.id, c.g.name)}>
                {(j===0?"Link → ":"or ")+c.g.name+" ("+c.sc+")"}
              </button>)}
              <button type="button" className="link" onClick={()=>onOpen(u)}>Something else ›</button>
            </span>
          </React.Fragment>
        : <span className="aiv-why">No ingredient in the app looks like this line — open it to create one.</span>}
    </td>
    <td className="num">{u.perUnitPrice!=null? money(u.perUnitPrice):"–"}{u.useUnit? <span className="sub" style={{display:"inline"}}>/{u.useUnit}</span>:null}</td>
    <td className="num"><button type="button" className="link" onClick={()=>onOpen(u)}>Open ›</button></td>
  </tr>;
}

function InvoicesV2({state, update, ingMap}){
  const rawLog = state.invoiceLog||[];
  const log = rawLog.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.ts||0)-(a.ts||0));
  const unmatched = state.invoiceUnmatched||[];
  const checked = state.invoiceChecked||{};
  const ings = useMemo(()=>(state.ingredients||[]).filter(g=>!g.archived), [state.ingredients]);
  const [card,setCard]=useState(null);
  const [open,setOpen]=useState(null);
  const [days,setDays]=useState(30);
  const [view,setView]=useState("queue");
  const cut = new Date(Date.now()-days*86400000).toISOString().slice(0,10);
  const tod = today();
  const recent = log.filter(r=>String(r.date||"")>=cut);

  const changes=[];
  recent.forEach(r=>(r.updated||[]).forEach(u=>{
    const p=(u.old>0 && u.new!=null)? (u.new-u.old)/u.old*100 : null;
    changes.push({r:r, u:u, pct:p});
  }));
  changes.sort((a,b)=>Math.abs(b.pct||0)-Math.abs(a.pct||0));
  const big=changes.filter(c=>c.pct!=null && Math.abs(c.pct)>=10);
  const flagged=[]; recent.forEach(r=>(r.flagged||[]).forEach(f=>flagged.push({r:r, f:f})));
  const last=log[0];

  const series = useMemo(()=>aivSeries(rawLog), [rawLog]);
  const basket = useMemo(()=>aivBasket(series, cut, tod), [series, cut, tod]);

  /* Month buckets are built from local calendar parts, not toISOString() — in AEST the UTC
     slice of the 1st of a month lands in the previous month and shifts every bar. */
  const months = useMemo(()=>{
    const out=[], now=new Date();
    for(let i=5;i>=0;i--){
      const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
      const y=d.getFullYear(), m=d.getMonth();
      const pad=n=>(n<10?"0":"")+n;
      const from=y+"-"+pad(m+1)+"-01";
      const to=y+"-"+pad(m+1)+"-"+pad(new Date(y, m+1, 0).getDate());
      const b=aivBasket(series, from, to);
      out.push({label:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m], pct:b?b.pct:0, n:b?b.n:0});
    }
    return out;
  }, [series]);

  const movers = useMemo(()=>{
    const out=[];
    Object.keys(series).forEach(k=>{
      const rows=series[k].filter(r=>r.date>=cut);
      if(!rows.length) return;
      const first=rows[0], lastR=rows[rows.length-1];
      const start=(first.old!=null && first.old>0)? first.old : first.price;
      if(!(start>0) || !(lastR.price>0)) return;
      const p=(lastR.price-start)/start*100;
      if(Math.abs(p)<1) return;
      out.push({key:k, name:lastR.name||"?", pct:p, from:start, to:lastR.price, row:lastR,
        pts:series[k].map(r=>r.price)});
    });
    return out.sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct));
  }, [series, cut]);

  /* Same item, two suppliers. The saving is stated per unit unless the run log carries a
     `qty` for the line — the invoice parser does not log purchase volume yet, and inventing
     one would turn a real gap into a fake dollar figure. */
  const cheaper = useMemo(()=>{
    const out=[];
    Object.keys(series).forEach(k=>{
      const rows=series[k];
      if(rows.length<2) return;
      const bySup={};
      rows.forEach(r=>{ const s=r.supplier||"?"; if(!bySup[s] || String(r.date)>=String(bySup[s].date)) bySup[s]=r; });
      const list=Object.keys(bySup).map(s=>bySup[s]).filter(r=>r.price>0);
      if(list.length<2) return;
      const sorted=list.slice().sort((a,b)=>a.price-b.price);
      const best=sorted[0], dear=sorted[sorted.length-1];
      if(!(dear.price>best.price)) return;
      const gapPct=(dear.price-best.price)/dear.price*100;
      if(gapPct<3) return;
      const cur=rows[rows.length-1];
      const save=cur.price-best.price;
      if(!(save>0)) return;
      const vol=rows.filter(r=>r.date>=cut && r.supplier===cur.supplier).reduce((n,r)=>n+(r.qty||0),0);
      out.push({key:k, name:cur.name||"?", unit:cur.unit, best:best, dear:dear, cur:cur,
        gapPct:gapPct, save:save, vol:vol, gapDays:Math.abs(aivDayDiff(best.date, cur.date)), row:cur,
        others:sorted});
    });
    return out.sort((a,b)=>b.gapPct-a.gapPct);
  }, [series, cut]);

  /* Prices the robot already wrote that do not look right. This is the case the Audit tab
     cannot see: the number is present and well-formed, it is just wrong. */
  const anomalies = useMemo(()=>{
    const out=[];
    recent.forEach(r=>{
      if(/^Manual link by staff/.test(String(r.analysis||""))) return;
      (r.updated||[]).forEach(u=>{
        const key=(r.date||"")+"|"+(r.invoiceNo||"")+"|"+(u.id||u.name||"");
        if(checked[key]) return;
        const g=(u.id && ings.find(x=>x.id===u.id)) || ings.find(x=>(x.name||"")===(u.name||"")) || null;
        const oldv=(u.old==null? null : Number(u.old)), nv=Number(u.new);
        const reasons=[];
        /* A cent-or-two per unit is only suspicious on a countable unit. Per gram and per
           millilitre that IS the normal price — flagging it there turned every meat and
           dairy line into a false alarm. */
        const countable = u.unit && !unitsComparable(u.unit,"g") && !unitsComparable(u.unit,"ml");
        if(nv>0 && nv<=0.02 && countable) reasons.push(money(nv)+" a unit — reads like a promo or freebie line, not a real cost");
        if(oldv>0 && nv>0){
          const mult=nv/oldv, fmtX=v=>v>=10? v.toFixed(0) : v.toFixed(1);
          if(mult>=8) reasons.push("jumped "+fmtX(mult)+"× in one invoice — usually a pack-size or unit mix-up");
          else if(mult<=0.125) reasons.push("dropped to 1/"+fmtX(1/mult)+" of the previous price — usually a pack-size or unit mix-up");
          else { const p=(nv-oldv)/oldv*100; if(Math.abs(p)>=40) reasons.push("moved "+(p>0?"+":"−")+Math.abs(p).toFixed(0)+"% in one invoice"); }
        }
        if(!g) reasons.push("this ingredient is not in the app any more");
        else if(u.unit && g.useUnit && !unitsComparable(u.unit, g.useUnit)) reasons.push("invoice unit "+u.unit+" does not convert to the ingredient's "+g.useUnit);
        const hist=(series[u.id||("n:"+(u.name||""))]||[]).filter(x=>x.date<(r.date||"9999")).map(x=>x.price).filter(p=>p>0);
        if(hist.length>=3 && nv>0){
          const sd=hist.slice().sort((a,b)=>a-b), med=sd[Math.floor(sd.length/2)];
          if(med>0 && (nv/med>=5 || med/nv>=5)) reasons.push("well away from its usual "+money(med)+(u.unit?"/"+u.unit:""));
        }
        if(reasons.length) out.push({key:key, r:r, u:u, g:g, reasons:reasons});
      });
    });
    return out;
  }, [recent, ings, series, checked]);

  const suggestions = useMemo(()=>unmatched.map(u=>({u:u, cands:aivSuggest(u, ings)})), [unmatched, ings]);
  /* Auto-linkable only when the winner is both confident AND clearly ahead of the runner-up.
     A 71-vs-70 pair is a coin toss, and a coin toss is what put "Soy Milk" on "Milk". */
  const autoLink = suggestions.filter(x=>x.cands.length && x.cands[0].sc>=70 && (x.cands.length<2 || x.cands[0].sc-x.cands[1].sc>=12));

  /* Apply the confident ones without being asked. Only ever runs over lines it has not seen
     before in this session, so a re-render cannot link the same line twice, and never while the
     owner has it switched off. */
  const autoDone=useRef({});
  useEffect(()=>{
    if(state.invoiceAutoLink===false) return;
    const fresh=autoLink.filter(x=>!autoDone.current[aivKey(x.u.supplier,x.u.orderCode,x.u.rawName)]);
    if(!fresh.length) return;
    fresh.forEach(x=>{ autoDone.current[aivKey(x.u.supplier,x.u.orderCode,x.u.rawName)]=1; });
    doLink(fresh.map(x=>({u:x.u, gId:x.cands[0].g.id})), true);
  }, [autoLink, state.invoiceAutoLink]);

  function openLine(u){
    setCard({row:{name:u.rawName, rawName:u.rawName, orderCode:u.orderCode, new:u.perUnitPrice, unit:u.useUnit, old:null},
             entry:{supplier:u.supplier, invoiceNo:u.invoiceNo, date:u.date}});
  }

  /* Link one or many supplier lines in a single state write: alias saved (so the 09:04 run
     reuses it), line removed from the queue, price applied, one audit row in the run log. */
  function doLink(items, silent){
    const done=[], same=[], fail=[];
    update(s=>{
      s.invoiceAliases=s.invoiceAliases||{};
      const upd=[], flg=[];
      items.forEach(it=>{
        const k=aivKey(it.u.supplier, it.u.orderCode, it.u.rawName);
        s.invoiceAliases[k]=it.gId;
        s.invoiceUnmatched=(s.invoiceUnmatched||[]).filter(x=>aivKey(x.supplier, x.orderCode, x.rawName)!==k);
        const res=aivApply(s, it.u, it.gId, "AI Invoice (linked in app) "+(it.u.supplier||"")+(it.u.invoiceNo?" "+it.u.invoiceNo:""));
        if(res.ok){
          /* basis/qty/pack make the row self-describing - see aivApply. rawName + supplier are
             what the alias key is rebuilt from when this row is reopened. */
          upd.push({id:it.gId, name:res.name, old:res.perOld, new:res.perNew, unit:res.unit,
                    orderCode:it.u.orderCode||"", rawName:it.u.rawName||"", supplier:it.u.supplier||"",
                    basis:"unit", qty:res.qty, pack:res.next});
          done.push(it.u.rawName+" → "+res.name+"  "+money(res.old)+" → "+money(res.next));
        } else if(res.why==="same price"){
          // The link is the point; the ingredient simply already carries this price. Not a
          // failure, and putting it in `flagged` filled the review queue with non-problems.
          same.push(it.u.rawName+" → "+res.name);
        } else {
          flg.push("\""+it.u.rawName+"\" is now linked to "+(res.name||"?")+" but the price was not applied ("+res.why+") — set it by hand.");
          fail.push(it.u.rawName+" → "+(res.name||"?")+"  ("+res.why+")");
        }
      });
      s.invoiceLog=s.invoiceLog||[];
      s.invoiceLog.unshift({ts:Date.now(), date:today(),
        supplier:(items.length===1? (items[0].u.supplier||"") : "Multiple"), invoiceNo:"",
        analysis:(silent?"Auto-linked (high confidence) — ":"Manual link by staff — ")+items.length+" supplier line"+(items.length>1?"s":"")+" mapped in the app. Future automatic runs use these mappings.",
        updated:upd, added:[], flagged:flg});
    });
    if(silent) return;
    setTimeout(()=>{
      alert("Linked "+items.length+" line"+(items.length>1?"s":"")+".\n\n"
        + (done.length? done.join("\n")+"\n" : "")
        + (same.length? "\nAlready at that price — linked, nothing to change:\n"+same.join("\n")+"\n" : "")
        + (fail.length? "\nPrice NOT applied — set these by hand:\n"+fail.join("\n")+"\n" : "")
        + "\nFuture automatic runs use these mappings.");
    },0);
  }
  function linkAll(){
    if(!autoLink.length) return;
    const txt=autoLink.map(x=>"• "+x.u.rawName+"  →  "+x.cands[0].g.name+"   ("+x.cands[0].sc+"/100)").join("\n");
    if(!confirm("Link these "+autoLink.length+" lines and apply their prices?\n\n"+txt+"\n\nEach one is also saved as a rule for future runs.")) return;
    doLink(autoLink.map(x=>({u:x.u, gId:x.cands[0].g.id})));
  }

  function markChecked(k){ update(s=>{ s.invoiceChecked=s.invoiceChecked||{}; s.invoiceChecked[k]=today(); }); }
  function revertPrice(a){
    if(!a.g){ alert("That ingredient is not in the app any more — nothing to revert."); return; }
    if(a.u.old==null){ alert("No previous price was recorded for this line, so there is nothing to go back to."); return; }
    if(!confirm("Put "+a.g.name+" back to "+money(a.u.old)+(a.u.unit?"/"+a.u.unit:"")+"?\n\nThe invoice price "+money(a.u.new)+" will be undone and the change logged.")) return;
    let res=null;
    update(s=>{
      res=aivApply(s, {perUnitPrice:a.u.old, useUnit:a.u.unit, supplier:a.r.supplier}, a.g.id,
        "Reverted — flagged by the invoice guard ("+(a.r.supplier||"?")+(a.r.invoiceNo?" "+a.r.invoiceNo:"")+")");
      s.invoiceChecked=s.invoiceChecked||{}; s.invoiceChecked[a.key]=today();
      s.invoiceLog=s.invoiceLog||[];
      s.invoiceLog.unshift({ts:Date.now(), date:today(), supplier:a.r.supplier||"", invoiceNo:a.r.invoiceNo||"",
        analysis:"Manual link by staff — price reverted on "+a.g.name+" after the guard flagged it.",
        updated:(res&&res.ok)? [{id:a.g.id, name:res.name, old:res.old, new:res.next, unit:res.unit, orderCode:a.u.orderCode||""}] : [],
        added:[], flagged:(res && !res.ok && res.why!=="same price")? ["Could not revert "+a.g.name+" ("+res.why+") — set it by hand."] : []});
    });
    setTimeout(()=>{
      alert(res&&res.ok? (a.g.name+" is back to "+money(res.next)+" per "+res.qty+" "+res.unit+".")
        : (res&&res.why==="same price")? (a.g.name+" is already at "+money(a.u.old)+(a.u.unit?"/"+a.u.unit:"")+" — nothing to undo. Marked as checked.")
        : ("Could not revert — "+((res&&res.why)||"?")+". Set the price by hand."));
    },0);
  }

  const queueN = unmatched.length + flagged.length + anomalies.length;
  const go = v => () => setView(v);

  return <div className="rv2">
    <RV2Style /><AivStyle />
    <div className="lbl"><span className="sh c"></span><span className="tag">AI invoice</span><span className="c2">prices updated automatically from supplier invoices every morning · fix what it couldn’t, and watch what it costs you</span></div>
    <div className="screen">
      <div className="bar">
        <span className="cnt" style={{fontWeight:700, color:"var(--ink)"}}>Last run {last? (last.date+" · "+(last.supplier||"?")) : "— none yet"}</span>
        <span style={{flex:1}}></span>
        <div className="seg" role="group" aria-label="Section">
          <button type="button" aria-pressed={view==="queue"} onClick={go("queue")}>To fix{queueN? " ("+queueN+")":""}</button>
          <button type="button" aria-pressed={view==="trend"} onClick={go("trend")}>Trends</button>
          <button type="button" aria-pressed={view==="log"} onClick={go("log")}>Log</button>
        </div>
        <span className="cnt">Window</span>
        <div className="seg" role="group" aria-label="Window">{[7,30,90].map(d=><button key={d} type="button" aria-pressed={days===d} onClick={()=>setDays(d)}>{d}d</button>)}</div>
      </div>

      <div className="sum aiv5">
        <div className="tap" onClick={go("log")}><div className="v">{changes.length}</div><div className="l">price updates · {days}d</div></div>
        <div className={"tap "+(basket&&basket.pct>=2?"hot":"")} onClick={go("trend")}>
          <div className="v">{basket? ((basket.pct>=0?"+":"−")+Math.abs(basket.pct).toFixed(1)+"%") : "—"}</div>
          <div className="l">input cost · {days}d</div>
        </div>
        <div className={"tap "+(big.length?"hot":"")} onClick={go("trend")}><div className="v">{big.length}</div><div className="l">moved ≥ 10%</div></div>
        <div className={"tap "+(unmatched.length?"bad":"")} onClick={go("queue")}><div className="v">{unmatched.length}</div><div className="l">needs linking</div></div>
        <div className={"tap "+(anomalies.length||flagged.length?"hot":"")} onClick={go("queue")}><div className="v">{anomalies.length+flagged.length}</div><div className="l">needs a check</div></div>
      </div>

      {view==="queue" && <React.Fragment>
        <div className="grp" style={{padding:"18px 14px 8px"}}>
          <span className="sh s" style={{marginRight:8}}></span>Needs linking <span className="n">{unmatched.length}</span>
          <label className="aiv-auto" title="Only lines scoring 70+ and at least 12 clear of the runner-up"><input type="checkbox" checked={state.invoiceAutoLink!==false} onChange={e=>update(s2=>{ s2.invoiceAutoLink=e.target.checked; })} />Link the sure ones automatically</label>{autoLink.length>0 && state.invoiceAutoLink===false && <button type="button" className="btn sm p" onClick={linkAll}>Link {autoLink.length} sure one{autoLink.length>1?"s":""}</button>}
        </div>
        <div className="aiv-note">Each line is scored against every ingredient in the app on name, supplier order code, unit and price. A line only links itself when it scores 70 or more AND is at least 12 clear of the next best guess; everything else waits here for you. Every automatic link is an ordinary row in the log — open it to see or change it — and a price that would move more than 20x is refused rather than written.</div>
        <div style={{overflowX:"auto"}}><table><tbody>
          {unmatched.length===0 && <tr><td colSpan={4} className="empty">Nothing waiting — every invoice line found its ingredient.</td></tr>}
          {suggestions.map((it,i)=><AivUnmatchedRow key={"u"+i} item={it} onOpen={openLine}
            onLink={(u,gid,nm)=>{ if(confirm("Link \""+u.rawName+"\" to \""+nm+"\" and apply "+money(u.perUnitPrice)+(u.useUnit?"/"+u.useUnit:"")+"?\n\nSaved as a rule for future runs.")) doLink([{u:u, gId:gid}]); }} />)}
        </tbody></table></div>

        <div className="grp" style={{padding:"18px 14px 8px"}}><span className="sh t" style={{marginRight:8}}></span>Needs a second look <span className="n">{anomalies.length+flagged.length}</span></div>
        <div className="aiv-note">Prices the robot already wrote that do not look right — a tenfold jump, a unit it could not convert, a one-cent promo line. The Audit tab cannot catch these: the number is there and well formed, it is just wrong.</div>
        <div style={{overflowX:"auto"}}><table><tbody>
          {anomalies.length===0 && flagged.length===0 && <tr><td colSpan={4} className="empty">Nothing suspicious in the last {days} days.</td></tr>}
          {anomalies.map((a,i)=><tr key={"a"+i}>
            <td style={{width:150}}><span className="badge warn">▲ check</span></td>
            <td>
              <span className="name">{a.u.name||"?"}</span>
              <span className="sub">{(a.r.supplier||"?")+(a.r.invoiceNo?" · "+a.r.invoiceNo:"")+" · "+(a.r.date||"")}</span>
              <span className="aiv-why">{a.reasons.join(" · ")}</span>
            </td>
            <td className="num">{a.u.old!=null? money(a.u.old):"–"} → <b>{money(a.u.new)}</b>{a.u.unit? <span className="sub" style={{display:"inline"}}>/{a.u.unit}</span>:null}</td>
            <td className="num" style={{whiteSpace:"nowrap"}}>
              <button type="button" className="btn sm" onClick={()=>setCard({row:a.u, entry:a.r})}>Open</button>{" "}
              {a.u.old!=null && a.g && <React.Fragment><button type="button" className="btn sm" onClick={()=>revertPrice(a)}>Undo</button>{" "}</React.Fragment>}
              <button type="button" className="link" onClick={()=>markChecked(a.key)}>Fine</button>
            </td>
          </tr>)}
          {flagged.map((x,i)=><tr key={"f"+i}>
            <td style={{width:150}}><span className="badge warn">▲ review</span></td>
            <td colSpan={3}><span className="name" style={{fontWeight:500}}>{x.f}</span><span className="sub">{x.r.supplier} · {x.r.date}</span></td>
          </tr>)}
        </tbody></table></div>
      </React.Fragment>}

      {view==="trend" && <React.Fragment>
        <div className="aiv-hero">
          <div>
            <div className={"big "+(basket? (basket.pct>=0?"up":"down") : "")}>{basket? ((basket.pct>=0?"+":"−")+Math.abs(basket.pct).toFixed(1)+"%") : "—"}</div>
          </div>
          <div className="cap">What one unit of each of the {basket? basket.n : 0} items that moved in the last {days} days costs now, against what it cost at the start of the window. Every item counts the same — the run log does not record how much of each you buy, so any weighting would be made up.{basket&&basket.skipped? <span> <b>{basket.skipped} item{basket.skipped>1?"s":""}</b> left out as a pack or unit error — see <button type="button" className="link" onClick={go("queue")}>needs a second look</button>.</span> : null}</div>
        </div>
        <div className="grp" style={{padding:"14px 14px 4px"}}>Month by month <span className="n">input cost</span></div>
        {months.filter(m=>m.n).length>=2
          ? <AivMonths rows={months} />
          : <div className="empty">Not enough history yet — this fills in as the morning runs pile up.</div>}
        <div className="aiv-note">Each bar is that calendar month on its own: how far the items invoiced that month moved, up (red) or down (green).</div>

        <div className="grp" style={{padding:"18px 14px 4px"}}>Biggest movers · {days}d <span className="n">{movers.length}</span></div>
        <AivMovers rows={movers.slice(0,12)} onPick={m=>setCard({row:{id:m.row.id, name:m.name, orderCode:m.row.code, old:m.from, new:m.row.price, unit:m.row.unit}, entry:{supplier:m.row.supplier, invoiceNo:m.row.invoiceNo, date:m.row.date}})} />

        <div className="grp" style={{padding:"18px 14px 8px"}}><span className="sh c" style={{marginRight:8}}></span>Cheaper somewhere else <span className="n">{cheaper.length}</span></div>
        <div className="aiv-note">Items two or more suppliers have invoiced. The gap is per unit: the run log does not carry how many you bought, so a monthly dollar figure would be invented — it shows one only where a quantity was actually logged.</div>
        <div style={{overflowX:"auto"}}><table>
          <thead><tr><th>Ingredient</th><th>Buying from now</th><th>Cheapest seen</th><th className="num">Gap</th><th className="num">Saving</th></tr></thead>
          <tbody>
            {cheaper.length===0 && <tr><td colSpan={5} className="empty">No item has been invoiced by two different suppliers yet.</td></tr>}
            {cheaper.slice(0,40).map((c,i)=><tr key={i} className="row" style={{animationDelay:(Math.min(i,12)*0.03)+"s"}}
              onClick={()=>setCard({row:{id:c.row.id, name:c.name, orderCode:c.row.code, old:null, new:c.row.price, unit:c.row.unit}, entry:{supplier:c.row.supplier, invoiceNo:c.row.invoiceNo, date:c.row.date}})}>
              <td><span className="name">{c.name}</span>{c.gapDays>45? <span className="sub">prices {c.gapDays} days apart — may not be comparable</span>:null}</td>
              <td>{c.cur.supplier||"?"}<span className="sub">{money(c.cur.price)}{c.unit?"/"+c.unit:""} · {c.cur.date}</span></td>
              <td>{c.best.supplier||"?"}<span className="sub">{money(c.best.price)}{c.unit?"/"+c.unit:""} · {c.best.date}</span></td>
              <td className="num down">−{c.gapPct.toFixed(0)}%</td>
              <td className="num">{money(c.save)}<span className="sub" style={{display:"inline"}}>/{c.unit||"unit"}</span>{c.vol>0? <span className="sub">≈ {money(c.save*c.vol)} per {days}d</span>:null}</td>
            </tr>)}
          </tbody>
        </table></div>
      </React.Fragment>}

      {view==="log" && <React.Fragment>
        <div className="grp" style={{padding:"18px 14px 8px"}}>Price changes · {days}d <span className="n">{changes.length}</span></div>
        <div style={{overflowX:"auto"}}><table>
          <thead><tr><th>Ingredient</th><th>Trend</th><th>Supplier</th><th className="num">Was</th><th className="num">Now</th><th className="num">Change</th><th>Date</th></tr></thead>
          <tbody>
            {changes.length===0 && <tr><td colSpan={7} className="empty">No price updates in the last {days} days.</td></tr>}
            {changes.slice(0,200).map((c,i)=>{
              const k=c.u.id||("n:"+(c.u.name||""));
              return <tr key={i} className="row" style={{animationDelay:(Math.min(i,12)*0.03)+"s"}} onClick={()=>setCard({row:c.u, entry:c.r})}>
                <td><span className="name">{c.u.name}</span></td>
                <td><AivSpark pts={(series[k]||[]).map(r=>r.price)} /></td>
                <td>{c.r.supplier||"?"}{c.r.invoiceNo? <span className="sub" style={{display:"inline"}}> · {c.r.invoiceNo}</span>:null}</td>
                <td className="num">{c.u.old!=null? money(c.u.old):"–"}</td>
                <td className="num" style={{fontWeight:700}}>{money(c.u.new)}<span className="sub" style={{display:"inline"}}>{c.u.unit?("/"+c.u.unit):""}</span></td>
                <td className={"num "+(c.pct==null?"":c.pct>0?"up":"down")}>{c.pct==null? "new" : ((c.pct>0?"↑ ":"↓ ")+Math.abs(c.pct).toFixed(0)+"%")}</td>
                <td>{c.r.date}</td>
              </tr>;
            })}
          </tbody>
        </table></div>

        <div className="grp" style={{padding:"18px 14px 8px"}}>Run log <span className="n">{log.length}</span></div>
        <div style={{overflowX:"auto"}}><table>
          <thead><tr><th>Date</th><th>Supplier · invoice</th><th className="num">Updated</th><th className="num">New</th><th className="num">Review</th><th></th></tr></thead>
          <tbody>
            {log.length===0 && <tr><td colSpan={6} className="empty">No runs logged yet. Automatic runs appear here by date.</td></tr>}
            {log.slice(0,120).map((r,i)=><React.Fragment key={i}>
              <tr className={"row"+(open===i?" open":"")} onClick={()=>setOpen(open===i?null:i)}>
                <td><span className="name">{r.date}</span></td>
                <td>{r.supplier||"?"}{r.invoiceNo? <span className="sub" style={{display:"inline"}}> · {r.invoiceNo}</span>:null}</td>
                <td className="num">{(r.updated||[]).length}</td>
                <td className="num">{(r.added||[]).length||"—"}</td>
                <td className="num">{(r.flagged||[]).length? <span className="badge warn">{(r.flagged||[]).length}</span>:"—"}</td>
                <td className="num"><span className="link">{open===i?"close":"details ›"}</span></td>
              </tr>
              {open===i && <tr className="exp"><td colSpan={6}>
                {r.analysis && <div className="impact calm" style={{marginTop:0}}><b>Price trends</b> — {r.analysis}</div>}
                {(r.added||[]).length>0 && <div style={{marginTop:12}}><div className="lab">New ingredients ({r.added.length})</div><div className="chips" style={{border:0, padding:0}}>{r.added.map((a,j)=><span key={j} className="chip">{a}</span>)}</div></div>}
                {(r.flagged||[]).length>0 && <div style={{marginTop:12}}><div className="lab">Needs review</div>{r.flagged.map((f,j)=><div key={j} style={{padding:"4px 0"}}><span className="sh t" style={{marginRight:8}}></span>{f}</div>)}</div>}
                {(r.updated||[]).length>0 && <div style={{marginTop:12}}><div className="lab">Price updates ({r.updated.length})</div><table className="mini"><tbody>{r.updated.map((u,j)=><tr key={j} className="row" onClick={()=>setCard({row:aivRowFromLog(u,r), entry:r})}><td>{u.name}</td><td>{<AivSpark pts={(series[u.id||("n:"+(u.name||""))]||[]).map(x=>x.price)} w={70} h={22} />}</td><td className="num">{u.old!=null? money(u.old):"–"} → <b>{money(u.new)}</b>{u.unit?"/"+u.unit:""}</td></tr>)}</tbody></table></div>}
              </td></tr>}
            </React.Fragment>)}
          </tbody>
        </table></div>
      </React.Fragment>}
    </div>
    {card && <InvoiceItemCard row={card.row} entry={card.entry} state={state} update={update} onClose={()=>setCard(null)} />}
  </div>;
}
/* AIV3-END */

function SettingsV2({state, update, setTab, openBranches, openSync, fbRef, isMgr, meEmail, ingMap, onReset}){
  const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  const [sec,setSec]=useState("notices"); const [pick,setPick]=useState(null); const [catDept,setCatDept]=useState(null);
  const localYmd=()=>new Date().toLocaleDateString("en-CA");
  const notices=Array.isArray(state.notices)?state.notices:[]; const autoNotices=meetingNotices(state);
  const routine=state.dailyRoutine||{}; const docs=state.infoDocs||[]; const sheets=state.cateringSheets||[];
  const [viewSheet,setViewSheet]=useState(null);
  /* which sidebar groups are folded, remembered per device */
  const [navShut,setNavShut]=useState(()=>{ try{ return JSON.parse(localStorage.getItem("hideout_setnav_shut")||"[]")||[]; }catch(e){ return []; } });
  const toggleNav=g=>setNavShut(v=>{ const nx = v.indexOf(g)>=0 ? v.filter(x=>x!==g) : v.concat(g);
    try{ localStorage.setItem("hideout_setnav_shut", JSON.stringify(nx)); }catch(e){}
    return nx; });
  const auditCount=useMemo(()=>{ try{ const g=auditData(state, ingMap||{}); return Object.keys(g).reduce((n,k)=>n+g[k].length,0); }catch(e){ return 0; } }, [state, ingMap]);
  const setNoticeField=(id,k,v)=>update(s=>{ const n=(s.notices||[]).find(x=>x.id===id); if(n) n[k]=v; });
  const addNotice=()=>{ const id=rid("nt"); update(s=>{ if(!Array.isArray(s.notices)) s.notices=[]; s.notices.unshift({id, title:"", body:"", from:localYmd(), until:"", pin:false, tone:"info", branch:"", archived:false}); }); setPick(id); };
  const removeNotice=id=>{ if(!confirm("Remove this notice?")) return; update(s=>{ s.notices=(s.notices||[]).filter(x=>x.id!==id); }); setPick(null); };
  const setDocField=(key,k,v)=>update(s=>{ const d=(s.infoDocs||[]).find(x=>x.key===key); if(d) d[k]=v; });
  const addDoc=()=>{ const key="doc"+Date.now(); update(s=>{ if(!Array.isArray(s.infoDocs)) s.infoDocs=[]; s.infoDocs.push({key, title:"New document", text:""}); }); setPick(key); };
  const removeDoc=key=>{ if(!confirm("Remove this document?")) return; update(s=>{ s.infoDocs=(s.infoDocs||[]).filter(x=>x.key!==key); }); setPick(null); };
  const removeSheet=i=>{ if(!confirm("Remove this catering sheet?")) return; const s0=sheets[i]; const docId=s0&&(s0.sheetDoc||(s0.id?"sheet_"+s0.id:"")); if(docId){ try{ const fb=fbRef&&fbRef.current; if(fb&&fb.db) fb.db.collection("hideout_app").doc(docId).delete().catch(()=>{}); }catch(e){} } try{ ((s0&&s0.pages)||[]).forEach(p=>{ if(p&&p.publicId) cloudinaryRelay("destroy",{publicId:p.publicId}).catch(()=>{}); }); }catch(e){} update(s=>{ s.cateringSheets.splice(i,1); }); };
  const activeNotices=notices.filter(n=>!n.archived && (!n.until || n.until>=localYmd())).length;
  const NAV=[["Content",[["notices","Staff notices",activeNotices],["routines","Weekday routines",0],["docs","Reference documents",0],["sheets","Catering sheets",sheets.length]]],["Stores & menu",[["cats","Menu categories",0],["branches","Branches & passcodes",0]]],["People & system",[["team","Team access",0],["audit","Audit",auditCount],["integrations","Integrations",0]]],["Advanced",[["archive","Archive",0],["tools","One-off tools",0],["danger","Danger zone",0]]]];
  const curNotice=notices.find(n=>n.id===pick)||notices[0]; const curDoc=docs.find(d=>d.key===pick)||docs[0]; const curDay=DAYS.includes(pick)?pick:DAYS[(new Date().getDay()+6)%7];
  return <div className="rv2">
    <RV2Style />
    <div className="lbl"><span className="sh c"></span><span className="tag">Settings</span><span className="c2">what the team sees on Today · stores · people · tools</span></div>
    <div className="screen navcol">
      {/* Foldable groups. The heading is the control; the group you are currently inside always
          stays open so a fold can never hide the page you are on. */}
      <div className="nav">{NAV.map(([g,items])=>{
        const holdsCurrent = items.some(it=>it[0]===sec);
        const shut = !holdsCurrent && navShut.indexOf(g)>=0;
        const pending = items.reduce((t,it)=>t+(Number(it[2])||0),0);
        return <div key={g} className={"ng"+(shut?" shut":"")}>
          <button type="button" className="g" aria-expanded={!shut} onClick={()=>toggleNav(g)}>
            <span className="gcar" aria-hidden="true">{shut?"\u203a":"\u2304"}</span>
            <span className="gt">{g}</span>
            {shut && pending>0 && <span className="cnt2">{pending}</span>}
          </button>
          {!shut && items.map(([k,l,n])=><button key={k} type="button" aria-current={sec===k}
            onClick={()=>{ setSec(k); setPick(null); }}><span>{l}</span>{n>0&&<span className="cnt2">{n}</span>}</button>)}
        </div>;
      })}</div>
      <div className="pane" key={sec}>
        {sec==="notices" && <>
          <h2>Staff notices</h2><p className="desc">Shows on the Today board — the title on the board, the body when they tap it. Leave <b>Until</b> blank to keep it up until you remove it.</p>
          <div className="lp">
            <div className="list">
              <button type="button" onClick={addNotice} style={{background:"var(--ink)", color:"#f3f1ec"}}>+ Post a notice</button>
              {notices.map(n=><button key={n.id} type="button" aria-current={curNotice&&curNotice.id===n.id} onClick={()=>setPick(n.id)}>{n.tone==="urgent"&&<span className="sh t" style={{marginRight:8}}></span>}{n.pin&&"★ "}{n.title||<span className="sub" style={{display:"inline"}}>Untitled</span>}<small>{n.from||""}{n.until?(" → "+n.until):" → open"}{n.branch?(" · "+n.branch):" · all stores"}</small></button>)}
              {autoNotices.map(n=><button key={n.id} type="button" disabled style={{opacity:.7, cursor:"default"}}><span className="sh c" style={{marginRight:8}}></span>{n.title}<small>auto from the team meeting · {n.branch||"all stores"} · read-only</small></button>)}

            </div>
            <div className="edit">{curNotice ? <>

              <div className="lab">Message</div><div className="ned-wrap"><NoteEditor value={curNotice.body||""} onChange={v=>setNoticeField(curNotice.id,"body",v)} minHeight="min(52vh,460px)" placeholder="Write the notice. Leave it blank for a title-only notice." /></div>

                  <input type="date" value={curNotice.until||""} onChange={e=>setNoticeField(curNotice.id,"until",e.target.value)} /></label>
                <label className="nf"><span className="nfl">Store</span>

                    <option value="">All stores</option>{(state.branches||[]).map(b=><option key={b.id} value={b.name}>{b.name}</option>)}</select></label>
                <div className="nf nflags"><span className="nfl">Flags</span>
                  <div className="nfrow">
                    <label className="nchk"><input type="checkbox" checked={!!curNotice.pin} onChange={e=>setNoticeField(curNotice.id,"pin",e.target.checked)} />Pin to top</label>
                    <label className="nchk"><input type="checkbox" checked={curNotice.tone==="urgent"} onChange={e=>setNoticeField(curNotice.id,"tone",e.target.checked?"urgent":"info")} />Urgent</label>
                  </div></div>
                <div className="nf nfend">
                  <button type="button" className="nrm" onClick={()=>removeNotice(curNotice.id)}>Remove notice</button>
                  <span className="nsave">saves as you type</span>
                </div>
              </div>
            </> : <div className="empty">Pick a notice on the left, or post a new one.</div>}</div>
          </div>
          <label style={{display:"flex", alignItems:"center", gap:10, marginTop:16, fontWeight:600}}><input type="checkbox" checked={state.noticeFromMeetings!==false} onChange={e=>update(s=>{ s.noticeFromMeetings=e.target.checked; })} style={{width:20, height:20, accentColor:"var(--ink)"}} />Put the last team meeting on the board automatically <span className="sub" style={{display:"inline"}}>· one notice per store, edited in Team Meeting</span></label>
        </>}
        {sec==="routines" && <>
          <h2>Weekday routines</h2><p className="desc">The routine shown on Today for each day. Simple markdown — # heading, - bullet, ☐ checkbox, **bold**, ``` fixed block.</p>
          <div className="lp"><div className="list">{DAYS.map(d=><button key={d} type="button" aria-current={curDay===d} onClick={()=>setPick(d)}>{d}<small>{(routine[d]||"").trim()?((routine[d]||"").trim().split("\n").length+" lines"):"empty"}</small></button>)}</div>
            <div className="edit"><div className="lab">{curDay}</div><NoteEditor value={routine[curDay]||""} onChange={v=>update(s=>{ if(!s.dailyRoutine) s.dailyRoutine={}; s.dailyRoutine[curDay]=v; })} minHeight="52vh" placeholder={"# Opening\n☐ Turn on ovens\n- Check the bain-marie"} /></div></div>
        </>}
        {sec==="docs" && <>
          <h2>Reference documents</h2><p className="desc">The chips at the bottom of Today — veg ordering, schedules, checklists.</p>
          <div className="lp"><div className="list"><button type="button" onClick={addDoc} style={{background:"var(--ink)", color:"#f3f1ec"}}>+ Add document</button>{docs.map(d=><button key={d.key} type="button" aria-current={curDoc&&curDoc.key===d.key} onClick={()=>setPick(d.key)}>{d.title||"Untitled"}<small>{(d.text||"").trim().length} chars</small></button>)}{docs.length===0&&<div className="empty">No documents yet.</div>}</div>
            <div className="edit">{curDoc ? <><div className="lab">Title</div><input className="inp" style={{width:"100%", marginBottom:12}} value={curDoc.title} onChange={e=>setDocField(curDoc.key,"title",e.target.value)} /><div className="lab">Content</div><NoteEditor value={curDoc.text} onChange={v=>setDocField(curDoc.key,"text",v)} minHeight="44vh" /><div style={{marginTop:14}}><button type="button" className="btn" style={{borderColor:"var(--rt)", color:"var(--rt)"}} onClick={()=>removeDoc(curDoc.key)}>Remove document</button></div></> : <div className="empty">Pick a document on the left.</div>}</div></div>
        </>}
        {sec==="sheets" && <>

          </tbody></table>
          <div style={{marginTop:18, borderTop:"3px solid var(--ink)", paddingTop:14}}><div className="lab">Upload a sheet made elsewhere (PDF → page images)</div><CateringSheetUpload state={state} update={update} /></div>
        </>}
        {/* Four buttons, each hiding its categories behind a popup, meant you could not see how the

            the popup is still there for reordering and renaming. */}
        {sec==="cats" && <><h2>Menu categories</h2><p className="desc">How the Dishes menu is grouped — one set per department. Counts are live dishes in each group.</p>
          <div className="catmap">
            {[["kitchen","Kitchen"],["bakery","Bakery"],["barista","Barista"],["catering","Catering"]].map(([k,l])=>{
              const list=((state.dishCats||{})[k])||[];

        {sec==="branches" && <><h2>Branches & passcodes</h2><p className="desc">Add, rename or remove branches and set each branch’s numeric passcode. Today, Dishes and Prep are tracked per branch.</p><button type="button" className="btn p" onClick={openBranches}>Manage branches</button></>}

        {sec==="integrations" && <><h2>Integrations</h2><p className="desc">Cloud sync keeps every device on the same data; the calendar is connected from the Today page.</p><div className="chips" style={{border:0, padding:0}}><button type="button" className="btn" onClick={openSync}>Cloud sync settings</button><button type="button" className="btn" onClick={()=>setTab("daily")}>Calendar → Today</button></div></>}
        {sec==="archive" && <><h2>Archive</h2><p className="desc">Seasonal or discontinued items — excluded from lists and costs, restorable any time.</p><Archive state={state} update={update} ingMap={ingMap} /></>}

}

function Ingredients({state, update, setState}){

  function commit(ing){ update(s=>{ if(ing.id){ const idx=s.ingredients.findIndex(i=>i.id===ing.id); s.ingredients[idx]=ing; } else { ing.id=rid("ing"); ing.costHistory=[{date:today(), price:Number(ing.purchasePrice)}]; s.ingredients.push(ing); } }); setEdit(null); }

            const idx = n.ingredients.findIndex(x=> (m.extId && x.extId===m.extId) || x.name.toLowerCase()===m.name.toLowerCase());
            if(idx>=0){ const old=n.ingredients[idx]; m.id=old.id; m.archived=old.archived; if(old.purchasePrice!==m.purchasePrice){ m.costHistory=[...(old.costHistory||[]), {date:today(), price:m.purchasePrice}]; } else { m.costHistory=old.costHistory||m.costHistory; } n.ingredients[idx]=m; }
            else n.ingredients.push(m);

        }
        return n;

  }
  function exportXlsx(){ downloadSheet(state.ingredients.map(ingredientToRow), "Ingredients", `ingredients-${today()}.xlsx`); }
  const toggle=id=>setSel(p=>{ const n=new Set(p); if(n.has(id)) n.delete(id); else n.add(id); return n; });
  const selectItems=items=>setSel(p=>{ const n=new Set(p); const allIn=items.every(i=>n.has(i.id)); items.forEach(i=>{ if(allIn) n.delete(i.id); else n.add(i.id); }); return n; });
  function bulk(mode){

    let reason=null;

    setTimeout(()=>{
      update(s=>{ if(mode==="archive"){ ids.forEach(id=>{ const t=s.ingredients.find(i=>i.id===id); if(t){ t.archived=true; t.archiveReason=reason||"Archived"; t.archivedAt=today(); } }); } else { s.ingredients=s.ingredients.filter(i=>!ids.includes(i.id)); } });

  return <div>

        <div className="text-sm text-stone-500 whitespace-nowrap">{list.length} / {activeAll.length}</div>
      </div>
      <div className="flex gap-2"><ImportExport onImport={importXlsx} onExport={exportXlsx} /><Btn onClick={()=>setEdit({...blank})}>+ Add Ingredient</Btn></div>
    </div>
    <div className="space-y-7">
      {[...new Set(list.map(i=>i.category||"Other"))].sort().map(cat=>{ const items=list.filter(i=>(i.category||"Other")===cat);
        return <div key={cat}>
          <div className="flex items-baseline gap-2.5 mb-2.5">
            <div className="text-[16px] font-semibold text-stone-800" style={{fontFamily:"var(--font-display)"}}>{cat}</div>

            {items.map(ing=>{ const on=sel.has(ing.id); const pref=(ing.suppliers||[]).find(s=>s.preferred)||(ing.suppliers||[])[0];
              return <div key={ing.id} onClick={()=>setEdit(JSON.parse(JSON.stringify(ing)))} className={"card p-3 cursor-pointer vbtn-card relative "+(leaving.has(ing.id)?"leave":"")} style={{border: on ? "1.5px solid var(--color-primary)" : undefined}}>
                <button onClick={e=>{e.stopPropagation(); toggle(ing.id);}} title={on?"Deselect":"Select"} className="absolute top-2 right-2 w-6 h-6 rounded-full flex items-center justify-center text-[11px]" style={{border:"1.5px solid "+(on?"var(--color-primary)":"var(--color-hairline)"), background:on?"var(--color-primary)":"#fff", color:"#fff", cursor:"pointer", transition:"background .15s, border-color .15s"}}>{on?"✓":""}</button>
                <div className="font-medium text-stone-800 truncate pr-7">{ing.name}{(!ing.allergens||!ing.allergens.length)&&<span title="No allergen info" className="ml-1 text-amber-600">⚠</span>}</div>
