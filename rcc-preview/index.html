        <span className="text-sm font-semibold whitespace-nowrap">{sel.size} selected</span>
        <button onClick={()=>bulk("archive")} className="vbtn-card text-sm rounded-full px-4 py-1.5" style={{background:"var(--color-primary)", color:"#fff", border:"none", cursor:"pointer"}}>Archive</button>
        <button onClick={()=>bulk("delete")} className="vbtn-card text-sm rounded-full px-4 py-1.5" style={{background:"rgba(255,255,255,.12)", color:"#ff9c94", border:"none", cursor:"pointer"}}>Delete</button>
        <button onClick={()=>setSel(new Set())} className="text-sm px-2" style={{background:"none", border:"none", color:"rgba(255,255,255,.6)", cursor:"pointer"}}>Clear</button>
      </div>
    </div>}
    {edit && <IngredientEditor ing={edit} onClose={()=>setEdit(null)} onSave={commit} onDelete={id=>{update(s=>{s.ingredients=s.ingredients.filter(i=>i.id!==id);}); setEdit(null);}} />}
  </div>;
}
function IngredientEditor({ing, onClose, onSave, onDelete, panel, onDraft}){
  const PU_LIST=["kg","g","L","ml","each"];
  const canon=(u)=>{ const t=String(u||"").trim().toLowerCase().replace(/s$/,""); if(t==="kg")return "kg"; if(t==="g"||t==="gram")return "g"; if(t==="l"||t==="lt"||t==="litre"||t==="liter")return "L"; if(t==="ml")return "ml"; if(t==="each"||t==="ea"||t==="pc"||t==="piece"||t==="unit")return "each"; return null; };
  const parsePU=(v)=>{ const t=String(v||"").trim(); let m=t.match(/^([\d.]+)\s*([A-Za-z]+)$/); if(m){ const u=canon(m[2]); if(u) return {size:Number(m[1]), unit:u}; } const u2=canon(t); return {size:null, unit:u2}; };
  const conv=(n,from,to)=>{ const a=canon(from), b=canon(to); if(!a||!b) return null; if(a===b) return n; for(const tbl of [U_MASS,U_VOL]){ const x=tbl[a.toLowerCase()], y=tbl[b.toLowerCase()]; if(x!=null&&y!=null) return n*x/y; } return null; };
  // A2: keep a legacy/non-metric unit as-is instead of silently coercing it to "g"
  const keepU=(u,fb)=>{ const c=canon(u); if(c) return c; const t=String(u||"").trim(); return t||fb; };
  const seed=(()=>{ const uu=keepU(ing.useUnit,"g"); const pp=parsePU(ing.purchaseUnit); const pu=pp.unit||keepU(ing.purchaseUnit,uu);
    const q=Number(ing.purchaseQty)||0; let size=pp.size;
    if(size==null){ const back=q>0?conv(q, uu, pu):null; size = (back!=null&&back>0)?back:(q>0?q:""); }
    const qty=(Number(size)>0)?conv(size, pu, uu):null;
    // A1/A3: never invent a pack size, never overwrite a stored qty we can't convert
    return {packSize:(Number(size)>0?+Number(size).toFixed(6):""), purchaseUnit:pu, useUnit:uu,
            purchaseQty:(qty!=null&&qty>0)?+Number(qty).toFixed(6):q}; })();
  const [f,setF]=useState({...ing, ...seed}); const set=(k,v)=>{ setTouched(true); setF(p=>({...p,[k]:v})); };
  const [touched,setTouched]=useState(false);
  const unitOpts=[...new Set([...PU_LIST, canon(ing.useUnit)?null:String(ing.useUnit||"").trim(), canon(ing.purchaseUnit)?null:String(ing.purchaseUnit||"").trim()].filter(Boolean))];
  const packToUse=(n,P,U,gpe)=>{ if(!(n>0)) return null; const c=conv(n,P,U); if(c!=null&&c>0) return c;
    const a=canon(P), b=canon(U), g=Number(gpe)||0;
    if(g>0){ if(U_MASS[String(a).toLowerCase()]!=null && b==="each") return conv(n,P,"g")/g; if(a==="each" && U_MASS[String(b).toLowerCase()]!=null) return conv(n*g,"g",U); }
    return null; };
  const setPack=(size,pu,uu)=>{ setTouched(true); const n=Number(size); const P=unitOpts.includes(pu)?pu:"kg", U=unitOpts.includes(uu)?uu:"g";
    setF(p=>{ const c=packToUse(n,P,U,p.gramsPerEach);
      return {...p, packSize:(size===""?"":n), purchaseUnit:P, useUnit:U, purchaseQty:(c!=null&&c>0)?+Number(c).toFixed(6):(Number(p.purchaseQty)>0?p.purchaseQty:0)}; }); };
  // A4: if the user never touched the pack/unit fields, don't rewrite the stored unit model on Save
  const commitOut=()=>{ if(touched) return f; const {packSize,...rest}=f; return {...rest, purchaseUnit:ing.purchaseUnit, useUnit:ing.useUnit, purchaseQty:ing.purchaseQty}; };
  /* v2 Ingredients tab renders this same form inside its right-hand panel (`panel`) and watches the
     draft (`onDraft`) to preview which recipes a price/pack change will hit before Save. */
  useEffect(()=>{ if(onDraft) onDraft(commitOut()); }, [f]);
  // stable component types (module-level) - an inline wrapper would remount the form on every keystroke
  const Wrap = panel ? RV2FormWrap : IngModalWrap;
  return <Wrap onClose={onClose} title={f.id?"Edit Ingredient":"Add Ingredient"}>
    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <Field label="Name"><input className="inp" value={f.name} onChange={e=>set("name",e.target.value)} /></Field>
      <Field label="Category"><input className="inp" value={f.category} onChange={e=>set("category",e.target.value)} /></Field>
      <Field label="Purchase pack — how it's bought">
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <input type="number" inputMode="decimal" className="inp" style={{flex:"1 1 90px"}} value={f.packSize!=null?f.packSize:""} placeholder="e.g. 1" onChange={e=>setPack(e.target.value, f.purchaseUnit, f.useUnit)} />
          <select className="inp" style={{width:96}} value={unitOpts.includes(f.purchaseUnit)?f.purchaseUnit:"kg"} onChange={e=>setPack(f.packSize, e.target.value, f.useUnit)}>{unitOpts.map(u=><option key={u} value={u}>{u}</option>)}</select>
        </div>
      </Field>
      <Field label="Use unit — how recipes measure it">
        <select className="inp" value={unitOpts.includes(f.useUnit)?f.useUnit:"g"} onChange={e=>setPack(f.packSize, f.purchaseUnit, e.target.value)}>{unitOpts.map(u=><option key={u} value={u}>{u}</option>)}</select>
      </Field>
      <Field label="Purchase price ($) — price for one pack above"><input type="number" inputMode="decimal" className="inp" value={f.purchasePrice} onChange={e=>set("purchasePrice",Number(e.target.value))} /></Field>
      <Field label="Allergens"><AllergenPicker value={f.allergens||[]} onChange={v=>set("allergens",v)} /></Field>
      {(EACH_U.has(normU(f.useUnit))||EACH_U.has(normU(f.purchaseUnit))||Number(f.gramsPerEach)>0) && <Field label="Grams per each (weight-priced pieces, e.g. 1 avocado = 200)"><input type="number" className="inp" value={f.gramsPerEach||0} onChange={e=>{ const g=Number(e.target.value); setTouched(true); setF(p=>{ const c=packToUse(Number(p.packSize),p.purchaseUnit,p.useUnit,g); return {...p, gramsPerEach:g, purchaseQty:(c!=null&&c>0)?+Number(c).toFixed(6):p.purchaseQty}; }); }} /></Field>}
      <Field label="Price trend"><CostTrend ing={f} /></Field>
      <Field label="Unit cost (calculated)"><div className="py-2 text-stone-700 font-medium">{money(unitCost(f))} / {f.useUnit||"?"}{(Number(f.packSize)>0&&Number(f.purchasePrice)>0)? <span className="text-stone-500 font-normal">{"  ·  "+money(Number(f.purchasePrice)/Number(f.packSize))+" / "+(f.purchaseUnit||"pack")}</span>:null}</div></Field>
    </div>
    <div className="mt-4"><div className="text-xs font-medium text-stone-500 mb-2">Suppliers</div>
      {(f.suppliers||[]).map((s,i)=>(<div key={i} className="flex gap-2 items-center mb-2">
        <input className="inp flex-1" placeholder="Supplier name" value={s.name} onChange={e=>{const sup=[...f.suppliers]; sup[i]={...s,name:e.target.value}; set("suppliers",sup);}} />
        <input className="inp w-28" type="number" placeholder="Price" value={s.price} onChange={e=>{const sup=[...f.suppliers]; sup[i]={...s,price:Number(e.target.value)}; set("suppliers",sup);}} />
        <label className="text-xs text-stone-500 flex items-center gap-1"><input type="checkbox" checked={!!s.preferred} onChange={e=>{const sup=f.suppliers.map((x,j)=>({...x,preferred:j===i?e.target.checked:false})); set("suppliers",sup);}} />preferred</label>
        <button onClick={()=>set("suppliers",f.suppliers.filter((_,j)=>j!==i))} className="text-red-400 text-xs">remove</button>
      </div>))}
      <button onClick={()=>set("suppliers",[...(f.suppliers||[]),{name:"",orderCode:"",brand:"",qty:1,price:f.purchasePrice,leadTime:0,preferred:false}])} className="text-xs text-stone-500 underline">+ Add supplier</button>
    </div>
    <div className="flex justify-between mt-5"><div>{f.id&&<Btn tone="danger" size="sm" onClick={()=>{if(confirm("Delete permanently?"))onDelete(f.id);}}>Delete</Btn>}</div>
      <div className="flex gap-2"><Btn tone="ghost" onClick={onClose}>Cancel</Btn><Btn onClick={()=>{ const o=commitOut(); if(!(Number(o.purchaseQty)>0)){ const a=canon(o.purchaseUnit), b=canon(o.useUnit); const cross=Number(o.packSize)>0 && a&&b&&a!==b && !(U_MASS[String(a).toLowerCase()]!=null&&U_MASS[String(b).toLowerCase()]!=null) && !(U_VOL[String(a).toLowerCase()]!=null&&U_VOL[String(b).toLowerCase()]!=null); alert(cross? ("\""+o.purchaseUnit+"\" and \""+o.useUnit+"\" can\u2019t be converted automatically. Enter \"Grams per each\" below, or set the use unit to g / ml.") : "Enter the Purchase pack size (and unit) before saving \u2014 otherwise this ingredient would cost $0."); return; } onSave(o); }}>Save</Btn></div></div>
  </Wrap>;
}

/* ---------------- Recipes ---------------- */
function Recipes({state, update, setState, ingMap}){
  const [edit,setEdit]=useState(null); const [view,setView]=useState(null); const [showRcc,setShowRcc]=useState(false); const [q,setQ]=useState(""); const [tf,setTf]=useState("All");
  const [sel,setSel]=useState({}); const [catFilter,setCatFilter]=useState([]); const [showFilter,setShowFilter]=useState(false); const [bulk,setBulk]=useState(null); const [finFilter,setFinFilter]=useState("all");
  const lpTimer=useRef(null), lpFired=useRef(false);
  const selIds=Object.keys(sel).filter(k=>sel[k]); const selMode=selIds.length>0;
  const toggleSel=id=>setSel(m=>({...m,[id]:!m[id]}));
  const [prepUnit,setPrepUnit]=useState("g");
  const U2G={g:1,kg:1000,ml:1,l:1000};
  // Prep yield = sum of ingredient weights (B). Falls back to the stored yield when no quantities are entered yet.
  function calcYieldG(r){ let t=0,any=false; (r.items||[]).forEach(it=>{ if(!(it.qty>0)) return; let u=""; if(it.ingredientId){ const ing=ingMap[it.ingredientId]; u=String((it.rawUnit||(ing?ing.useUnit:""))||"").trim().toLowerCase(); } else if(it.subRecipeId){ const sub=recMapGet()[it.subRecipeId]; u=String((it.rawUnit||(sub?sub.yieldUnit:""))||"").trim().toLowerCase(); } const f=U2G[u]; if(f){ t+=it.qty*f; any=true; } }); if(any) return t; const base=U2G[String(r.yieldUnit||"").trim().toLowerCase()]; return base&&r.yield>0? r.yield*base : 0; }
  function prepPer(r){ const bc=recipeCost(r,ingMap); const g=calcYieldG(r); if(!(g>0)||!(bc>0)) return null; return (bc/g)*(prepUnit==="kg"?1000:1); }
  function fmtPer(v){ return "$"+(v>=1? v.toFixed(2) : v>=0.1? v.toFixed(3) : v.toFixed(4)); }
  const blank={id:"", name:"", category:"", yield:1, yieldUnit:"cup", sellPrice:0, targetMargin:70, items:[], importedCost:0, ingredientListText:"", allergens:[], image:"", procedure:"", showInDish:true, archived:false};
  const activeAll = state.recipes.filter(r=>!r.archived);
  const isMenu = r => r.sellPrice>0 || r.showInDish;
  const list = activeAll.filter(r=>!q || r.name.toLowerCase().includes(q.toLowerCase()) || (r.category||"").toLowerCase().includes(q.toLowerCase())).filter(r=> tf==="All" ? true : (tf==="Menu" ? isMenu(r) : !isMenu(r))).filter(r=> !catFilter.length || catFilter.includes((r.category||"").trim()||"(none)")).filter(r=> finFilter==="all" ? true : (finFilter==="fin" ? !!r.finalised : !r.finalised));
  const allCats=[...new Set(activeAll.map(r=>(r.category||"").trim()||"(none)"))].sort((a,b)=>a.localeCompare(b));
  function bulkDelete(){ const refd=state.recipes.filter(r=>!sel[r.id]&&!r.archived&&(r.items||[]).some(it=>it.subRecipeId&&sel[it.subRecipeId])).map(r=>r.name); if(refd.length&&!confirm("Warning: "+refd.length+" other recipe(s) use a selected recipe as a prep/sub-recipe (\u25b8): "+refd.slice(0,8).join(", ")+(refd.length>8?"\u2026":"")+"\n\nDeleting will break those links. Continue?")) return; if(!confirm("Delete "+selIds.length+" recipe(s) permanently?\n\nOK = delete \u00b7 Cancel = keep")) return; update(s=>{ s.recipes=s.recipes.filter(r=>!sel[r.id]); }); setSel({}); }
  function applyBulk(){ update(s=>{ s.recipes.forEach(r=>{ if(!sel[r.id]) return; if(bulk.category.trim()) r.category=bulk.category.trim(); if(bulk.targetMargin!=="") r.targetMargin=Number(bulk.targetMargin)||r.targetMargin; if(bulk.showInDish!=="") r.showInDish=bulk.showInDish==="on"; if(bulk.showInPrep!=="") r.showInPrep=bulk.showInPrep==="on"; if(bulk.finalised) r.finalised=bulk.finalised==="on"; }); }); setBulk(null); setSel({}); }
  function commit(rec){ update(s=>{ if(rec.id){ const idx=s.recipes.findIndex(r=>r.id===rec.id); s.recipes[idx]=rec; } else { rec.id=rid("rec"); s.recipes.push(rec); } }); setEdit(null); }
  function createIngredient(d){ const ing=newIngredient(d); update(s=>{ s.ingredients.push(ing); }); return ing.id; }
  function importXlsx(file){
    readSheet(file, rows=>{
      const mapped=rows.map(rowToRecipe).filter(r=>r.name);
      if(!mapped.length){ alert("No readable recipe rows. Make sure the first sheet has a 'Name' column."); return; }
      const replace=confirm(`Read ${mapped.length} recipes.\n\nOK = replace all existing\nCancel = merge (update rows with same ID/name)`);
      setState(s=>{ const n=JSON.parse(JSON.stringify(s));
        const link = m=>{ if((!m.items||!m.items.length) && m.ingredientListText){ m.items = splitList(m.ingredientListText).map(nm=>{ const mt=matchIngredient(nm, n.ingredients); return {ingredientId: mt?mt.ing.id:"", qty:0, rawName:nm}; }); } return m; };
        if(replace){ n.recipes=mapped.map(link); }
        else { mapped.forEach(m=>{ const idx=n.recipes.findIndex(x=>(m.extId&&x.extId===m.extId)||x.name.toLowerCase()===m.name.toLowerCase()); if(idx>=0){ const old=n.recipes[idx]; m.id=old.id; m.archived=old.archived; if(old.items&&old.items.length&&itemsCost(old,Object.fromEntries(n.ingredients.map(i=>[i.id,i])))>0) m.items=old.items; else link(m); n.recipes[idx]=m; } else n.recipes.push(link(m)); }); }
        return n; });
      alert("Recipes imported: "+mapped.length+" (ingredients auto-linked; enter quantities in the app)");
    });
  }
  function exportXlsx(){ downloadSheet(state.recipes.map(r=>recipeToRow(r,ingMap)), "Recipes", `recipes-${today()}.xlsx`); }
  function importTrello(file){
    const reader=new FileReader();
    reader.onload=e=>{
      let j; try{ j=JSON.parse(e.target.result); }catch(err){ alert("Not a valid Trello JSON file."); return; }
      const lists={}; (j.lists||[]).forEach(l=>lists[l.id]=l.name);
      const cards=(j.cards||[]).filter(c=>!c.closed);
      const cleanProc=(d)=>{ if(!d) return ""; let t=d.replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/\u200c/g,""); return t.split(/\n/).map(x=>x.replace(/\s+$/,"")).filter(x=>x.trim()).join("\n").trim(); };
      let matched=0; const un=[];
      setState(s0=>{ const n=JSON.parse(JSON.stringify(s0));
        const allow=["brunch","bagel","wraps & salad","sandwich"];
        cards.forEach(c=>{ const proc=cleanProc(c.desc); if(!proc) return; const cat=lists[c.idList]||""; if(!allow.includes(cat.toLowerCase().trim())) return;
          const m=bestRecipeMatch(c.name, n.recipes);
          if(m){ m.procedure=proc; if((!m.category||!m.category.trim()) && cat && cat.toLowerCase()!=="archive") m.category=cat; m.showInDish=true; matched++; }
          else un.push(c.name);
        });
        return n; });
      alert("Trello import done.\nProcedures set on "+matched+" recipes (Show in Dishes ON).\nUnmatched cards: "+(un.length?un.join(", "):"none"));
    };
    reader.readAsText(file);
  }
  return <div>
    <div className="flex justify-between items-center mb-3 gap-3 flex-wrap">
      <div className="flex items-center gap-3"><VSearchInput placeholder="Search recipes…" value={q} onChange={e=>setQ(e.target.value)} list="sug-recs" style={{height:44, minWidth:0, flex:"1 1 200px", maxWidth:300}} /><Suggest id="sug-recs" options={activeAll.map(r=>r.name).concat(allCats)} /><div className="flex items-center gap-1.5">{["All","Menu","Prep"].map(k=><button key={k} onClick={()=>setTf(k)} className="vbtn-card text-sm rounded-full px-3.5" style={{height:34, border:"1px solid "+(tf===k?"var(--color-primary)":"var(--color-hairline-alpha)"), background:tf===k?"var(--color-primary)":"var(--color-canvas)", color:tf===k?"#fff":"var(--color-ink)", cursor:"pointer", fontWeight:tf===k?600:400}}>{k}</button>)}</div><div className="relative"><button onClick={()=>setShowFilter(v=>!v)} className="vbtn-card text-sm rounded-full px-3.5" style={{height:34, border: "1px solid "+((catFilter.length||finFilter!=="all")?"var(--color-primary)":"var(--color-hairline-alpha)"), background:"var(--color-canvas)", color:(catFilter.length||finFilter!=="all")?"var(--color-primary)":"var(--color-ink)", cursor:"pointer", fontWeight:(catFilter.length||finFilter!=="all")?600:400}}>Filter{(catFilter.length||finFilter!=="all")?" ("+(catFilter.length+(finFilter!=="all"?1:0))+")":""}</button>
      {showFilter&&<div className="absolute z-30 mt-1 p-3 rounded-[12px] w-60 max-h-72 overflow-auto" style={{background:"#fff", border:"1px solid var(--color-hairline-alpha)"}}>
        <div className="text-[11px] uppercase tracking-wide text-stone-400 mb-1">Status</div>
        {[["all","All"],["fin","Finalised ✓"],["unfin","Not finalised"]].map(([v,l])=><label key={v} className="flex items-center gap-2 text-sm py-1 cursor-pointer"><input type="radio" name="finfilter" checked={finFilter===v} onChange={()=>setFinFilter(v)} />{l}</label>)}
        <div className="text-[11px] uppercase tracking-wide text-stone-400 mb-1 mt-2">Category</div>
        {allCats.map(c=><label key={c} className="flex items-center gap-2 text-sm py-1 cursor-pointer"><input type="checkbox" checked={catFilter.includes(c)} onChange={()=>setCatFilter(f=>f.includes(c)?f.filter(x=>x!==c):[...f,c])} />{c}</label>)}
        <div className="flex justify-between mt-2"><button className="text-xs text-stone-500 underline" onClick={()=>setCatFilter([])}>Clear</button><button className="text-xs text-stone-500 underline" onClick={()=>setShowFilter(false)}>Close</button></div>
      </div>}</div><div className="flex items-center gap-1"><span className="text-[11px] text-stone-400">Prep $/</span>{["g","kg","ml"].map(u=><button key={u} onClick={()=>setPrepUnit(u)} className="vbtn-card text-xs rounded-full px-2.5" style={{height:28, border:"1px solid "+(prepUnit===u?"var(--color-primary)":"var(--color-hairline-alpha)"), background:prepUnit===u?"var(--color-primary)":"var(--color-canvas)", color:prepUnit===u?"#fff":"var(--color-ink)", cursor:"pointer"}}>{u}</button>)}</div><div className="text-sm text-stone-500">{list.length} / {activeAll.length}</div></div>
      <div className="flex gap-2"><Btn tone="ghost" size="sm" onClick={()=>{ if(!confirm("Collapse flattened prep-recipe ingredients into sub-recipe lines across all menu recipes?")) return; let c=0; setState(s=>{ const n=JSON.parse(JSON.stringify(s)); c=collapsePrepSubs(n); return n; }); setTimeout(()=>alert(c+" recipe(s) collapsed."),50); }}>Collapse preps</Btn><Btn tone="ghost" size="sm" onClick={()=>setShowRcc(true)}>RCC API</Btn><label className="px-2.5 py-1 text-xs rounded-lg border border-[color:var(--line)] text-stone-600 hover:bg-stone-100 cursor-pointer flex items-center">Trello JSON<input type="file" accept=".json,application/json" className="hidden" onChange={e=>{ if(e.target.files[0]){ importTrello(e.target.files[0]); e.target.value=""; } }} /></label><ImportExport onImport={importXlsx} onExport={exportXlsx} /><Btn onClick={()=>setEdit({...blank, items:[]})}>+ Add Recipe</Btn></div>
    </div>
    {(()=>{ const menuR=activeAll.filter(r=>r.sellPrice>0); const prepR=activeAll.filter(r=>!(r.sellPrice>0)); const belowR=menuR.filter(r=>marginOf(r,ingMap).margin<(r.targetMargin/100)); const ms=menuR.map(r=>marginOf(r,ingMap).margin); const avg=ms.length?ms.reduce((a,b)=>a+b,0)/ms.length:0;
      return <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 stagger">
        <Stat label="Menu recipes" value={menuR.length} />
        <Stat label="Prep recipes" value={prepR.length} />
        <Stat label="Below target" value={belowR.length} sub={belowR.length?"needs a look":"all healthy"} tone={belowR.length>0?"bad":undefined} />
        <Stat label="Avg margin" value={menuR.length?pct(avg):"–"} sub="across menu" />
      </div>; })()}
    {selMode&&<div className="flex items-center gap-2 mb-3 p-3 rounded-[12px] flex-wrap" style={{background:"var(--color-canvas-parchment)", border:"1px solid var(--color-hairline-alpha)"}}>
      <span className="text-sm font-semibold" style={{fontFamily:"var(--font-display)"}}>{selIds.length} selected</span>
      <Btn size="sm" onClick={()=>setBulk({category:"",targetMargin:"",showInDish:"",showInPrep:""})}>Edit</Btn>
      <Btn tone="danger" size="sm" onClick={bulkDelete}>Delete</Btn>
      <Btn tone="ghost" size="sm" onClick={()=>{const m={};list.forEach(r=>m[r.id]=true);setSel(m);}}>Select all shown</Btn>
      <Btn tone="ghost" size="sm" onClick={()=>setSel({})}>Clear</Btn>
    </div>}
    <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-3 stagger">
      {list.slice(0,200).map(r=>{
        const {unitCost:uc,margin}=marginOf(r,ingMap); const isM=r.sellPrice>0; const below=isM && margin<(r.targetMargin/100);
        const fc=isM? uc/r.sellPrice*100 : null; const isSel=!!sel[r.id];
        const accent = below? "var(--color-primary)" : (isM? "#3f9e63" : "var(--color-ink-muted-48)");
        return <div key={r.id} onClick={()=>{ if(lpFired.current){ lpFired.current=false; return; } if(selMode) toggleSel(r.id); else setView(r); }}
          onPointerDown={()=>{ lpFired.current=false; clearTimeout(lpTimer.current); lpTimer.current=setTimeout(()=>{ lpFired.current=true; toggleSel(r.id); },500); }}
          onPointerUp={()=>clearTimeout(lpTimer.current)} onPointerLeave={()=>clearTimeout(lpTimer.current)}
          className="card cursor-pointer vbtn-card tilt overflow-hidden group relative" style={{padding:0, outline:isSel?"2px solid var(--color-primary-focus)":"none", outlineOffset:-2}}>
          {(selMode)&&<label className="absolute top-2 right-2 z-10 w-7 h-7 rounded-full flex items-center justify-center cursor-pointer" style={{background:"rgba(255,255,255,.85)", border:"1px solid var(--color-hairline-alpha)"}} onClick={e=>e.stopPropagation()}><input type="checkbox" checked={isSel} onChange={()=>toggleSel(r.id)} style={{width:16, height:16, accentColor:"var(--color-primary)"}} /></label>}
          <div className="flex" style={{minHeight:98}}>
            <div style={{width:6, background:accent, flexShrink:0}}></div>
            {r.image && <div className="shrink-0 my-3 ml-3 rounded-xl overflow-hidden" style={{width:64, height:64, background:"var(--color-canvas-parchment)"}}><img src={cld(r.image,64)} alt="" className="w-full h-full object-cover" /></div>}
            <div className="flex-1 min-w-0 py-3 px-3">
              <div className="flex items-start justify-between gap-2">
                <div className="min-w-0">
                  <div className="font-semibold text-stone-800 truncate" style={{fontFamily:"var(--font-display)"}}>{r.name}</div>
                  <div className="text-[11px] text-stone-400 mt-0.5 truncate">{isM? ((r.category||"Uncategorized")+" · "+r.yield+" "+r.yieldUnit) : ((r.category||"Prep / sub-recipe")+" · "+(calcYieldG(r)>0? (Math.round(calcYieldG(r))+" g") : (r.yield+" "+r.yieldUnit)))}</div>
                </div>
                <span className="text-[10px] rounded-full px-2 py-0.5 shrink-0" style={{background: isM?"rgba(200,26,34,.09)":"var(--color-canvas-parchment)", color: isM?"var(--color-primary)":"var(--color-ink-muted-48)", fontWeight:700, letterSpacing:"0.04em"}}>{isM?"MENU":"PREP"}</span>{r.finalised&&<span className="text-[10px] rounded-full px-2 py-0.5 shrink-0" style={{background:"rgba(63,158,99,.12)", color:"#3f9e63", fontWeight:700, letterSpacing:"0.04em"}}>✓ FINAL</span>}
              </div>
              {isM ? <div className="mt-2.5">
                <div className="flex items-baseline gap-2"><span className="text-2xl font-semibold" style={{color:accent, fontFamily:"var(--font-display)", lineHeight:1}}>{pct(margin)}</span><span className="text-[11px] text-stone-400">margin · target {r.targetMargin}%</span></div>
                <div className="mt-2 h-1.5 rounded-full overflow-hidden" style={{background:"var(--color-canvas-parchment)"}}><div style={{height:"100%", width:Math.max(0,Math.min(100,margin*100))+"%", background:accent, transition:"width .5s cubic-bezier(.2,.7,.2,1)"}}></div></div>
                <div className="flex items-center gap-2 mt-2 text-[11px] text-stone-500"><span>Cost {money(uc)}</span><span className="text-stone-300">·</span><span>Sell {money(r.sellPrice)}</span><span className="text-stone-300">·</span><span>FC {fc!=null?fc.toFixed(0)+"%":"-"}</span></div>
              </div> : <div className="mt-2.5">
                {(()=>{ const per=prepPer(r); const bc=recipeCost(r,ingMap);
                  return per!=null
                    ? <div className="flex items-baseline gap-2"><span className="text-2xl font-semibold text-stone-800" style={{fontFamily:"var(--font-display)", lineHeight:1}}>{fmtPer(per)}</span><span className="text-[11px] text-stone-400">per {prepUnit} · batch {money(bc)}{usesImported(r,ingMap)?" · imported":""}</span></div>
                    : <div className="flex items-baseline gap-2"><span className="text-2xl font-semibold text-stone-800" style={{fontFamily:"var(--font-display)", lineHeight:1}}>{money(bc)}</span><span className="text-[11px] text-stone-400">batch cost{usesImported(r,ingMap)?" · imported":""}</span></div>; })()}
                <div className="text-[11px] text-stone-500 mt-2">{(r.items&&r.items.length)||0} ingredients{r.showInDish?" · on a menu":""}</div>
              </div>}
            </div>
          </div>
          <div className="absolute bottom-2 right-2 flex gap-1.5 opacity-0 group-hover:opacity-100 transition duration-150">
            <button onClick={(e)=>{e.stopPropagation(); setEdit(JSON.parse(JSON.stringify(r)));}} className="text-[11px] rounded-full px-2.5 py-1" style={{background:"var(--color-canvas-parchment)", color:"var(--color-ink)", border:"1px solid var(--color-hairline-alpha)", cursor:"pointer"}}>Edit</button>
            <button onClick={(e)=>{ e.stopPropagation(); const reason=prompt("Archive reason (e.g. Seasonal end, Discontinued)","Seasonal end"); if(reason!==null) update(s=>{ const t=s.recipes.find(x=>x.id===r.id); t.archived=true; t.archiveReason=reason; t.archivedAt=today(); }); }} className="text-[11px] rounded-full px-2.5 py-1" style={{background:"var(--color-canvas-parchment)", color:"var(--color-primary)", border:"1px solid var(--color-hairline-alpha)", cursor:"pointer"}}>Archive</button>
          </div>
        </div>;
      })}
    </div>
    {list.length>200 && <div className="p-3 text-xs text-stone-400 text-center">Showing first 200 · narrow with search</div>}
    {edit && <RecipeEditor rec={edit} state={state} ingMap={ingMap} update={update} onCreateIngredient={createIngredient} onClose={()=>setEdit(null)} onSave={commit} onDelete={id=>{update(s=>{s.recipes=s.recipes.filter(r=>r.id!==id);}); setEdit(null);}} />}
    {view && <RecipeSummary rec={view} ingMap={ingMap} onClose={()=>setView(null)} onEdit={()=>{ setEdit(JSON.parse(JSON.stringify(view))); setView(null); }} />}
    {showRcc && <RccImportModal state={state} setState={setState} onClose={()=>setShowRcc(false)} />}
    {bulk && <Modal title={"Bulk edit \u00b7 "+selIds.length+" recipes"} onClose={()=>setBulk(null)}>
      <p className="text-xs text-stone-500 mb-3">Only the fields you fill in are applied to all selected recipes; empty fields keep each recipe's current value.</p>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <Field label="Category"><input className="inp" list="bulk-cats" value={bulk.category} onChange={e=>setBulk(b=>({...b,category:e.target.value}))} placeholder="keep current" /><datalist id="bulk-cats">{allCats.filter(c=>c!=="(none)").map(c=><option key={c} value={c} />)}</datalist></Field>
        <Field label="Target margin %"><input className="inp" type="number" value={bulk.targetMargin} onChange={e=>setBulk(b=>({...b,targetMargin:e.target.value}))} placeholder="keep current" /></Field>
        <Field label="Show in Dishes"><select className="inp" value={bulk.showInDish} onChange={e=>setBulk(b=>({...b,showInDish:e.target.value}))}><option value="">keep current</option><option value="on">on</option><option value="off">off</option></select></Field>
        <Field label="Show in Prep board"><select className="inp" value={bulk.showInPrep} onChange={e=>setBulk(b=>({...b,showInPrep:e.target.value}))}><option value="">keep current</option><option value="on">on</option><option value="off">off</option></select></Field>
        <Field label="Finalised"><select className="inp" value={bulk.finalised||""} onChange={e=>setBulk(b=>({...b,finalised:e.target.value}))}><option value="">keep current</option><option value="on">finalised</option><option value="off">not finalised</option></select></Field>
      </div>
      <div className="flex justify-end gap-2 mt-5"><Btn tone="ghost" onClick={()=>setBulk(null)}>Cancel</Btn><Btn onClick={applyBulk}>Apply to {selIds.length}</Btn></div>
    </Modal>}
  </div>;
}
function RccImportModal({state, setState, onClose}){
  const [conn,setConn]=useState(()=>{ try{ return JSON.parse(localStorage.getItem("hideout_rcc_conn"))||{mode:"direct"}; }catch(e){ return {mode:"direct"}; } });
  const [busy,setBusy]=useState(false);
  const [log,setLog]=useState("");
  const [raw,setRaw]=useState("");
  const set=(k,v)=>{ const n={...conn,[k]:v}; setConn(n); try{ localStorage.setItem("hideout_rcc_conn", JSON.stringify(n)); }catch(e){} };
  const mode = conn.mode||"direct";
  const apiBase = ()=> (conn.apiBase||"https://recipecostcalculator.net/api/v1").replace(/\/+$/,"");
  const relayBase = ()=> (conn.backendUrl||"").trim();
  const withTok = u => u + (u.indexOf("?")>-1?"&":"?") + "token=" + encodeURIComponent((conn.token||"").trim());

  async function apiList(){
    if(mode==="direct"){
      const r=await fetch(apiBase()+"/recipes",{headers:{"x-api-key":(conn.apiKey||"").trim()},cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status+(r.status===401?" — check API key":""));
      const j=await r.json(); return Array.isArray(j)? j : (j.recipes||j.data||[]);
    } else {
      const r=await fetch(withTok(relayBase()+"?action=rccListRecipes"),{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status); const t=await r.text();
      let j; try{ j=JSON.parse(t); }catch(e){ throw new Error("Non-JSON (check URL/token): "+t.slice(0,100)); }
      return j.recipes||j.data||(Array.isArray(j)?j:[]);
    }
  }
  async function apiGet(id){
    if(mode==="direct"){
      const r=await fetch(apiBase()+"/recipes/"+encodeURIComponent(id),{headers:{"x-api-key":(conn.apiKey||"").trim()},cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status); const j=await r.json(); return j.recipe||j.data||j;
    } else {
      const r=await fetch(withTok(relayBase()+"?action=rccGetRecipe&recipeId="+encodeURIComponent(id)),{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status); const t=await r.text();
      let j; try{ j=JSON.parse(t); }catch(e){ throw new Error("Non-JSON: "+t.slice(0,100)); }
      return j.recipe||j.data||j;
    }
  }
  const corsHint = " If this is a CORS/network error, the browser may be blocking the direct call — try the Relay mode instead.";

  async function rawText(u){ const r=await fetch(u,{cache:"no-store", headers: mode==="direct"?{"x-api-key":(conn.apiKey||"").trim()}:undefined}); const t=await r.text(); return "HTTP "+r.status+" "+r.statusText+"\n"+t.slice(0,2500); }
  async function test(){
    setBusy(true); setLog("Loading recipe list…"); setRaw("");
    try{
      const listUrl = mode==="direct" ? apiBase()+"/recipes" : withTok(relayBase()+"?action=rccListRecipes");
      let rt=""; try{ rt=await rawText(listUrl); }catch(e){ rt="(raw fetch error: "+e.message+")"; }
      let parsed="";
      try{
        const list=await apiList();
        let sample=null;
        if(list.length){ const id=pick(list[0],["id","recipeId","recipe_id"]); if(id!=null) sample=await apiGet(id); }
        parsed=JSON.stringify({listCount:list.length, firstListItem:list[0]||null, firstRecipeParsed: sample?rccToRecipe(sample,list[0]):null, firstRecipeRaw:sample}, null, 2);
      }catch(e){ parsed="(parse step error: "+e.message+")"; }
      setRaw("--- RAW list response (first 2500 chars) ---\n"+rt+"\n\n--- Parsed ---\n"+parsed);
      setLog("Done. Review the RAW response below. If listCount is 0, the RAW shows exactly what the relay returned (empty, error, or a different shape).");
    }catch(e){ setLog("Error: "+e.message+(mode==="direct"?corsHint:"")); }
    setBusy(false);
  }
  async function importAll(){
    if(!confirm("Import all recipes from RCC with quantities?\nMatching recipes are updated by ID/name; others are added.")) return;
    setBusy(true); setLog("Loading list…");
    try{
      const list=await apiList();
      const mapped=[]; let fail=0;
      for(let i=0;i<list.length;i++){
        const id=pick(list[i],["id","recipeId","recipe_id"]);
        setLog("Fetching "+(i+1)+"/"+list.length+"…");
        try{ mapped.push(rccToRecipe(await apiGet(id), list[i])); }catch(e){ fail++; }
        await new Promise(r=>setTimeout(r, mode==="direct"?150:120));
      }
      setState(s=>{ const n=JSON.parse(JSON.stringify(s));
        mapped.forEach(m=>{ const idx=n.recipes.findIndex(x=>(m.extId&&x.extId===m.extId)||x.name.toLowerCase()===m.name.toLowerCase()); if(idx>=0){ m.archived=n.recipes[idx].archived; n.recipes[idx]=m; } else n.recipes.push(m); });
        n.recipes.forEach(r=>{ if(r.items) r.items.forEach(it=>{ if(!it.ingredientId && it.rawName){ const mt=matchIngredient(it.rawName, n.ingredients); if(mt) it.ingredientId=mt.ing.id; } }); });
        return n; });
      const withQty=mapped.filter(m=>(m.items||[]).some(it=>it.qty>0)).length;
      setLog("Done. Imported "+mapped.length+" recipes ("+withQty+" with quantities"+(fail?", "+fail+" failed":"")+"). Costs now auto-calculate.");
    }catch(e){ setLog("Error: "+e.message+(mode==="direct"?corsHint:"")); }
    setBusy(false);
  }

  return <Modal onClose={onClose} title="Import from Recipe Cost Calculator" wide>
    <p className="text-xs text-stone-500 mb-3">Pulls recipes <b>with ingredient quantities</b> straight from RCC (GET /api/v1/recipes). Settings are saved locally in this browser.</p>
    <div className="flex gap-2 mb-3">
      <button onClick={()=>set("mode","direct")} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${mode==="direct"?"bg-stone-800 text-white":"bg-stone-100 text-stone-600"}`}>Direct API (x-api-key)</button>
      <button onClick={()=>set("mode","relay")} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${mode==="relay"?"bg-stone-800 text-white":"bg-stone-100 text-stone-600"}`}>Relay (Apps Script)</button>
    </div>
    {mode==="direct" ? <div className="grid grid-cols-1 gap-3 mb-3">
      <Field label="API key (x-api-key, read-only)"><input className="inp" type="password" value={conn.apiKey||""} onChange={e=>set("apiKey",e.target.value)} placeholder="your RCC API key" /></Field>
      <Field label="API base (default is fine)"><input className="inp" value={conn.apiBase||"https://recipecostcalculator.net/api/v1"} onChange={e=>set("apiBase",e.target.value)} /></Field>
    </div> : <div className="grid grid-cols-1 gap-3 mb-3">
      <Field label="Backend exec URL (Apps Script .../exec)"><input className="inp" value={conn.backendUrl||""} onChange={e=>set("backendUrl",e.target.value)} placeholder="https://script.google.com/macros/s/XXXX/exec" /></Field>
      <Field label="Token (API_SECRET)"><input className="inp" type="password" value={conn.token||""} onChange={e=>set("token",e.target.value)} /></Field>
    </div>}
    <div className="flex gap-2 mb-3">
      <Btn tone="ghost" onClick={test}>{busy?"Working…":"Test (show sample)"}</Btn>

/* Cloudinary hands back the original file unless the URL asks for something smaller, and none of
   ours did - a Dishes screen was pulling 2.5MB of full-size JPEGs. Slotting a transform in after
   /upload/ makes Cloudinary resize and re-encode on its side (and cache the result forever):
     f_auto  - WebP/AVIF when the browser takes it, JPEG when it doesn't
     q_auto  - quality picked per image instead of a fixed number
     c_limit - never upscales, so a small original is left at its own size
   `w` is the CSS width the image is drawn at; the device pixel ratio is applied here so a retina
   tablet still gets a sharp picture. Non-Cloudinary URLs (someone pasted a link) pass through
   untouched, and a URL that already carries a transform is left alone. */
function cld(url, w, dprOverride){
  const u=String(url||"");
  const i=u.indexOf("/upload/");
  if(!u || u.indexOf("res.cloudinary.com")<0 || i<0) return u;
  const rest=u.slice(i+8), first=rest.split("/")[0];
  if(/,/.test(first) || /^(?:f|q|w|h|c|e|g|dpr|fl|ar)_/.test(first)) return u;   // already transformed
  const dpr=dprOverride!=null?dprOverride:Math.min(2, (window.devicePixelRatio||1));
  const px=Math.max(48, Math.round((Number(w)||600)*dpr));
  return u.slice(0,i+8)+"f_auto,q_auto,c_limit,w_"+px+"/"+rest;
}

async function cloudinaryList(){

  if(!r.ok){ if(r.status===401||r.status===420) throw new Error("Enable 'Resource list' in Cloudinary → Settings → Security, and tag your photos '"+tag+"'."); throw new Error("HTTP "+r.status+" (tag '"+tag+"' — did you tag the photos?)"); }

function bestRecipeMatch(name, recipes){
  const n=(name||"").trim().toLowerCase(); if(!n) return null;

  recipes.forEach(r=>{ if(r.archived) return; const a=(r.name||"").toLowerCase(); let sc=0;

        return <div key={i}>
        <div className="flex items-center justify-between p-3 text-sm gap-3" onClick={sub?()=>setOpenSub(open?null:it.subRecipeId):undefined} style={sub?{cursor:"pointer"}:undefined}>

        </div>

// Rank active ingredients by name-token overlap with a supplier line ("Canned Chickpeas in Brine 3kg (3) Twin Pine"
// → Chickpeas…). Used by IngredientPicker to surface likely re-link targets before the user types anything.
function pickerSimilar(rawName, ings){
  const STOP={in:1,of:1,the:1,a:1,and:1,with:1,per:1,kg:1,g:1,gm:1,gms:1,ml:1,l:1,lt:1,ltr:1,x:1,ea:1,each:1,ctn:1,carton:1,box:1,pk:1,pkt:1,pack:1,tin:1,can:1,cans:1,canned:1,jar:1,tub:1,bag:1,btl:1,bottle:1,frozen:1,fresh:1,twin:1,pine:1};
  const toks=s=>String(s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/)
    .filter(t=>t.length>=3 && !STOP[t] && !/^\d/.test(t)).map(t=>t.replace(/s$/,""));
  const rt=toks(rawName); if(!rt.length) return [];
  return ings.map(g=>{ const it=toks(g.name); let sc=0;
      rt.forEach(t=>{ if(it.some(w=>w===t)) sc+=2; else if(it.some(w=>(w.length>=4&&w.indexOf(t)===0)||(t.length>=4&&t.indexOf(w)===0))) sc+=1; });
      return {g,sc}; })
    .filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,4).map(x=>x.g);
}
function IngredientPicker({item, activeIngs, subRecipes, onPick, onCreate, seed}){
  const [open,setOpen]=useState(false); const [q,setQ]=useState(""); const [nf,setNf]=useState(null);
  const [pos,setPos]=useState(null);      // fixed-position box for the portal list
  const [hi,setHi]=useState(0);           // keyboard highlight
  const btnRef=useRef(null), listRef=useRef(null);
  const cur = item.subRecipeId? subRecipes.find(r=>r.id===item.subRecipeId) : (item.ingredientId? activeIngs.find(g=>g.id===item.ingredientId):null);
  const unmatched = item.rawName && !item.ingredientId && !item.subRecipeId;
  const label = cur? (item.subRecipeId?("\u25b8 "+cur.name):cur.name) : (unmatched? ("\u26a0 "+item.rawName) : "Select ingredient\u2026");
  const ql=q.trim().toLowerCase();
  const sims = useMemo(()=> (open && item.rawName)? pickerSimilar(item.rawName, activeIngs) : [], [open, item.rawName, activeIngs]);
  const fIngs=(ql? activeIngs.filter(g=>(g.name||"").toLowerCase().includes(ql)) : activeIngs).slice(0,60);
  const fSubs=(ql? subRecipes.filter(r=>(r.name||"").toLowerCase().includes(ql)) : subRecipes).slice(0,25);
  /* one flat list behind the sections, so the arrow keys can walk the whole thing */
  const flat=[].concat(ql?[]:sims.map(g=>({k:"sim",id:g.id,name:g.name,g})), fIngs.map(g=>({k:"ing",id:g.id,name:g.name,g})), fSubs.map(r=>({k:"sub",id:"rec:"+r.id,name:r.name})));

  /* Measure the trigger and pin the list to it. Fixed + portal is the only placement that survives
     the editor: the row makes its own stacking context (animation) and the editor body scrolls
     with overflow:auto, so an absolutely positioned child gets both covered and clipped. */
  const place=()=>{ const b=btnRef.current; if(!b) return;
    const r=b.getBoundingClientRect(), gap=6, want=Math.min(380, Math.round(window.innerHeight*0.55));
    /* The row has scrolled out of the editor - a fixed list left hanging over unrelated content is
       worse than no list, so dismiss instead of chasing it. */
    if(r.bottom<0 || r.top>window.innerHeight){ setOpen(false); return; }
    const below=window.innerHeight-r.bottom-gap, above=r.top-gap;
    const up = below < Math.min(240,want) && above > below;
    const next={ left:Math.round(r.left), width:Math.round(r.width),
             top: up? null : Math.round(r.bottom+gap),
             bottom: up? Math.round(window.innerHeight-r.top+gap) : null,
             maxH: Math.max(180, Math.round((up?above:below)-8)), up };
    /* Same numbers as last frame means nothing to paint. Without this every scroll event re-renders
       the list and its portal even when the row has not moved a pixel on screen. */
    setPos(p=> (p && p.left===next.left && p.width===next.width && p.top===next.top
                && p.bottom===next.bottom && p.maxH===next.maxH) ? p : next);
  };
  useEffect(()=>{ if(!open) return; place();
    /* capture, so the editor's own overflow:auto scroller is heard too - but coalesced to one
       measurement per frame, not one per event. */
    let raf=0; const on=()=>{ if(raf) return; raf=requestAnimationFrame(()=>{ raf=0; place(); }); };
    window.addEventListener("scroll",on,true); window.addEventListener("resize",on);
    return ()=>{ if(raf) cancelAnimationFrame(raf);
      window.removeEventListener("scroll",on,true); window.removeEventListener("resize",on); };
  },[open]);
  useEffect(()=>{ if(open) setHi(0); },[open,ql]);
  /* Top of the stack while open, so Esc dismisses the list and leaves the editor standing. */

    const away=e=>{ const l=listRef.current,b=btnRef.current;

    document.addEventListener("pointerdown",away,true);
    return ()=>document.removeEventListener("pointerdown",away,true);
  },[open]);

  function pick(v){ onPick(v); setOpen(false); setQ(""); setNf(null); }
  /* Creating an ingredient from here opens the SAME Add Ingredient modal the Ingredients tab uses -
     see the render below. `nf` is therefore a blank ingredient record, not a cut-down form state. */
  function startNew(){ const nm=(q.trim()||item.rawName||"").trim();
    setOpen(false);
    setNf({id:"", name:nm, category:"",
      purchaseUnit:(seed&&seed.purchaseUnit)||"", useUnit:(seed&&seed.useUnit)||"g",
      purchaseQty:(seed&&Number(seed.purchaseQty)>0)?Number(seed.purchaseQty):1,
      purchasePrice:(seed&&Number(seed.purchasePrice)>0)?Number(seed.purchasePrice):0,
      gramsPerEach:0, allergens:[], suppliers:[], costHistory:[], archived:false}); }
  const onKey=e=>{
    if(!open) return;
    if(e.key==="Escape"){ e.preventDefault(); setOpen(false); return; }
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault();
      setHi(h=>{ const n=flat.length; if(!n) return 0; return (h+(e.key==="ArrowDown"?1:-1)+n)%n; }); return; }
    if(e.key==="Enter"){ const t=flat[hi]; if(t){ e.preventDefault(); pick(t.id); } }
  };

  const rowCls=(i)=>"idp-opt"+(i===hi?" on":"");
  const list = open && pos ? ReactDOM.createPortal(
    <div ref={listRef} className="tdv2 idp-pop" style={{left:pos.left, width:pos.width,
        top:pos.top!=null?pos.top:undefined, bottom:pos.bottom!=null?pos.bottom:undefined,
        maxHeight:pos.maxH, transformOrigin:pos.up?"50% 100%":"50% 0%"}}>
      <div className="idp-search">
        <input autoFocus value={q} onChange={e=>setQ(e.target.value)} onKeyDown={onKey}
          placeholder="Search ingredients…" className="idp-input" />
      </div>
      <div className="idp-scroll">
        <button type="button" onClick={startNew} className="idp-new">
          + Create new ingredient{(q||item.rawName)?(" \u201c"+(q||item.rawName)+"\u201d"):""}
        </button>
        {!ql && sims.length>0 && <>
          <div className="idp-sec">Similar to this line ({sims.length})</div>
          {sims.map((g,i)=><button key={"sim-"+g.id} type="button" onClick={()=>pick(g.id)}
            onMouseEnter={()=>setHi(i)} className={rowCls(i)+" sim"}>
            <span className="idp-name">{g.name}</span><span className="idp-cost">{money(unitCost(g))}/{g.useUnit}</span></button>)}
        </>}
        <div className="idp-sec">Ingredients ({fIngs.length})</div>
        {fIngs.length===0 && <div className="idp-empty">no match — create it above</div>}
        {fIngs.map((g,i)=>{ const idx=(ql?0:sims.length)+i;
          return <button key={g.id} type="button" onClick={()=>pick(g.id)} onMouseEnter={()=>setHi(idx)} className={rowCls(idx)}>
            <span className="idp-name">{g.name}</span><span className="idp-cost">{money(unitCost(g))}/{g.useUnit}</span></button>; })}
        {fSubs.length>0 && <>
          <div className="idp-sec">Sub-recipes ({fSubs.length})</div>
          {fSubs.map((r,i)=>{ const idx=(ql?0:sims.length)+fIngs.length+i;
            return <button key={r.id} type="button" onClick={()=>pick("rec:"+r.id)} onMouseEnter={()=>setHi(idx)} className={rowCls(idx)}>
              <span className="idp-name">{"\u25b8 "+r.name}</span></button>; })}
        </>}
      </div>
    </div>, document.body) : null;

  return <div className="relative">
    <button ref={btnRef} type="button" onClick={()=>setOpen(o=>!o)} onKeyDown={onKey}
      className={"idp-trigger"+(unmatched?" warn":"")+(!cur?" ph":"")}>
      <span className="idp-tlabel">{label}</span><span className="idp-caret">{open?"\u25b4":"\u25be"}</span>
    </button>
    {list}
    {/* The create form IS the Add Ingredient modal - one component, so the fields, the unit
        dropdowns, the pack-size validation and the allergen/supplier rows can never drift apart
        again. It used to be a cut-down emerald card with free-text units and no allergens, which
        produced ingredients shaped differently from the ones made on the Ingredients tab. */}
    {nf && <IngredientEditor ing={nf} onClose={()=>setNf(null)} onSave={o=>{ const id=onCreate(o); pick(id); }} />}
  </div>;
}

/* ---------------- Invoice parsers (supplier rules — see _hermes/supplier-invoice-rules.md) ---------------- */
const INV_SPEC={ eggTray:30, eggDozen:12, strawberryPunnet:250, mushroomFieldBox:4000, bunchDefault:100 };
const INV_MASS={mg:0.001,g:1,kg:1000}, INV_VOL={ml:1,l:1000};
function invMoney(s){ return Number(String(s).replace(/[^0-9.]/g,""))||0; }
function freshoParseUnit(desc, unit){
  const d=(desc||"").toLowerCase(), u=(unit||"").trim();
  const mParen=u.match(/\(([\d.]+)\s*(kg|g|ml|l)\)/i);
  if(mParen){ const n=Number(mParen[1]), un=mParen[2].toLowerCase(); const before=u.split("(")[0].trim()||"pack";
    if(INV_MASS[un]!=null) return {purchaseUnit:before, purchaseQty:n*INV_MASS[un], useUnit:"g"};
    if(INV_VOL[un]!=null) return {purchaseUnit:before, purchaseQty:n*INV_VOL[un], useUnit:"ml"}; }
  if(d.includes("egg")){ if(/tray/i.test(u)||/tray/i.test(desc)) return {purchaseUnit:"Tray", purchaseQty:INV_SPEC.eggTray, useUnit:"each"}; if(/dozen/i.test(u)) return {purchaseUnit:"Dozen", purchaseQty:INV_SPEC.eggDozen, useUnit:"each"}; }
  if(/punnet/i.test(u)){ if(d.includes("strawberr")) return {purchaseUnit:"Punnet", purchaseQty:INV_SPEC.strawberryPunnet, useUnit:"g"}; return {purchaseUnit:"Punnet", purchaseQty:0, useUnit:"g", ask:1}; }
  if(/bunch/i.test(u)) return {purchaseUnit:"Bunch", purchaseQty:INV_SPEC.bunchDefault, useUnit:"g"};
  if(/^box/i.test(u)){ if(d.includes("mushroom")&&(d.includes("field")||d.includes("flat"))) return {purchaseUnit:"Box", purchaseQty:INV_SPEC.mushroomFieldBox, useUnit:"g"}; return {purchaseUnit:"Box", purchaseQty:0, useUnit:"g", ask:1}; }
  if(/each/i.test(u)) return {purchaseUnit:"Each", purchaseQty:1, useUnit:"each"};
  return {purchaseUnit:u||"unit", purchaseQty:1, useUnit:"each"};
}
function parseFreshoText(text){
  const body=(text||"").split(/QTY\s+CODE\s+DESCRIPTION/i)[1]||text;
  const rows=body.split(/(?=\s\d+\s+[A-Z0-9]+\/)/).map(s=>s.trim()).filter(r=>/^\d+\s+[A-Z0-9]+\//.test(r));
  return rows.map(r=>{ const cols=r.split(/\s{2,}/).map(s=>s.trim()).filter(Boolean); if(cols.length<5) return null;
    const desc=cols[2], unit=cols[3], price=invMoney(cols[4]); const sp=freshoParseUnit(desc,unit);
    return { name:"Big Michael's - "+desc, orderCode:cols[1], supplier:"Big Michael's (Fresho)", price, unit:sp.purchaseUnit, purchaseUnit:sp.purchaseUnit, purchaseQty:sp.purchaseQty, useUnit:sp.useUnit, ask:!!sp.ask };
  }).filter(Boolean);
}
/* ---------------- Invoices ---------------- */
/* Invoice ingredient card — opens from a logged price update. Shows the ingredient's
   full price history across every invoice run, and lets Ju An re-link a line the AI
   matched to the wrong ingredient. The re-link is saved as an alias in
   state.invoiceAliases so the 09:04 task applies it automatically from then on. */
function InvoiceItemCard({row, entry, state, update, onClose}){
  const ings=(state.ingredients||[]).filter(g=>!g.archived);
  /* set only after the person has seen the two numbers and said yes - see relink() */
  const confirmedJump=useRef(false);
  const ing = (row.id && ings.find(g=>g.id===row.id)) || ings.find(g=>(g.name||"")===row.name) || null;
  /* The supplier's OWN wording and the supplier on the line - not the ingredient name, and not
     the log entry's "Multiple" placeholder. Getting this wrong writes a rule that never fires. */
  const aliasSup = row.supplier || entry.supplier || "";
  const aliasRaw = row.rawName || "";
  const aliasKey = aivKey(aliasSup, row.orderCode, aliasRaw);
  const aliasOk  = aivKeyUsable(aliasSup, row.orderCode, aliasRaw);
  const aliasId = aliasOk? (((state.invoiceAliases||{})[aliasKey])||"") : "";
  const aliased = aliasId? ings.find(g=>g.id===aliasId) : null;
  // history: every logged update for this ingredient (by id, else by name)
  const hist=[];
  (state.invoiceLog||[]).forEach(e=>(e.updated||[]).forEach(u=>{
    const same = (row.id && u.id===row.id) || (!row.id && (u.name||"")===(row.name||""));
    if(same) hist.push({date:e.date, supplier:e.supplier, invoiceNo:e.invoiceNo, old:u.old, new:u.new, unit:u.unit, manual:/^Manual link by staff/.test(String(e.analysis||""))});
  }));
  hist.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
  // Create a brand-new ingredient straight from the picker (same schema as the app's
  // createIngredient API) — needed because "Needs linking" lines are often genuinely new items.
  function createFromPicker(d){
    const id=rid("ing"); const uu=((d&&d.useUnit)||row.unit||"each").trim()||"each";
    update(s=>{ s.ingredients=s.ingredients||[]; s.ingredients.push({
      id, name:((d&&d.name)||row.name||row.rawName||"").trim(), category:(d&&d.category)||"",
      purchaseUnit:((d&&d.purchaseUnit)||uu), useUnit:uu,
      purchaseQty:Number(d&&d.purchaseQty)||1, purchasePrice:Number(d&&d.purchasePrice)||0,
      gramsPerEach:0, allergens:detectAllergens((d&&d.name)||row.name||""), archived:false,
      suppliers:(row.orderCode?[{name:entry.supplier||"", orderCode:row.orderCode}]:[]),
      costHistory:[{date:today(), price:Number(d&&d.purchasePrice)||0}]
    }); });
    return id;
  }
  /* Apply this invoice line's price to the ingredient it is (now) linked to.
     row.new is the invoice price per row.unit; the ingredient stores purchasePrice per purchaseQty
     of its own useUnit — so convert first and keep the ingredient's own unit/pack untouched.
     Returns {ok, old, next} so the caller can report exactly what changed. */
  function applyPriceTo(s, tgtId){
    const g=(s.ingredients||[]).find(x=>x.id===tgtId); if(!g) return {ok:false, why:"not found"};
    /* row.new is a rate per one unit - EXCEPT on rows written by the old manual-link code, which
       stored the pack total. Those are tagged basis:"pack" where they are opened; divide by the
       pack size they were written against, or the multiply below doubles it up. */
    let price=Number(row.new);
    if(row.basis==="pack"){ const rq=Math.abs(Number(row.qty))||Math.abs(Number(g.purchaseQty))||1; price=price/rq; }
    if(!(price>0)) return {ok:false, why:"no price on this line"};
    const qty=Math.abs(Number(g.purchaseQty))||1;
    const from=row.unit||g.useUnit||"", to=g.useUnit||row.unit||"";
    // toUnit() silently returns the input when two units share no table (box↔each, portion↔ml …).
    // Without this explicit gate that fallback would be saved as a real price — e.g. $45/box on an
    // ingredient priced per each with purchaseQty 500 became $22,500. Refuse instead of guessing.
    if(!unitsComparable(from,to)) return {ok:false, why:"can't convert "+(from||"?")+" → "+(to||"?")};
    const perUse = toUnit(price, to, from);        // $/row.unit → $/useUnit  (rate: invert direction)
    if(!(perUse>0)) return {ok:false, why:"unit mismatch"};
    const next=+(perUse*qty).toFixed(4), old=Number(g.purchasePrice)||0;
    if(next===old) return {ok:false, why:"same price"};
    const jump=aivWildJump(old, next);
    if(jump && !confirmedJump.current) return {ok:false, why:"looks like a pack/unit mix-up", jump:jump, old:old, next:next, unit:g.useUnit, qty:qty};
    g.purchasePrice=next;
    g.costHistory=(g.costHistory||[]).concat([{date:today(), price:next, note:"AI Invoice (manual link) "+(entry.supplier||"")+(entry.invoiceNo?" "+entry.invoiceNo:"")}]);
    if(row.orderCode){ g.suppliers=g.suppliers||[]; if(!g.suppliers.some(sp=>sp.orderCode===row.orderCode)) g.suppliers.push({name:entry.supplier||"", orderCode:row.orderCode}); }
    return {ok:true, old, next, unit:g.useUnit, qty, perOld:+(old/qty).toFixed(6), perNew:+(next/qty).toFixed(6)};
  }
  function relink(v){
    const id = (v&&v.ingredientId)||v;
    if(!id||typeof id!=="string") return;
    if(id.indexOf("rec:")===0){ alert("Pick an ingredient, not a sub-recipe — invoice prices apply to ingredients only."); return; }
    // NOTE: look the target up inside update() too — an ingredient created a moment ago via the
    // picker ("+ Create new ingredient") is not in this render's `ings` closure yet.
    let tgt=ings.find(g=>g.id===id);
    // Was this line already applied to a DIFFERENT ingredient by the AI? Offer to undo that.
    const wrong = (ing && ing.id!==id && row.old!=null) ? ing : null;
    const undo = wrong ? confirm("Also undo the price on the wrongly matched \""+wrong.name+"\"?\n\nIt will go back to "+money(row.old)+"/"+(row.unit||wrong.useUnit||"")+".\n\nOK = undo it   ·   Cancel = leave it as is") : false;
    let res=null, undone=false;
    update(s=>{
      if(!tgt) tgt=(s.ingredients||[]).find(x=>x.id===id);
      if(!tgt){ res={ok:false, why:"not found"}; return; }
      /* Only write a rule that a future run can actually hit. A key built from "Multiple" or from
         the ingredient's own name matches nothing, and the line returns to the queue every run. */
      if(aliasOk){
        s.invoiceAliases=s.invoiceAliases||{};
        s.invoiceAliases[aliasKey]=id;
        s.invoiceUnmatched=(s.invoiceUnmatched||[]).filter(x=>aivKey(x.supplier, x.orderCode, x.rawName)!==aliasKey);
      }
      res=applyPriceTo(s, id);                                  // new invoice price wins on the correct ingredient
      if(undo){                                                 // restore the previous price on the wrong one
        const w=(s.ingredients||[]).find(x=>x.id===wrong.id);
        if(w){ const q=Math.abs(Number(w.purchaseQty))||1;
          const wf=row.unit||w.useUnit||"", wt=w.useUnit||row.unit||"";
          const back=unitsComparable(wf,wt)? toUnit(Number(row.old), wt, wf) : 0;   // same gate as applyPriceTo
          if(back>0){ w.purchasePrice=+(back*q).toFixed(4);
            w.costHistory=(w.costHistory||[]).concat([{date:today(), price:w.purchasePrice, note:"Reverted — invoice line re-linked to "+tgt.name}]);
            undone=true; } }
      }
      // audit trail in the same log the tab renders
      s.invoiceLog=s.invoiceLog||[];
      s.invoiceLog.unshift({ ts:Date.now(), date:today(), supplier:entry.supplier||"", invoiceNo:entry.invoiceNo||"",
        analysis:"Manual link by staff — this supplier line now maps to \""+tgt.name+"\" and future runs use it automatically.",
        updated: res&&res.ok? [{id:tgt.id, name:tgt.name, old:res.perOld, new:res.perNew, unit:res.unit,
                                orderCode:row.orderCode||"", rawName:aliasRaw, supplier:aliasSup,
                                basis:"unit", qty:res.qty, pack:res.next}] : [],
        added: [], flagged: (res&&!res.ok&&res.why!=="same price"? ["Price not applied ("+res.why+") — set it manually on "+tgt.name+"."]:[])
          .concat(undone? ["Reverted the earlier price on "+wrong.name+"."]:[]) });
    });
    // React 18 batches both update() calls from a create-then-link click; the reducers (which set
    // tgt/res) only run when the batch flushes — so defer the user-facing outcome past the flush.
    setTimeout(()=>{
      if(!tgt){ alert("Could not link — ingredient not found."); return; }
      /* A 20x move is almost always a pack read as a unit. Show both numbers and let the person
         decide - refusing outright would block a genuine correction of an already-wrong price. */
      if(res && res.jump){
        if(confirm("This would change the price " + res.jump + "x.\n\n"
            + money(res.old) + "  \u2192  " + money(res.next) + "   per " + res.qty + " " + (res.unit||"") + "\n\n"
            + "A jump that size is usually a pack price read as a unit price, not a real change.\n\n"
            + "OK = apply it anyway   \u00b7   Cancel = leave the price alone")){
          confirmedJump.current = true; relink(v); confirmedJump.current = false;
        }
        return;
      }
      alert("Linked to \""+tgt.name+"\"."
        + (res&&res.ok? "\nPrice updated: "+money(res.old)+" → "+money(res.next)+" per "+res.qty+" "+res.unit
          : (res&&res.why==="same price"? "\nPrice already matches this invoice line."
            : "\nPrice NOT applied ("+((res&&res.why)||"?")+") — set it manually."))
        + (undone? "\nReverted "+wrong.name+" to its previous price." : "")
        + "\n\nFuture invoice runs will use this mapping automatically.");
      onClose();
    },0);
  }
  return <Modal title={"Invoice item — "+(row.name||row.rawName||"?")} onClose={onClose}>
    <div className="space-y-4 text-sm">
      <div className="rounded-lg border border-stone-200 p-3">
        <div className="flex justify-between gap-3 mb-1"><span className="text-stone-500">Supplier</span><span className="font-medium">{entry.supplier||"?"}{entry.invoiceNo?" · "+entry.invoiceNo:""}</span></div>
        {row.orderCode?<div className="flex justify-between gap-3 mb-1"><span className="text-stone-500">Order code</span><span className="font-mono text-xs">{row.orderCode}</span></div>:null}
        <div className="flex justify-between gap-3 mb-1"><span className="text-stone-500">This update</span><span>{row.old!=null?money(row.old):"–"} → <b>{money(row.new)}</b>{row.unit?<span className="text-stone-400">/{row.unit}</span>:null}</span></div>
        <div className="flex justify-between gap-3"><span className="text-stone-500">Matched ingredient</span><span className={ing?"font-medium":"text-amber-700"}>{ing?ing.name:"⚠ not found in app"}</span></div>
        {ing?<div className="flex justify-between gap-3 mt-1"><span className="text-stone-500">Current app price</span><span>{money(ing.purchasePrice)} / {ing.purchaseQty||1} {ing.useUnit||"each"}</span></div>:null}
      </div>

      <div>
        <div className="text-[11px] uppercase tracking-wide text-stone-400 mb-1">Price history ({hist.length})</div>
        <AivHistChart rows={hist.slice().reverse().filter(h=>!h.manual && Number(h.new)>0).map(h=>({date:h.date, supplier:h.supplier, unit:h.unit, price:Number(h.new)}))} />
        {hist.length===0? <div className="text-stone-400 text-xs">No history logged yet.</div> :
          <div className="space-y-0.5 max-h-48 overflow-auto">
            {hist.map((h,i)=><div key={i} className="flex justify-between gap-3 text-xs">
              <span className="text-stone-500 shrink-0">{h.date} · {h.supplier||"?"}</span>
              <span>{h.old!=null?money(h.old):"–"} → <b>{money(h.new)}</b>{h.unit?<span className="text-stone-400">/{h.unit}</span>:null}</span>
            </div>)}
          </div>}
      </div>

      <div className="rounded-lg bg-amber-50 border border-amber-200 p-3">
        <div className="font-medium text-amber-900 mb-1">Wrong ingredient?</div>
        <p className="text-xs text-amber-800 mb-2">Pick the ingredient this supplier line really belongs to. The choice is saved as a rule — every future automatic run uses it, so it only needs fixing once.{aliased?<span> Current rule: <b>{aliased.name}</b>.</span>:null}</p>
        <IngredientPicker item={{ingredientId:(aliasId||(ing&&ing.id)||""), rawName:row.name||row.rawName||""}} activeIngs={ings} subRecipes={[]} onPick={relink} onCreate={createFromPicker}
          seed={(()=>{ const u=(row.unit||"each"), m=(u==="g"||u==="ml")?1000:1, p=Number(row.new);
            // Only trust row.new as a PER-UNIT rate on genuinely unmatched lines (old==null, no app
            // match). Rows reopened from the invoice log carry res.next there — the TOTAL pack price —
            // and seeding that would inflate the new ingredient's price ~purchaseQty×. Seed 0 instead.
            const perUnit = (!ing && row.old==null && p>0);
            return {useUnit:u, purchaseQty:m, purchasePrice:(perUnit? +((p*m).toFixed(4)) : 0)}; })()} />
      </div>
    </div>
  </Modal>;
}

function procNormName(s){ return String(s||"").toLowerCase().replace(/^\*+\s*/,"").replace(/[^a-z0-9]+/g," ").trim(); }

function ProcedureImporter({state, update}){
  const [msg,setMsg]=useState(""); const [preview,setPreview]=useState(null);
  const procs = (typeof TRELLO_PROCEDURES!=="undefined") ? TRELLO_PROCEDURES : {};
  const analyze=()=>{
    const byName={}; Object.keys(procs).forEach(k=>{ byName[procNormName(k)]={card:k, text:procs[k]}; });
    const recs=(state.recipes||[]).filter(r=>!r.archived || true);
    const matchFill=[], matchOverwrite=[], noMatch=[];
    recs.forEach(r=>{ const m=byName[procNormName(r.name)]; if(!m) return; if(!((r.procedure||"").trim())) matchFill.push({id:r.id, name:r.name, card:m.card}); else matchOverwrite.push({id:r.id, name:r.name, card:m.card}); });
    const matchedCards=new Set(recs.map(r=>procNormName(r.name)));
    Object.keys(byName).forEach(k=>{ if(!matchedCards.has(k)) noMatch.push(byName[k].card); });
    return {matchFill, matchOverwrite, noMatch, byName};
  };
  const doImport=(overwrite)=>{
    const {byName}=analyze(); let filled=0;
    update(s=>{ (s.recipes||[]).forEach(r=>{ const m=byName[procNormName(r.name)]; if(!m) return; if(overwrite || !((r.procedure||"").trim())){ r.procedure=m.text; filled++; } }); });
    setMsg(`Done — ${filled} recipe${filled===1?"":"s"} updated${overwrite?" (overwritten)":""}. Open any on the Recipes tab to check the cooking procedure.`);
    setPreview(null);
  };
  const run=()=>{ const a=analyze(); setPreview(a); setMsg(""); };
  // ---- manual one-by-one matcher ----
  const [manual,setManual]=useState(()=>{ try{ return localStorage.getItem("hideout_proc_manual")==="1"; }catch(e){ return false; } });
  const toggleManual=()=>setManual(v=>{ const n=!v; try{ localStorage.setItem("hideout_proc_manual", n?"1":"0"); }catch(e){} return n; });

  const cardNames=Object.keys(procs).sort((a,b)=>a.localeCompare(b));
  const recs=(state.recipes||[]).slice().sort((a,b)=>a.name.localeCompare(b.name));
  const [assignRec,setAssignRec]=useState({}); // cardName -> recipeId
  const [q,setQ]=useState("");
  const [openCard,setOpenCard]=useState(""); const [recQ,setRecQ]=useState({});
  const assign=(card, recId)=>{ const t=recs.find(r=>r.id===recId); if(!t) return; if((t.procedure||"").trim() && (t.procedure||"").trim()!==(procs[card]||"").trim() && !confirm(`"${t.name}" already has a procedure. Overwrite with the "${card}" card?`)) return; update(s=>{ const rr=s.recipes.find(x=>x.id===recId); if(rr) rr.procedure=procs[card]; }); };

function UnitNormalizer({state, update}){
  const PU=["kg","g","L","ml","each"];
  const canon=(u)=>{ const t=String(u||"").trim().toLowerCase().replace(/s$/,""); if(t==="kg")return"kg"; if(t==="g"||t==="gram")return"g"; if(t==="l"||t==="lt"||t==="litre"||t==="liter")return"L"; if(t==="ml")return"ml"; if(t==="each"||t==="ea"||t==="pc"||t==="piece"||t==="unit")return"each"; return null; };
  const parsePU=(v)=>{ const t=String(v||"").trim(); const m=t.match(/^([\d.]+)\s*([A-Za-z]+)$/); if(m){ const u=canon(m[2]); if(u) return {size:Number(m[1]), unit:u}; } return {size:null, unit:canon(t)}; };
  const conv=(n,from,to)=>{ const a=canon(from), b=canon(to); if(!a||!b||a===b) return n; for(const tbl of [U_MASS,U_VOL]){ const x=tbl[a.toLowerCase()], y=tbl[b.toLowerCase()]; if(x!=null&&y!=null) return n*x/y; } return null; };
  const plan=useMemo(()=>{ const fix=[], skip=[];
    (state.ingredients||[]).forEach(i=>{ if(i.archived) return;
      const uu=canon(i.useUnit), pp=parsePU(i.purchaseUnit);
      if(!uu||!pp.unit){ if(Number(i.purchasePrice)>0) skip.push({name:i.name, why:"unit not kg/g/L/ml/each — check manually"}); return; }
      if(pp.size==null) return;                             // plain "kg" — nothing to parse
      const want=conv(pp.size, pp.unit, uu); if(want==null||!(want>0)) return;
      const now=Number(i.purchaseQty)||0; if(Math.abs(now-want)<0.000001) return;   // already correct
      const price=Number(i.purchasePrice)||0;
      fix.push({ id:i.id, name:i.name, unit:uu, packUnit:pp.unit, packSize:pp.size, from:now, to:+want.toFixed(6),
        oldCost: now>0?price/now:0, newCost: price/want });
    });
    return {fix, skip}; }, [state.ingredients]);
  const apply=()=>{ if(!plan.fix.length) return; if(!confirm(plan.fix.length+" ingredient(s) will be corrected. Continue?")) return;
    update(s=>{ plan.fix.forEach(f=>{ const t=(s.ingredients||[]).find(x=>x.id===f.id); if(t){ t.purchaseQty=f.to; t.purchaseUnit=f.packUnit; t.useUnit=f.unit; } }); }); };
  return <div>
    {plan.fix.length===0 ? <div className="text-sm text-stone-500">All ingredient units look correct — nothing to fix.</div> : <div>
      <div style={{fontSize:12.5,color:"#6b5e4e",marginBottom:8}}><b>{plan.fix.length}</b> ingredient(s) have a pack size baked into the unit (e.g. "1kg") but a wrong purchase qty, so their unit cost is off. Preview below, then apply.</div>
      <div style={{maxHeight:260,overflow:"auto",border:"1px solid var(--color-hairline-alpha)",borderRadius:10}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5}}>
          <thead><tr style={{background:"var(--color-canvas-parchment)"}}><th style={{textAlign:"left",padding:"7px 9px"}}>Ingredient</th><th style={{textAlign:"left",padding:"7px 9px"}}>Pack</th><th style={{textAlign:"right",padding:"7px 9px"}}>Now</th><th style={{textAlign:"right",padding:"7px 9px"}}>After</th></tr></thead>
          <tbody>{plan.fix.map(f=>(<tr key={f.id} style={{borderTop:"1px solid var(--color-hairline-alpha)"}}>
            <td style={{padding:"7px 9px",fontWeight:600}}>{f.name}</td>
            <td style={{padding:"7px 9px",color:"#8a7a63"}}>{f.packSize+f.packUnit} → {f.to}{f.unit}</td>
            <td style={{padding:"7px 9px",textAlign:"right",color:"#b0301f"}}>{money(f.oldCost)}/{f.unit}</td>
            <td style={{padding:"7px 9px",textAlign:"right",color:"#3e6b4a",fontWeight:700}}>{money(f.newCost)}/{f.unit}</td>
          </tr>))}</tbody>
        </table>
      </div>
      <div style={{marginTop:10}}><Btn size="sm" onClick={apply}>Fix {plan.fix.length} ingredient(s)</Btn></div>
    </div>}
    {plan.skip.length>0 && <div style={{marginTop:12}}>
      <div style={{fontSize:11,fontWeight:800,letterSpacing:1,textTransform:"uppercase",color:"#8a7a63",marginBottom:6}}>Needs manual check ({plan.skip.length})</div>
      <div style={{fontSize:12,color:"#6b5e4e",maxHeight:130,overflow:"auto"}}>{plan.skip.slice(0,60).map((x,i)=><div key={i}>· {x.name} — {x.why}</div>)}</div>
    </div>}
  </div>;
}

   person publishing a sheet ever needs it. The kitchen tablet opening that sheet just loads images. */
let pdfJsReady=null;
function ensurePdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfJsReady) return pdfJsReady;
  pdfJsReady=new Promise((res,rej)=>{
    const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    const el=document.createElement("script"); el.src=base+"pdf.min.js";
    el.onload=()=>{
      /* The worker CANNOT be pointed straight at the CDN: `new Worker(<other origin>)` is refused,
         pdf.js falls back to its in-page fake worker, and rendering then never completes (parsing
         still works, which makes it look like a hang rather than an error). Wrapping the CDN script
         in a same-origin blob that importScripts() it is the standard way round that. */
      try{
        const w=base+"pdf.worker.min.js";
        window.pdfjsLib.GlobalWorkerOptions.workerSrc=
          URL.createObjectURL(new Blob(["importScripts('"+w+"');"],{type:"application/javascript"}));
      }catch(e){ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.js"; }catch(e2){} }
      if(window.pdfjsLib) res(window.pdfjsLib); else { pdfJsReady=null; rej(new Error("PDF reader loaded but did not register")); } };
    el.onerror=()=>{ pdfJsReady=null; rej(new Error("could not load the PDF reader \u2014 check the connection")); };
    document.head.appendChild(el);
  });
  return pdfJsReady;
}
/* Turn a catering PDF into one JPEG per page. A sheet exported from Canva or Word is 1-3MB of
   vector and font data; the same pages as JPEGs come to a few hundred KB and live in Cloudinary
   instead of the Firestore state document. 1240px wide is ~150dpi for A4 - sharp on the kitchen
   tablet and still clean on paper. */
const PDF_PAGE_W=1240, PDF_JPEG_Q=0.72;
async function pdfToJpegFiles(file, onProgress){
  const lib=await ensurePdfJs();
  const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;
  const stem=file.name.replace(/\.pdf$/i,"");
  const out=[];
  /* pdf.js schedules its canvas rendering through requestAnimationFrame, and a browser freezes rAF
     in a background tab - switch away mid-upload and the conversion would stall forever. Swap in a
     timer while the page is hidden, and put the real rAF back when we are done. */
  const raf=window.requestAnimationFrame;
  window.requestAnimationFrame=cb=> document.hidden ? setTimeout(()=>cb(performance.now()),16) : raf.call(window,cb);
  try{
    for(let p=1;p<=doc.numPages;p++){
      if(onProgress) onProgress(p, doc.numPages);
      const page=await doc.getPage(p);
      const base=page.getViewport({scale:1});
      const viewport=page.getViewport({scale:Math.min(3, PDF_PAGE_W/base.width)});
      const cv=document.createElement("canvas");
      cv.width=Math.round(viewport.width); cv.height=Math.round(viewport.height);
      const ctx=cv.getContext("2d",{willReadFrequently:true});
      // PDF pages are transparent; JPEG has no alpha, so an unpainted canvas prints solid black
      ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
      await page.render({canvasContext:ctx, viewport}).promise;
      const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",PDF_JPEG_Q));
      if(!blob) throw new Error("page "+p+" could not be rendered");
      out.push(new File([blob], stem+"-p"+p+".jpg", {type:"image/jpeg"}));
    }
  } finally { window.requestAnimationFrame=raf; try{ doc.destroy(); }catch(e){} }
  return out;
}
/* Print the pages in their own window. Printing the modal would drag the whole app's chrome onto
   the paper, and one image per sheet is exactly what the kitchen wants. */
function printSheetPages(pages, title){
  const w=window.open("","_blank");
  if(!w){ alert("Allow pop-ups for this site to print the sheet, or open a page image in a new tab."); return; }
  const t=String(title||"Catering sheet").replace(/[<>&]/g," ");
  w.document.write("<!doctype html><meta charset='utf-8'><title>"+t+"</title>"
    +"<style>@page{margin:8mm}html,body{margin:0;background:#fff}"
    +"img{width:100%;display:block;page-break-after:always}img:last-child{page-break-after:auto}</style>"
    +pages.map(p=>"<img src='"+cld(String(p.url),1600,1).replace(/'/g,"%27")+"'>").join("")
    +"<script>window.onload=function(){window.focus();window.print();}<\/script>");
  w.document.close();
}

/* Publish a catering sheet by hand, from a PDF or a photo, and have it show on Today alongside the
   agent-published HTML sheets. A PDF is rasterised to one JPEG per page in the browser and the pages
   go to Cloudinary; app state keeps only the URLs. The earlier version stored the raw PDF base64
   across several Firestore documents - far bigger, and it ate into the shared 1MB state document. */
function CateringSheetUpload({state, update}){
  const ref=useRef();
  const [title,setTitle]=useState("");
  const [date,setDate]=useState(()=>new Date().toLocaleDateString("en-CA"));
  const [branch,setBranch]=useState("");
  const [msg,setMsg]=useState(""); const [bad,setBad]=useState(false); const [busy,setBusy]=useState(false);
  const fail=m=>{ setMsg(m); setBad(true); setBusy(false); };
  const onFile=async(file)=>{
    if(!file) return;
    setBad(false);
    const isPdf=file.type==="application/pdf"||/\.pdf$/i.test(file.name);
    const isImg=/^image\//.test(file.type)||/\.(jpe?g|png|webp|gif)$/i.test(file.name);
    if(!isPdf&&!isImg) return fail("Pick a PDF or an image.");
    setBusy(true);
    try{
      let files;
      if(isPdf){
        setMsg("Reading "+file.name+"\u2026");
        files=await pdfToJpegFiles(file,(p,n)=>setMsg("Converting page "+p+" of "+n+"\u2026"));
        if(!files.length) throw new Error("that PDF has no pages");
      } else files=[file];
      const pages=[];
      for(let k=0;k<files.length;k++){
        setMsg("Uploading page "+(k+1)+" of "+files.length+"\u2026");
        const up=await cloudinaryUpload(files[k], "catering");
        if(!up||!up.url) throw new Error("Cloudinary returned no image URL");
        pages.push({url:up.url, publicId:up.publicId||""});
      }
      const kb=Math.round(files.reduce((n,f)=>n+(f.size||0),0)/1024);
      update(s=>{ if(!Array.isArray(s.cateringSheets)) s.cateringSheets=[];
        s.cateringSheets.push({id:rid("cat"), date, branch,
          title:(title.trim()||file.name.replace(/\.(pdf|jpe?g|png|webp|gif)$/i,"")),
          client:"", pdf:true, pdfName:file.name, pages, archived:false}); });
      setTitle(""); setBusy(false);
      setMsg("Uploaded \u2713 "+pages.length+" page"+(pages.length===1?"":"s")+" \u00b7 "+kb+" KB \u2014 shows on Today from "+date+" onwards.");
    }catch(e){ fail("Upload failed: "+((e&&e.message)||e)); }
  };
  return <div>
    <div className="text-xs font-semibold mb-1" style={{color:"var(--color-ink)"}}>Upload a catering sheet (PDF or image)</div>
    <div className="text-[11px] mb-2" style={{color:"var(--color-ink-muted-48)"}}>
      A PDF is converted to one image per page before it uploads — a couple of hundred KB instead of a couple of MB, and it opens instantly on the kitchen tablet.
    </div>
    <div className="flex flex-wrap gap-2 items-center">
      <input className="inp" style={{flex:"1 1 200px", minWidth:180}} placeholder="Title (defaults to the file name)" value={title} onChange={e=>setTitle(e.target.value)} />
      <input type="date" className="inp" style={{width:160}} value={date} onChange={e=>setDate(e.target.value)} />
      <select className="inp" style={{width:170}} value={branch} onChange={e=>setBranch(e.target.value)}>
        <option value="">All stores</option>
        {(state.branches||[]).map(b=><option key={b.id} value={b.name}>{b.name}</option>)}
      </select>
      <input ref={ref} type="file" accept="application/pdf,.pdf,image/*" className="hidden" onChange={e=>{ const f=e.target.files[0]; e.target.value=""; onFile(f); }} />
      <Btn size="sm" onClick={()=>{ if(!busy) ref.current.click(); }}>{busy?"Working\u2026":"Choose file"}</Btn>
    </div>
    {msg && <div className="text-xs mt-2" style={{color: bad?"#d70015":"var(--color-ink-muted-48)"}}>{msg}</div>}
  </div>;
}

    </>}
    {sub==="integrations" && <>
